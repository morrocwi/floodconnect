  instruction field, ปัญหาชั้น 5.1 ของ STRUCTURAL_ISSUES_2026-09-28.md). เพิ่ม datum/area/
  lead_time (คุณภาพคำเตือน, TDRI framing 2026-09-28) -- ทุกแถว OPEN จริง ไม่มีแหล่งใดระบุ
  datum/lead_time เลย.
