# typology/edges/warns.yaml -- edge_kind=warns, 2-hop ALWAYS: agency -> warning_channel
# (hop 1) then warning_channel -> zone (hop 2, `soi_surface`-kind node group) (proposal
# §2/§4c). A direct agency -> zone row is never written -- every warning must name its
# channel (closes structural issue ISSUE-WARNING-01/5.1: non-actionable warnings). Every
# row carries a non-empty `instruction` (CAP 1.2 `instruction` field, RELAYED-not-fetched
# per proposal §3) -- validate.py rejects any warns row with a blank instruction.
#
# WARNING QUALITY fields (added 2026-09-28, TDRI framing -- a warning must state
# datum/reference ("1.5 m from where?"), affected area, safe destination/route, and
# arrive with lead time): `datum`, `area`, `lead_time` alongside `instruction`. Ties
# directly to this repo's OWN existing rule (docs/FLOW_STALL_TYPOLOGY.md: "ระดับพื้นดิน ≠
# ระดับผิวน้ำ" -- ground level != water level) -- a warning number with no stated
# reference/datum is the SAME structural failure as a station reading with no declared
# datum (`canal_graph.py`'s `REASON_DATUM_MISMATCH`). `tools/typology/validate.py`'s new
# "warning quality gaps" report lists every row missing one of these (non-error, by
# design -- matches this typology's whole OPEN-gap discipline). None of S9/S14's actual
# announcements state a datum or a lead time, so every row below has `datum: OPEN` and
# `lead_time: OPEN` -- never invented.
schema_version: 1
doc_kind: typology_edge_registry
edge_kind: warns
status_th: >
