# typology/nodes/sensors.yaml -- `sensor` node kind (proposal §1, optional/supplementary
# -- separate from the water-typology's own `Node.readings` mechanism, which this
# extension does NOT change; see proposal §0 "เจตนา sensor/observation แยกจาก node จริง").
# id scheme: SENSOR.<same code as the water node it is installed on>.
#
# Founder-forwarded independent-review fix (2026-09-28, applied here): the proposal
# document mixed "0/11" (tagged MEASURED) and "0/4" for Sammakorn's pump station count.
# The repo itself already records this as an OPEN conflict --
# docs/LAYER0_IN_OUT_CAPACITY.md §7 ("ปั๊มสัมมากร: โจทย์งานนี้อ้างถึง '0/11' แต่คลังนี้เองบันทึกไว้
# เพียง 4 ตัว (ST.SPS.01-04, ทั้งหมด 'ขัดข้อง') -- ความต่างนี้ยังเปิดอยู่") -- 4 STATION nodes
# (ST.SPS.01-04) all report status "ขัดข้อง" (fault); the MACHINE total (11, summed across
# the 4 stations' individual pump counts, per BMA PumpHistory's own per-station
# `pumps_on`/`pumps_total` fields read live in site/build_data.py) is a SEPARATE count
# from the station count. Never write a bare "0/11" here or anywhere downstream -- always
# "สถานี 4/4 ขัดข้อง · เครื่อง 0/11 เดิน" with the station-vs-machine split tagged OPEN
# (the per-station machine-count split, e.g. how many of the 11 sit at ST.SPS.02 vs
# ST.SPS.03, is not declared anywhere in this static registry -- only the live pipeline's
# `sammakorn.pumps` rows carry it, refreshed on demand (no fixed cadence, see AGENTS.md), not snapshotted here).
schema_version: 1
