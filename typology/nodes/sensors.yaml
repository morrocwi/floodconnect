  แก้ไขตามรีวิวอิสระ 2026-09-28: สถานี 4/4 ขัดข้อง ≠ เครื่อง 0/11 เดิน -- สองระดับต่างกัน ห้ามเขียน
  "0/11" เดี่ยว ๆ โดยไม่ระบุว่าเป็นระดับเครื่อง ไม่ใช่ระดับสถานี.
