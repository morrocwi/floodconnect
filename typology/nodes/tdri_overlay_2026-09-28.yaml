    capability_training: null
    capability_source: "TDRI (ดร.นิพนธ์ พัวพงศกร, 9 ธ.ค. 2025) -- same checklist, same OPEN status, no source states these for AG_DDPM"
  - id: AG_BMA_GOV
    permanence: permanent
