    permanence: permanent
    permanence_level_tag: INSTINCT
    level: national
    capability_operational_policy: null
    capability_roles_responsibilities: null
    capability_action_plan: null
    capability_monitoring_loop: null
    capability_logistics: null
    capability_training: null
    capability_source: >
      TDRI (ดร.นิพนธ์ พัวพงศกร, 9 ธ.ค. 2025) -- 6-element C3 checklist named in the article;
      whether AG_ONWR (Joint-KPI host) actually has each element is not stated by any
      source this check read, kept OPEN (null), never guessed.
  - id: AG_DDPM
    permanence: permanent
