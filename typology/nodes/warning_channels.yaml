# typology/nodes/warning_channels.yaml -- `warning_channel` node kind (proposal §1/§2),
# `phase` (normal|pre_event|incident|post_event, added 2026-09-28) applies TDRI's disaster-
# cycle vocabulary (ณัฐสิฏ รักษ์เกียรติวงศ์, tdri.or.th/.../anatomy-of-preventable-ruin...,
# 3 ธ.ค. 2025: ภาวะปกติ/ก่อนเกิดเหตุ/เกิดเหตุ/หลังเกิดเหตุ) to each row -- every channel below
# is cited from S9/S14 in the middle of the active 25-28 ก.ย. 2569 flood, so `phase: incident`
# throughout, tag INSTINCT (this check's own classification, TDRI did not name these specific
# channels).
# separated from `agency` because one agency issues warnings through several channels at
# once (S14: BMA used 5 channels simultaneously) -- see FLOW_STALL_TYPOLOGY_EXTENSION_
# PROPOSAL_2026-09-28.md §1 for the reasoning (CAP 1.2 models sender/channel separately too).
