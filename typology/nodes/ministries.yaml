# typology/nodes/ministries.yaml -- new node kind `ministry` (layer=power), the parent
# grouping used by typology/edges/part_of.yaml to place every agency in
# agencies_joint_kpi_2026-09-28.yaml (and a few from agencies.yaml) under its ministry/
# category, then every ministry/category under one `government` root node.
#
# `group_type` distinguishes a REAL กระทรวง (ministry) from the Joint-KPI document's other
# two grouping categories (องค์การมหาชน "public organization", รัฐวิสาหกิจ "state
# enterprise") and from กทม.'s own special local-government status -- none of the latter
# three are literally a "กระทรวง", kept honest in the label + group_type rather than
# silently calling them all ministries.
schema_version: 1
doc_kind: typology_node_registry
status_th: >
  Node kind ใหม่ "ministry" (รวม "government" root 1 node) -- โครงจากเอกสาร กพร. Joint KPI
  FY2569-2570 ผ่าน Lanner FB post (RELAYED, verification_status OPEN). ทุกแถวจริง ๆ คือ
  "หมวดหมู่ผู้ปกครองตามเอกสารนี้" ไม่ใช่ "กระทรวง" เสมอไป -- ดู group_type ต่อแถว.
