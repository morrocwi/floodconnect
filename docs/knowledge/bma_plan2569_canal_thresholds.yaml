meta:
  document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
  issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
  source_file_public: dds.bangkok.go.th public_content 0011290_1.pdf (322 pages; print stamp on p1 dated 23 พ.ค. 2569)
  page_convention: '`page` = PDF page number (1-based, physical). Printed appendix page labels (ก-1, ข-5, ง-25, จ-3, ฉ-13 ...) are given in `printed_page` where the parser could read them.'
  extraction_method: pdftotext -layout text layer, regex row parser (no OCR). `raw` is the verbatim text-layer line(s) the row came from; values are copied as printed, no unit conversion.
  glyph_note: 'The text layer renders some Thai glyphs inconsistently: in ch.1/appendix ง ''ำ'' often appears as ''า'' (น้า = น้ำ, ลาดับ = ลำดับ), in appendix ข ''า'' often appears as ''ำ'' (บำงกะปิ = บางกะปิ). `raw` keeps
    the layer as-is; `name`/`district` are lightly normalised only where the mapping is unambiguous (see `normalise()` in the extractor).'
  tag_default: MEASURED  # note: was "VERIFIED" -- a value read
  # by regex from a PDF text layer with known-damaged glyphs is a MEASURED read of
  # that file, not an independently-checked VERIFIED fact; parser-mapped fields
  # carry their own parse_confidence on top of this
  what: Per-structure เตือนภัย/วิกฤติ/ระดับควบคุม แผน ก/ข/ค (ม.รทก.) from ภาคผนวก ง (PDF p170-208) + the inter-agency operating agreements of §5.3.4 (PDF p32-33). This is the 'ระดับวิกฤต/เฝ้าระวัง for named canals' table the
    repo's canal_normal_levels.yaml said it could not find in the 2569 action plan (that file checked a different, shorter document, plan_2569.pdf = แผนปฏิบัติราชการ).
