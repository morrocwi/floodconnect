meta:
  document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
  issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
  source_file_public: dds.bangkok.go.th public_content 0011290_1.pdf (322 pages; print stamp on p1 dated 23 พ.ค. 2569)
  page_convention: '`page` = PDF page number (1-based, physical). Printed appendix page labels (ก-1, ข-5, ง-25, จ-3, ฉ-13 ...) are given in `printed_page` where the parser could read them.'
  extraction_method: pdftotext -layout text layer, regex row parser (no OCR). `raw` is the verbatim text-layer line(s) the row came from; values are copied as printed, no unit conversion.
  glyph_note: 'The text layer renders some Thai glyphs inconsistently: in ch.1/appendix ง ''ำ'' often appears as ''า'' (น้า = น้ำ, ลาดับ = ลำดับ), in appendix ข ''า'' often appears as ''ำ'' (บำงกะปิ = บางกะปิ). `raw` keeps
    the layer as-is; `name`/`district` are lightly normalised only where the mapping is unambiguous (see `normalise()` in the extractor).'
  tag_default: MEASURED  # note: was "VERIFIED" -- a value read
  # by regex from a PDF text layer with known-damaged glyphs is a MEASURED read of
  # that file, not an independently-checked VERIFIED fact; parser-mapped fields
  # carry their own parse_confidence on top of this
  table: ภาคผนวก ข งานระบบคลอง -- ภารกิจเปิดทางน้ำไหล/ขุดลอก/รักษาความสะอาดคูคลอง ประจำปี 2569 (กลุ่มงานบำรุงรักษาคลอง 1-4) PDF p93-112 (printed ข-1..ข-20)
  columns_as_printed: ลำดับ | รายชื่อคลอง | จาก | ถึง | ขนาด กว้าง/ม. | ยาว/ม. | ระดับขุดลอก (ม.รทก.) | พื้นที่เขต | Latitude | Longitude   (p108-112 Thonburi tables omit จาก/ถึง)
  what_these_numbers_are: 'Maintenance-plan reaches: printed width RANGE (m), reach length (m) and DREDGE level (m MSL) of the reach scheduled for 2569 maintenance. They are not a hydraulic design-capacity table: NO design_capacity_m3s
    and NO depth column exists anywhere in this plan for canals (grep of the full text layer for ''ลบ.ม./วินาที'' near canal names finds only pump/tunnel/intake capacities). design_capacity_m3s is therefore absent on every
    row, not zero.'
  canal_totals_p63_quote: คู คลองระบายน้ำ จำนวนทั้งสิ้น 1,980 คลอง ความยาวรวม ประมาณ 2,744 กิโลเมตร แบ่งเป็น สำนักการระบายน้ำจำนวน 233 คลอง ความยาวประมาณ 1,002 กิโลเมตร สำนักงานเขตจำนวน 1,747 คลอง ความยาวประมาณ 1,742 กิโลเมตร
    (PDF p63, ก-9)
  drain_pipes_p63_quote: ท่อระบายน้ำ ความยาวประมาณ 6,854 กิโลเมตร แบ่งเป็นถนนสายหลัก 2,149 กิโลเมตร ในตรอก ซอย ยาวประมาณ 4,705 กิโลเมตร (PDF p63)
  cannot_widen_quote_p55: การระบายน้ำออกจากพื้นที่โดยขีดความสามารถของสถานีสูบน้ำและคลองระบายน้ำจึงมีความจำเป็น แต่ก็มีขีดจำกัดจากการที่ไม่สามารถปรับปรุงขยายความกว้างของคลองได้ จึงทำให้เพิ่มขีดความสามารถการระบายน้ำไม่ได้ เนื่องจากปัญหาการรุกล้ำคู
    คลองสาธารณะ (PDF p55, ก-1; text-layer line 1633)
  cannot_dredge_quote_p20: คู คลองถูกรุกล้ำจนแคบไม่สามารถขุดลอกได้ลึกเพียงพอ จึงจำเป็นต้องสร้างเขื่อนคอนกรีตเสริมเหล็กริมคลองก่อนเท่านั้น (PDF p20, §2.2.2)
  comparison_with_repo:
    capacity_ledger_led:bkk_east_canals_summary: 'capacity_value null / OPEN -- ''No single stated m3/s conveyance capacity exists for the canal reaches''. This plan CONFIRMS that finding: it too states no canal conveyance
      capacity, only widths/lengths/dredge levels. Not a contradiction.'
