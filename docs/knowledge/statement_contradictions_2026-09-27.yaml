# statement_contradictions_2026-09-27.yaml -- "statement vs gauge" contradiction rows.
#
# tools/reconcile.py (read before writing this file) only reconciles TWO SOURCES against
# EACH OTHER for the SAME station_code (bma_watermap vs thaiwater_canal_waterlevel) -- it
# has no mechanism for comparing a narrative agency STATEMENT against this repo's own
# gauge readings. This file fills that gap with a new, small, append-only ledger rather
# than editing reconcile.py (out of this check's write scope; other workers active in this
# worktree). Never averages/prefers a side -- both the statement and the gauge readings are
# kept, tagged, and left OPEN.
#
# Check performed: official BMA Facebook post (site visit 2026-09-27T14:55:00+07:00 =
# 2026-09-27T07:55:00Z) states "ระดับน้ำในคลองแสนแสบเริ่มลดลง" (Saen Saep canal water level
# is starting to fall). Compared against every WL.SSB.* gauge in data/observations.sqlite
# with a reading in the window 2026-09-27T07:00Z-13:00Z, EXCLUDING WL.SSB.08 (flagged
# `suspect: true` by site/build_data.py's neighbour_consistency_check/
# saensaeb_suspect_check -- see docs/SAMMAKORN_STANDING_WATER_2026-09-27.md §3's own
# retraction box for why SSB.08 is excluded here, per this check's own instruction).
#
# Query used (VERIFIED, run this check directly against data/observations.sqlite):
#   SELECT source_id, station_code, observed_at_utc, value FROM observations
#   WHERE station_code IN ('WL.SSB.01','WL.SSB.03','WL.SSB.04','WL.SSB.06','WL.SSB.07',
#     'WL.SSB.09','WL.SSB.10','WL.SSB.12')
#   AND observed_at_utc BETWEEN '2026-09-27T07:00:00' AND '2026-09-27T13:00:00'
#   ORDER BY station_code, observed_at_utc;
# (WL.SSB.02/05/11 have asset rows but were not returned by this query in this window --
# no reading found for them in that range; not claimed as evidence either way, OPEN.)

statement_vs_gauge:
  - id: "stmt_vs_gauge:2026-09-27T1455+07_saensaeb_declining"
    statement:
      text_th: "ระดับน้ำในคลองแสนแสบเริ่มลดลง"
      text_en: "Saen Saep canal water level is starting to fall"
      source: "official BMA Facebook page post, site visit 2026-09-27T14:55:00+07:00"
      tag: RELAYED
    gauge_comparison_window_utc: "2026-09-27T07:00:00 to 2026-09-27T13:00:00"
    excluded: ["WL.SSB.08 (suspect: true, per site/build_data.py neighbour-consistency
      check -- see docs/SAMMAKORN_STANDING_WATER_2026-09-27.md §3 retraction box)"]
    gauges_checked_verified_query_results:
      - station: "WL.SSB.01"
        name_th: "ค.แสนแสบ-โบ๊เบ๊"
        warning_m: 0.6
        critical_m: 0.7
        readings_m: [-0.09, -0.09, -0.13, -0.15, -0.15, -0.16, -0.15, -0.15, -0.14, -0.14,
          -0.14, -0.14, -0.13, -0.14]
        trend: "mild decline (~0.07 m over the window), below warning throughout -- the
          ONLY station in this set showing a clear downward trend"
        tag: MEASURED
      - station: "WL.SSB.03"
        name_th: "ค.แสนแสบ-อโศก"
        warning_m: 0.0
        critical_m: 0.15
        readings_m: [0.34, 0.33, 0.3, 0.27, 0.26, 0.28, 0.26, 0.27, 0.26, 0.25, 0.25, 0.26,
          0.24, 0.23]
        trend: "mild decline (~0.1 m), still ABOVE critical (0.15 m) throughout the window"
        tag: MEASURED
      - station: "WL.SSB.04"
        name_th: "ส.แสนแสบ-คลองตัน"
        warning_m: 0.0
        critical_m: 0.2
        readings_m: [0.32, 0.32, 0.29, 0.28, 0.28, 0.29, 0.29, 0.29, 0.28, 0.28, 0.28, 0.28,
          0.26, 0.26]
        trend: "mild decline (~0.06 m), still ABOVE critical (0.2 m) throughout"
        tag: MEASURED
      - station: "WL.SSB.06"
        name_th: "ค.แสนแสบ-เจ้าคุณสิงห์"
        warning_m: 0.2
        critical_m: 0.35
        readings_m: [0.52, 0.52, 0.48, 0.51, 0.49, 0.5, 0.5, 0.48, 0.48, 0.47, 0.49, 0.47,
          0.46, 0.47]
