      - station: "WL.SSB.07"
        name_th: "ค.แสนแสบ-สนข.บางกะปิ (nearest Sammakorn-side gauge in this set)"
        warning_m: 0.35
        critical_m: 0.45
        readings_m: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]
        trend: "COMPLETELY FLAT at 0.40 m for the entire window (between warning 0.35 and
          critical 0.45) -- zero movement, no decline"
        tag: MEASURED
      - station: "WL.SSB.09"
        name_th: "ปตร.คลองแสนแสบ-บางชัน (gate, bottleneck_nodes rank 3)"
        warning_m: null
        critical_m: null
