# docs/knowledge/api_census_additions_missing_inputs_2026-09-27.yaml
#
# Purpose: additions to sources/api_census.yaml's schema (NOT an edit of that file -- write-scope
# for this check is NEW files only). Founder question: "เราต้องการหาสิ่งที่ขาดจาก API ภายนอกที่หาง่าย
# ที่สุด" -- one row per external source probed this check while looking for the missing inputs to
# PROP-FLOOD-03's per-sub-polder 72h water-balance run: Q_up (upstream inflow), tide/boundary,
# antecedent wetness S_0, ground elevation z, runoff coefficient c, historical flood events for
# D_critical calibration, BMA drain flow, TMD 7-day forecast.
#
# Same tag vocabulary as sources/api_census.yaml:
#   VERIFIED -- this check fetched the URL and saw the payload.
#   RELAYED  -- seen on a portal/menu/prior census entry, not fetched by this check.
#   OPEN     -- existence/shape unknown or unresolved after the probe attempted.
# status vocabulary: connected (already in registry.yaml) | reachable (2xx/plausible) |
#   unreachable (non-2xx/timeout) | needs_key | needs_signup | unknown (not probed).
#
# See docs/knowledge/EASIEST_EXTERNAL_APIS_FOR_MISSING_INPUTS_2026-09-27.md for the full readout,
# ranking, and the scope-escalation note (this check did NOT wire anything into collect.py/
# sources/registry.yaml/data/observations.sqlite -- proposal only, per its own write-scope).

census_date: "2026-09-27"
probe_budget_used: 20
probe_budget_ceiling: "25 base + 5 raised for data.hii.or.th + 10 raised for arcgis-family hosts (used 5/10)"

