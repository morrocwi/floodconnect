meta:
  document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
  issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
  source_file_public: dds.bangkok.go.th public_content 0011290_1.pdf (322 pages; print stamp on p1 dated 23 พ.ค. 2569)
  page_convention: '`page` = PDF page number (1-based, physical). Printed appendix page labels (ก-1, ข-5, ง-25, จ-3, ฉ-13 ...) are given in `printed_page` where the parser could read them.'
  extraction_method: pdftotext -layout text layer, regex row parser (no OCR). `raw` is the verbatim text-layer line(s) the row came from; values are copied as printed, no unit conversion.
  glyph_note: 'The text layer renders some Thai glyphs inconsistently: in ch.1/appendix ง ''ำ'' often appears as ''า'' (น้า = น้ำ, ลาดับ = ลำดับ), in appendix ข ''า'' often appears as ''ำ'' (บำงกะปิ = บางกะปิ). `raw` keeps
    the layer as-is; `name`/`district` are lightly normalised only where the mapping is unambiguous (see `normalise()` in the extractor).'
  tag_default: MEASURED  # note: was "VERIFIED" -- a value read
  # by regex from a PDF text layer with known-damaged glyphs is a MEASURED read of
  # that file, not an independently-checked VERIFIED fact; parser-mapped fields
  # carry their own parse_confidence on top of this
  what: 'Hand-transcribed narrative tables (tunnels, levees, polder areas, system counts, installation summary, inventory, budget, telemetry, pipe jacking, design storm) + parser-extracted lists (38 sub-polders, 124 key projects
    2569). Coordinates: none of these classes carry coordinates in the plan except via the station/control tables in the sibling YAMLs.'
  comparison_with_repo:
    tunnels: 'capacity_ledger holds 13 tunnel rows (5 with capacity: sukhumvit26 4, khlong_prem_diversion 30, sukhumvit36 6, sukhumvit42 6, phayathai 4.5, saensaeb_ladprao 60, bangsue 60, nongbon 60, makkasan 45). Plan p64-65
      AGREES on เปรมประชากร 30, มักกะสัน 45, แสนแสบ-ลาดพร้าว 60, บางซื่อ 60, หนองบอน 60 and gives the 5-tunnel total 255 m3/s + 8 planned 370 m3/s (NEW). The SpringNews-only rows (สุขุมวิท 26/36/42, พญาไท) are NOT in this
      plan''s tunnel list at all (they are pump/drain systems, not the 13 large tunnels) -- OPEN whether they belong in the ''tunnel'' class. อุโมงค์พระราม 9-รามคำแหง (tunnel:hand_declared) does not appear in the plan under
      that name -- OPEN.'
    levees: 'repo levee class: 2 rows, no lengths/crests. Plan gives 19 segment rows with lengths/crests -- all NEW attributes.'
    pump_stations_count: repo OPEN 195 vs 200; plan adds 199 (ง-3, สคน. scope, Dec 2568) and 207 (ก-9, system scope). Keep all four, OPEN.
    gates_count: repo 243 (rocketmedialab) matches plan ง-3 243; plan ก-9 says 244.
    design_rainfall: led:design_rainfall_standard 80 mm/day + 58.7 mm/h AGREES (p63 verbatim). The 'conflicting 76 mm/hr' figure in the ledger note is the plan's FUTURE target (104 mm/day = 76 mm/h, p64), not a competing current
      value -- RESOLVES that OPEN as 'different basis (current vs future)'.
