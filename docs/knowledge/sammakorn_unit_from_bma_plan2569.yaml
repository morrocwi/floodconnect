# New file only, added 2026-09-27 (BMA flood plan 2569 extraction). Not merged into any registry; not committed as part of this change.
meta:
  document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
  issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
  source_file_public: dds.bangkok.go.th public_content 0011290_1.pdf (322 pages; print stamp on p1 dated 23 พ.ค. 2569)
  page_convention: '`page` = PDF page number (1-based, physical). Printed appendix page labels (ก-1, ข-5, ง-25, จ-3, ฉ-13 ...) are given in `printed_page` where the parser could read them.'
  extraction_method: pdftotext -layout text layer, regex row parser (no OCR). `raw` is the verbatim text-layer line(s) the row came from; values are copied as printed, no unit conversion.
  glyph_note: 'The text layer renders some Thai glyphs inconsistently: in ch.1/appendix ง ''ำ'' often appears as ''า'' (น้า = น้ำ, ลาดับ = ลำดับ), in appendix ข ''า'' often appears as ''ำ'' (บำงกะปิ = บางกะปิ). `raw` keeps
    the layer as-is; `name`/`district` are lightly normalised only where the mapping is unambiguous (see `normalise()` in the extractor).'
  tag_default: VERIFIED (read from the text layer of the official PDF; parser-mapped fields carry parse_confidence)
  purpose: 'Everything this plan says about the Sammakorn (สัมมากร, รามคำแหง 112, เขตสะพานสูง) unit, to fill the PROP-FLOOD-06 sammakorn unit (FOUNDER_TASKS #19: A_U_km2 / c_U / D_H missing). Founder pointer: ''มีรายละเอียดและขนาดคลองต่างๆชัดเจน
    และมีตำแหน่งของบึงสัมมากรด้วยว่าเป็นแก้มลิง''.'
pond:
  name_as_printed: บึงรับน้ำหมู่บ้านสัมมากร
  storage_m3: 227200
  list_position: ลำดับที่ 25 ของ 35 แก้มลิงฝั่งพระนคร
  page: 79
  printed_page: ก-25
  raw: 25 | บึงรับน้ำหมู่บ้านสัมมากร | 227,200
  table_header_as_printed: ลำดับที่ | แก้มลิง | ปริมาตรเก็บกัก (ลบ.ม.)
  columns_available: capacity only -- this list has no canal/pump/level/district/lat/lon columns
  coordinates_in_plan: none in the pond lists; nearest official point = WL.SMK.01 gauge (p257) and สถานีสูบน้ำบึงที่ 2 (p191)
  tag: VERIFIED
  status_quote_p83: มีบึงหมู่บ้านเอกชนที่อนุญาตให้เข้าไปดำเนินการ ได้แก่ บึงหมู่บ้านสัมมากร เขตสะพานสูง หมู่บ้านศุภาลัย เขตมีนบุรี หมู่บ้านเมืองทองการ์เด้น หมู่บ้านเมืองทอง 2/1 และหมู่บ้านเมืองทอง 2/2 เขตประเวศ ซึ่งช่วยแก้ไขปัญหาน้ำท่วมใน
    หมู่บ้านดังกล่าวและบริเวณพื้นที่ใกล้เคียง
  what_bma_is_allowed_to_do_quote_p83: พื้นที่แก้มลิงเอกชน ซึ่งเป็นที่ลุ่ม บึง สระ ทะเลสาบ แอ่งน้ำ ที่อยู่ในพื้นที่เอกชน เช่นบึงทะเลสาบหมู่บ้านจัดสรร กรุงเทพมหานครได้เข้าไปติดต่อประสานเจ้าของบึง ขอใช้เป็นแก้มลิงเพื่อรองรับน้ำในฤดูฝน
    โดยประสานเข้าไปปรับปรุงบึง ก่อสร้างบ่อสูบน้ำ ประตูระบายน้ำ พร้อมติดตั้งเครื่องสูบน้ำ เพื่อลดระดับน้ำในบึงดังกล่าว เตรียมรองรับฝนตกในช่วงฤดูฝน
  reading: 'Ownership private (หมู่บ้าน), operation by BMA with the owner''s permission (improve pond, build pump pit/gate, install pumps, pre-lower the level before rain). This is the ''แก้มลิง'' status the founder asked
    to confirm: VERIFIED.'
