# New file only, added 2026-09-27 (BMA flood plan 2569 extraction). Not merged into any registry; not committed as part of this change.
schema_note: 'Rows follow sources/coping_thresholds.yaml''s row schema exactly (unit, variable, value, unit_of_value, outcome, cause, event, date, station, source, tag, note). NEW outcome value `official_threshold` is proposed
  for agency-declared operating/alert thresholds (neither an observed flood nor a design capacity) -- the registry owner must accept it before merge; until then these rows are NOT merged. New variables: rain_intensity_mm_h,
  river_level_m_msl, pond_storage_m3, pump_capacity_m3s.'
document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
agreements_and_contradictions:
  AGREE_design_80mm_day: p63 quote identical to the existing bangkok_east design row (which cites the same figure via docs/CAPACITY.md).
  RESOLVED_60_vs_80: 'not a conflict: 60 mm/HOUR (§4.1.3 target, §5.1 band edge) vs 80 mm/DAY (= 58.7 mm/h per the plan''s own conversion). Propose closing the OPEN as ''unit basis''.'
  RESOLVED_76mm_h: 76 mm/h is the FUTURE target (104 mm/day, p64), not a current design figure.
  CONSISTENT_crisis_203mm: the 26-27 Sep 2569 readings 203-205 mm/24h are 2.5x the 80 mm/day design and above the 12-yr 24-h depth of 163.2 mm in the p18 IDF table (VERIFIED table; the return-period statement is the plan's,
    RELAYED).
  CONSISTENT_C13_3721: 'C.29B critical <= 3,500 m3/s (§5.1) and BKK reach no-overbank 2,500-3,500 (§2.1.3) sit below the existing C.13 flooded_min 3,721 -- same ordering, different stations; no contradiction. The ''2,500-3,500
    without overbank'' line is the BKK-reach statement, coped_max 2,800 is C.13''s bank-overflow figure: keep separate.'
  NEW_river_level_ladder: +1.20 / +1.50-1.80 / >+1.80 (§5.1) / +2.00 defence-failure (§9.2.1) / +2.53 max 2554 / +2.25 max 2568 at ปากคลองตลาด -- the repo held no BKK river-LEVEL thresholds.
  CONTRADICTION_sammakorn_pump_ownership: AGENTS.md §8 / docs/CAPACITY.md §2 state ST.SPS.01-04 are 'Sammakorn village's own pumps, not BMA's' with no capacity data. This plan lists all four (by identical names and identical
    coordinates to the repo's pumphistory rows) under สำนักงานระบบควบคุมน้ำ กลุ่มงานระบบควบคุมน้ำตะวันออก with capacities 4 / 1 / 0.75 / 2 m3/s (p191). OPEN which statement is right; the plan is the official document.
