# New file only, added 2026-09-27 (BMA flood plan 2569 extraction). Not merged into
# any registry. (Note: this comment used to say "not
# committed as part of this change" -- stale, this file IS committed and shipped
# in the public MVP tree.)
meta:
  document: แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วมกรุงเทพมหานคร เนื่องจากน้ำฝนและน้ำหนุน ประจำปี 2569 (ในส่วนความรับผิดชอบของสำนักการระบายน้ำ กรุงเทพมหานคร)
  issuer: สำนักการระบายน้ำ กรุงเทพมหานคร (BMA Department of Drainage and Sewerage)
  source_file_public: dds.bangkok.go.th public_content 0011290_1.pdf (322 pages; print stamp on p1 dated 23 พ.ค. 2569)
  page_convention: '`page` = PDF page number (1-based, physical). Printed appendix page labels (ก-1, ข-5, ง-25, จ-3, ฉ-13 ...) are given in `printed_page` where the parser could read them.'
  extraction_method: pdftotext -layout text layer, regex row parser (no OCR). `raw` is the verbatim text-layer line(s) the row came from; values are copied as printed, no unit conversion.
  glyph_note: 'The text layer renders some Thai glyphs inconsistently: in ch.1/appendix ง ''ำ'' often appears as ''า'' (น้า = น้ำ, ลาดับ = ลำดับ), in appendix ข ''า'' often appears as ''ำ'' (บำงกะปิ = บางกะปิ). `raw` keeps
    the layer as-is; `name`/`district` are lightly normalised only where the mapping is unambiguous (see `normalise()` in the extractor).'
  tag_default: MEASURED  # note: was "VERIFIED" -- a value read
  # by regex from a PDF text layer with known-damaged glyphs is a MEASURED read of
  # that file, not an independently-checked VERIFIED fact; parser-mapped fields
  # carry their own parse_confidence on top of this
  tables:
  - ภาคผนวก ก 'พื้นที่รองรับและเก็บกักที่สามารถจัดหาไว้ได้แล้ว 38 แห่ง' + กำลังก่อสร้าง 4 + ปรับปรุง 4 + จะจัดหาเพิ่มเติม 20 (PDF p78-81, ก-24..ก-27) -- capacity list, no coordinates
  - ภาคผนวก ข 'ภารกิจรักษาความสะอาดบึงรับน้ำ ประจำปี 2569' (PDF p98-99, p103, p107) -- 17 ponds WITH coordinates, volumes, area, dredge level
  summary_quotes:
    p78: ปัจจุบันสำนักการระบายน้ำ สามารถจัดหาพื้นที่รองรับและเก็บกักน้ำไว้ได้แล้ว จำนวน 38 แห่ง เก็บกักน้ำได้ประมาณ 13.71 ล้านลูกบาศก์เมตร โดยฝั่งตะวันออกของแม่น้ำเจ้าพระยา (ฝั่งพระนคร) จำนวน 35 แห่ง เก็บกักน้ำได้ประมาณ 7.68
      ล้านลูกบาศก์เมตร ฝั่งตะวันตกของแม่น้ำเจ้าพระยา (ฝั่งธนบุรี) จำนวน 3 แห่ง เก็บกักน้ำได้ประมาณ 6.03 ล้านลูกบาศก์เมตร
    p83_need: พื้นที่ด้านตะวันออกของกรุงเทพมหานคร ต้องการแก้มลิงเพื่อรองรับน้ำเพื่อป้องกันน้ำท่วม ประมาณ 13 ล้านลูกบาศก์เมตร แต่ขณะนี้สามารถจัดหาได้ 34 แห่ง เก็บกักน้ำได้ประมาณ 7.64 ล้านลูกบาศก์เมตร ต้องการเพิ่มเติมอีกประมาณ
      5.36 ล้านลูกบาศก์เมตร
    p83_private_ponds: มีบึงหมู่บ้านเอกชนที่อนุญาตให้เข้าไปดำเนินการ ได้แก่ บึงหมู่บ้านสัมมากร เขตสะพานสูง หมู่บ้านศุภาลัย เขตมีนบุรี หมู่บ้านเมืองทองการ์เด้น หมู่บ้านเมืองทอง 2/1 และหมู่บ้านเมืองทอง 2/2 เขตประเวศ ซึ่งช่วยแก้ไขปัญหาน้ำท่วมใน
      หมู่บ้านดังกล่าวและบริเวณพื้นที่ใกล้เคียง
    p63_pump_pits_of_ponds: บ่อสูบน้ำของแก้มลิง 12 แห่ง; บ่อสูบน้ำของ Water Bank 4 แห่ง
