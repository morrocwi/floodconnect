      AS_HOKWA->AS_EAST_UPPER (unnamed capacity); this row proposes routing that arm
      explicitly through the named Saen Saep/Lat Phrao tunnel structure this repo already
      tracks, rather than the generic AS_EAST_UPPER node. Design direction: OUT of Hok Wa
      toward the river -- NOT a route by which Bang Pakong water enters Lat Phrao (see
      card §6.2 verdict).
    backwater_risk: OPEN

  # ---- PROPOSED: AS_HOKWA as junction, arm 2 (NEW, toward Bang Pakong via canal 13) ----
  - src: "AS_HOKWA"
    dst: "new:pump_rid_khlong13"
    controller: {value: "rid", tag: VERIFIED, source: "plan50 PDF p.40, explicitly attributed to กรมชลประทาน"}
