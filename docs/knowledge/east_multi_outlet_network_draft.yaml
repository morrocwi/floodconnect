readout_goal:
  question_th: >
    "outlet ไหนมี head/ความจุเหลือตอนนี้ และผู้ควบคุมเลือกส่งไปทางไหน เพราะอะไร"
  answerable_with_live_feeds_that_exist_today:
    - "watergate_load / canal_waterlevel stations already in sources/registry.yaml for ssb10/ssb09/pwt03/pwt04 (water level only, NOT flow/capacity)"
  missing_feeds_needed_to_actually_answer_it:
    - "no flow-rate (m3/s) telemetry for any node in this file -- only water_control band levels exist for the 4 BMA gates (see sources/bottleneck_nodes_2026-09-27.yaml, utilisation OPEN for all of them)"
    - "no capacity_m3s reading at all for new:pump_rid_khlong13, new:pump_chonlahan_phichit_3, new:pump_charoen_rat, new:canal_phra_ong_chaiyanuchit"
    - "no gravity_threshold (river/tide level that forces gate closure + pump takeover) for any outlet in this file -- OPEN everywhere per capacity_ledger.yaml's own note"
    - "no controller field exists today in water_system_dag.mmd or east_chain.yaml -- this file's `controller` column is a proposal, not a live attribute"
  conclusion: >
    With today's data, this question is REFUSED for every outlet in this network (Toledo/
    never-guess discipline) -- not because the outlets don't matter, but because no source
    this repo has ingested publishes a live m3/s or head reading per structure, only
    design/rated capacities (themselves partly CONTRADICTED, e.g. Phra Khanong 49/155/173).
