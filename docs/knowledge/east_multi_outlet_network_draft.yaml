# east_multi_outlet_network_draft.yaml -- PROPOSED multi-outlet network for BKK east zone
#
# Written 2026-09-27 per founder request (cross-check a third-party analysis + a 8-URL
# reference list + a Hok Wa junction follow-up, all RELAYED third-party paste, see
# docs/knowledge/card_thirdparty_east_outlets_multi_outlet_2026-09-27.md for the full claim
# table / verdict / fetch log this file is built from).
#
# THIS FILE WRITES NEW DATA ONLY -- does not edit water_system_dag.mmd, east_chain.yaml,
# capacity_ledger.yaml, or any tracked file. Another worker is the sole committer on this
# branch this check. Existing ids are REUSED (never duplicated); new ids are minted only
# where no equivalent exists anywhere in this repo (checked via grep this check).
#
# Toledo: no equation in this file. capacity_m3s values are copied verbatim from cited
# sources (VERIFIED = read directly from an official page/PDF this check; RELAYED = not
# independently checked; OPEN = no source found, never guessed).
#
# readout_goal (founder's own words, translated): "outlet ไหนมี head/ความจุเหลือตอนนี้ และ
# ผู้ควบคุมเลือกส่งไปทางไหน เพราะอะไร" -- this file proposes the schema (controller, mode,
# capacity_m3s, backwater_risk) that would let a future readout answer this; it does NOT
# compute an answer itself (all utilisation/head fields below are OPEN, per this repo's
# Toledo/never-guess discipline).

schema_note: >
  Each node: id (existing id reused where possible, `new:` prefix where minted),
  label_th, kind (canal|pump|gate|outlet|junction), reused_from (source file+row, or
  "NEW" if minted), lat/lon (OPEN if not found), tag.
  Each edge: src, dst, controller (bma|rid|shared|OPEN), mode (gravity|pump|gate|OPEN),
  capacity_m3s (number + tag, or OPEN), direction_policy_note, backwater_risk (OPEN by
  default -- a flag for future stage-dependent analysis, not a computed value; see
  PROP-FLOOD-06 D_H/R_H term-selection in docs/knowledge/DRAINAGE_MODE_SOURCES.md §5 --
  no new equation registered here).
  readout_goal: per-outlet, which live feeds (watergate_load, canal_waterlevel station ids)
  would answer "which outlet has head/remaining capacity now, and why did the controller
  route water there" -- and which are absent (OPEN) today.

