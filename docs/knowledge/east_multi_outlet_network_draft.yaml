        load pushed onto Arm 1/Lat Phrao) -- ties to PROP-FLOOD-06's D_H/R_H
        term-selection logic already in docs/knowledge/DRAINAGE_MODE_SOURCES.md §5. No
        new equation is proposed or registered here; no measured propagation exists in
        this repo today.

