    mode: {value: "pump", tag: VERIFIED}
    capacity_m3s: {value: "≥190 (target) + a separate 100 m3/s canal", tag: VERIFIED, source: "monitor.bangkok.go.th pid=11000000-7193, quote: \"ลงสู่แก้มลิงคลองชายทะเลตามแนวพระราชดำริและคลอง ๑๐๐ ลบ.ม./วินาที...ไม่น้อยกว่า ๑๙๐ ลบ.ม./วินาที\""}
    direction_policy_note: >
      This is the BMA-side master-plan target for the area outside the King's dyke
