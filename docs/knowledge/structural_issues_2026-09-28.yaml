      authority, de facto รับแรงกดดันสองทาง.
    actors_affected: ["ชุมชนฝั่งรับภาระ (นอกคัน/ปลายน้ำ)"]
    actors_with_power: ["กรมชลประทาน (RID)", "ผู้ว่าฯ กทม./รองผู้ว่าฯ"]
    typology_tags:
