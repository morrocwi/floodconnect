schema_version: 1
doc_kind: structural_issue_register
status_th: >
  ทะเบียนปัญหาเชิงโครงสร้าง — ย้ายจาก scratchpad (สถานะเดิม proposal_not_yet_toledo) เข้าคลังจริงแล้ว
  โดยงาน "ทำให้เชื่อมกันหละ" 2026-09-28 (ตาม FLOW_STALL_TYPOLOGY.md §10 + docs/TYPOLOGY_GRAPH.md).
  ไม่มีสมการในไฟล์นี้ (ไม่มีอะไรถูก "derive"). รูปแบบไฟล์นี้ต่อยอดจาก
  docs/knowledge/structural_failure_hazard_class_2026-09-28.yaml (schema_version/doc_kind/status_th
  pattern เดิม) — ไม่ใช่ schema คู่ขนานใหม่. แถวด้านล่างคือปัญหาเชิงโครงสร้างจาก
  STRUCTURAL_ISSUES_2026-09-28.md แปลงเป็น machine-readable rows พร้อม typology tag ที่อ้างอิง
  ทะเบียนจริง `typology/nodes/*.yaml`/`typology/edges/*.yaml` (ไม่ใช่ proposal เฉย ๆ อีกต่อไป --
  node/edge kind ที่ถูกอ้างถึงถูก implement แล้วใน `tools/typology/build_graph.py`).
  แก้ไขตามรีวิวอิสระ 2026-09-28: ตัวเลขปั๊มสัมมากรแก้เป็น "สถานี 4/4 ขัดข้อง · เครื่อง 0/11 เดิน"
  ทุกแถว (เดิมปนกัน 0/11 กับ 0/4), และ `decides` ในทะเบียนจริงไม่ชี้ไปที่ `edge` อีกต่อไป (ดู
  edges/owned_by.yaml, edges/decides.yaml). registered in docs/knowledge/INDEX.yaml.
