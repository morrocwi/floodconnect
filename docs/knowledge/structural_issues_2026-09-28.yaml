      10 กระทรวง/6 คณะกรรมการชาติ.
    actors_affected: ["ประชาชนทุกฝั่งประตูน้ำ", "อปท./เขต"]
    actors_with_power: ["31 กรม (10 กระทรวง)", "สทนช.", "6 คณะกรรมการระดับชาติ"]
    typology_tags:
      node_kinds: ["agency"]
      edge_kinds: []
      status: "PROPOSAL-in-FLOW_STALL_TYPOLOGY_EXTENSION_PROPOSAL_2026-09-28.md sec1"
    evidence:
      - {source: "card_research_thai_flood_governance_fragmentation.md (a)1, OECD Development Matters 2018", tag: RELAYED}
    counter_evidence:
      - {source: "เหตุการณ์นี้เองยังไม่มีเอกสารวิเคราะห์ระดับปฏิบัติการวันต่อวันที่ยืนยันผลของ fragmentation โดยตรง", tag: OPEN}
    floodconnect_signal: "missing -- ไม่มีหน้าแสดงผังอำนาจต่อผู้ใช้"
    status: OPEN

