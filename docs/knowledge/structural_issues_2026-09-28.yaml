      - {source: "แถลงทางการ (S4/S6) ไม่ยืนยันรายละเอียดเฉพาะจุดที่ S2 อ้าง -- เก็บคู่กัน ไม่เลือกฝั่ง", tag: OPEN}
    floodconnect_signal: "docs/knowledge/structural_failure_hazard_class_2026-09-28.yaml pattern + burden ledger (site build_burden_ledger_section_html) -- อนุมานมีอยู่แล้ว, ยังไม่แสดงเป็นภาษาประชาชน"
