      - {source: "S2 (Facebook post, unverified): ยกประตูลาดกระบัง 50 ซม. + เปิดเต็มวัดกระทุ่มเสือปลา เพราะสถานีสูบประเวศบุรีรมย์ปั๊มออกบางปะกงไม่ได้", tag: "RELAYED-unverified"}
      - {source: "S4/S6 (แถลงทางการ กทม. 28 ก.ย.): ระบายเต็มกำลังทางแสนแสบ-ประเวศ, ลดแสนแสบ-ประเวศเพื่อรับน้ำ", tag: RELAYED}
    counter_evidence:
