schema_version: 1
system: sammakorn_retention_hydraulic_dag
status: operational_model_with_unknown_asset_links

semantics:
  pond:
    type: storage_node
  canal:
    type: conveyance_node
  gate:
    type: controlled_gravity_connection
  pump:
    type: mechanical_directed_edge

rules:
  gravity_inflow:
    direction: canal_to_pond
    requires:
      - gate_open
      - canal_level_above_pond_level
      - pond_storage_available
  pumped_outflow:
    direction: pond_to_receiving_canal
    requires:
      - pump_available
      - pump_on
      - receiving_canal_not_blocked
  pumped_inflow:
    direction: canal_to_pond
    status: not_established
    fail_closed: true

stations:
  - code: ST.SPS.01
    pond: sammakorn_pond_1
    inlet:
      source_canal: unknown
      mechanism: gate_gravity
      verification: unresolved_asset_level
    outlet:
      receiving_canal: unknown
      mechanism: pump
      verification: system_level_pump_out_verified

  - code: ST.SPS.02
    pond: sammakorn_pond_2
    inlet:
      source_canal: khlong_ban_ma_2_candidate
      mechanism: gate_gravity
      verification: location_association_not_hydraulic_drawing
    outlet:
      receiving_canal: khlong_ban_ma_2_candidate
      mechanism: pump
      verification: location_association_not_hydraulic_drawing

  - code: ST.SPS.03
    pond: sammakorn_pond_3
    inlet:
      source_canal: unknown
      mechanism: gate_gravity
      verification: unresolved_asset_level
    outlet:
      receiving_canal: unknown
      mechanism: pump
      verification: system_level_pump_out_verified

  - code: ST.SPS.04
    pond: sammakorn_pond_4
    inlet:
      source_canal: unknown
      mechanism: gate_gravity
      verification: unresolved_asset_level
    outlet:
      receiving_canal: unknown
      mechanism: pump
      verification: system_level_pump_out_verified

state_logic:
  PRE_DRAIN:
    expected_edge: pond_to_receiving_canal
    actuator: pump
  CAPTURE:
    expected_edge: canal_to_pond
    actuator: gate
    driver: gravity
  HOLD:
    expected_edge: none_or_limited
  RECOVERY:
    expected_edge: pond_to_receiving_canal
    actuator: pump
  FAIL_CLOSED:
    expected_edge: unknown
    reason: insufficient_or_stale_telemetry