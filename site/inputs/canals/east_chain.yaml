# Declared canal graph for canal_graph.py -- Toledo PROP-FLOOD-04 (proposal, unverified;
# PR not yet opened). Every node/edge here is a DECLARATION by the maintainer for the
# Sammakorn/Ramkhamhaeng-53 east-zone chains, cross-checked against BMA station codes in
# the cached thaiwater canal_waterlevel snapshot
# (raw/live/thaiwater_bma/2026-09-26T040159Z_canal_waterlevel.json) -- read directly, not
# taken on trust. This is NOT the OSM-derived undirected graph in
# output/bangkok_canals.graphml (build_bangkok_canals.py); that one is an automated,
# mostly-unoriented survey of ~8,600 junctions city-wide. This one is a small, hand-declared
# chain of named nodes the maintainer specifically asked to see connected, with real-time
# direction computed only where both ends are gauged.
graph_id: east_chain
epistemic_note_th: >
  กราฟนี้เป็นการประกาศ (declared) ของโหนด/เส้นเชื่อมคลองที่ผู้ดูแลระบุเอง ไม่ใช่ผลสำรวจอัตโนมัติจาก
  OSM (ต่างจาก output/bangkok_canals.graphml ซึ่งเป็นกราฟไม่มีทิศทางส่วนใหญ่จาก heuristic ระยะทาง) --
  ทิศทาง "ตอนนี้" ที่แสดงมาจากการเทียบระดับน้ำสองจุดจริงที่มีเครื่องวัดครบทั้งสองฝั่งเท่านั้น
  (readout, ไม่ใช่การเดา) ส่วนคลองที่ไม่มีเครื่องวัดจะโชว์แค่ทิศทาง "ออกแบบ" (design_direction)
  ซึ่งเป็นข้อมูล relay จากเอกสาร ไม่ใช่การวัดจริง
sensor_resolution_m:
  value: 0.02
  tag: INSTINCT
  note: >
    Declared sensor-resolution cutoff for "is this level difference real" -- BMA publishes
    canal_value to 2 decimal places (cm precision). This 0.02 m bar is a judgment call by
    this workspace (INSTINCT), not a manufacturer-specified sensor accuracy figure.
stale_after_hours: 2.0

