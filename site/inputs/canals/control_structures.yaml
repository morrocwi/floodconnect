    zeta:
      A: inner_city_phra_khanong
      B: null   # the river side is the discharge destination, not a declared city zone
    source: >
      Added per task instruction ("add พระโขนง if the feed has in/out") -- the feed does
      carry canal_value/canal_out for WL.PKN.01. Declared here WITHOUT is_gate:true and
      WITHOUT a pump_station_code, so its control state g_c(t) is honestly
      CONTROL_STATE_MISSING at every tick until a source declares whether/how this
      structure is operated -- never guessed into CLOSED from the level asymmetry alone.

