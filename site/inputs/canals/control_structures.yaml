    is_gate: false   # station name is "ส." (สถานี), not "ปตร." -- NOT declared a floodgate;
                      # this workspace does not assume gate status from the large measured
                      # in/out asymmetry alone (that would be exactly the tide/lock
                      # confusion PROP-FLOOD-05a's honest_caveats warns against).
    pump_station_code: null   # no pumps_on telemetry for this code in the cached feed;
                                # control state is therefore undeclared for this structure.
    datum_a: MSL
    datum_b: MSL
