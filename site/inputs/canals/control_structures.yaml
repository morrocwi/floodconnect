# Declared control structures for burden_ledger.py -- Toledo PROP-FLOOD-05a/05b
# (proposals, unverified; Toledo PR #62 not yet merged). Every field here is a
# DECLARATION by the maintainer, cross-checked against BMA station codes in the cached
# thaiwater canal_waterlevel feed (raw/live/thaiwater_bma/*.json) -- read directly, not
# taken on trust. `h_A`/`h_B` for each structure are read from the SAME station's own
# two fields (`canal_value` = inside/upstream level, `canal_out` = outside/downstream
# level) -- this is one BMA gauge with an in/out pair, not two separate stations.
epistemic_note_th: >
  โครงสร้างควบคุมน้ำ (ประตูระบายน้ำ/สถานีสูบ) ที่ประกาศไว้ที่นี่ ฝั่ง A (ต้นน้ำ/ในคลอง) และฝั่ง B
  (ปลายน้ำ/นอกคลอง) มาจากค่าที่สถานีเดียวกันรายงานสองค่า (canal_value=ใน, canal_out=นอก) --
  ไม่ใช่สองสถานีคนละจุด สถานะควบคุม (เปิด/ปิด/สูบ) เป็นกฎอนุมานจากค่าที่วัดได้ (INSTINCT) จนกว่า
  กทม. จะเผยแพร่สถานะประตูจริงเอง.
sensor_resolution_m:
  value: 0.02
  tag: INSTINCT
  note: >
    Same declared per-gauge resolution cutoff as site/inputs/canals/east_chain.yaml's own
    sensor_resolution_m -- BMA publishes canal_value/canal_out to 2 decimal places.
stale_after_hours: 2.0

control_state_rule_th: >
  state = CLOSED เมื่อ out - in > eps_A+eps_B (0.04 ม.) และโครงสร้างเป็นประตู (is_gate: true);
  state = PUMPING(ทิศทางที่ประกาศ) เมื่อสถานีสูบที่เกี่ยวข้องรายงาน pumps_on > 0;
  มิฉะนั้น state = OPEN. หากไม่มีทั้ง is_gate:true ที่ยืนยันได้ และไม่มีข้อมูลปั๊ม -> state ไม่ถูก
  ประกาศ (CONTROL_STATE_MISSING) นี่คือกฎอนุมาน (INSTINCT) ไม่ใช่ประกาศทางการจาก กทม.

