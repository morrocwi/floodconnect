      - tests/test_dsva_decision.py
      - docs/research/DISASTER_SYSTEM_VIABILITY_ARCHITECTURE.md
      - docs/research/DSVA_SECOND_ORDER_LICENSE.md
    rule: "decision model is an executable finite projection of DSVA, not a hazard forecaster; v0.11 requires all v0.10 theory contracts plus executable finite adaptive-policy node binding, actor-local future-information delivery, anti-hindsight policy timing, load-bearing assume-guarantee branch realizability, and persistent recovery over the declared retained grid; preserve envelope/horizon/provenance and never allow typed-reader confidence to override hard DSVA constraints"

  current_water_or_flood_status:
    start_nodes: [LIVE_DATA_SYSTEM, LIVE_WATER]
    then: [SAMMAKORN_HYDRAULIC, UNIFIED_CRISIS]
    read:
      - sources/registry.yaml
      - docs/DATA_SYSTEM.md
      - readout.py
    rule: "use fresh operational sources; static KG/topology only as context"

  river_or_downstream_connectivity:
    start_nodes: [RIVER_KG]
    read: [build_river_kg.py, README.md]
    rule: "topology answer only unless current hydrology is separately supplied"

  bangkok_canal_connectivity:
    start_nodes: [BANGKOK_CANAL_KG, LIVE_WATER]
    read: [build_bangkok_canals.py, live_water_level.py]
    rule: "preserve unresolved direction"

  sammakorn_pond_pump_gate:
    start_nodes: [SAMMAKORN_HYDRAULIC, LIVE_WATER]
    read:
      - site/inputs/canals/sammakorn_pond_canal_dag.yaml
      - docs/SAMMAKORN_POND_CANAL_DAG.md
      - live_water_level.py

  household_or_community_survival:
    start_nodes: [LVCN, COMMUNITY_DAG, TDLC]
    read:
      - docs/SHELTER_DECISION_AND_COMMUNITY_SUSTAINMENT.md
      - docs/COMMUNITY_SELF_HELP_DAG.md
      - site/inputs/community/sustainment_policy.yaml

  route_or_evacuation:
    start_nodes: [COMMUNITY_DAG, ORCG, HAHU]
    read:
      - community_dag.py
      - site/inputs/community/self_help_dag.yaml
      - site/inputs/community/operational_tools.yaml
    rule: "mode/tool never overrides route verification"

  supplies_support_or_last_mile:
    start_nodes: [LCF, LCB, ORCG, TDLC]
    read:
      - convergence_feasibility.py
      - convergence_board.py
      - docs/THAI_DISTRIBUTED_LIFELINE_CONVERGENCE.md

  shelter_or_dry_node:
    start_nodes: [SOCL, PSSS, ORCG]
    read:
      - docs/SHELTER_OPERATION_CAPABILITY_LADDER.md
      - site/inputs/community/public_shelter_seeds.yaml
      - site/inputs/community/operational_tools.yaml
    rule: "Dry Gate first"

  public_facility_for_shelter:
    start_nodes: [PSSS, SOCL]
    read:
      - public_shelter_seed.py
      - docs/PUBLIC_SHELTER_SEED_STRATEGY.md
    rule: "archetype is search hint only; verified capability gap chooses actual candidate"

  animals_pets_livestock:
    start_nodes: [HAHU, COMMUNITY_DAG, ORCG]
    read:
      - docs/HUMAN_ANIMAL_HOUSEHOLD_UNIT.md
      - human_animal_household.py

  floodwater_age_sewage_mold_vectors:
    start_nodes: [ENV_DEGRADATION]
    read:
      - docs/ENVIRONMENTAL_DEGRADATION_CLOCKS.md
      - environmental_degradation.py

  government_agency_or_who_is_responsible:
    start_nodes: [GOVERNANCE, WARNING_TYPOLOGY]
    read:
      - site/inputs/governance/thailand_water_governance_reference.json
      - site/inputs/governance/flood_warning_actor_typology.yaml
    rule: "use canonical actor IDs; role != exclusive authority"

  warning_alert_or_who_warns:
    start_nodes: [WARNING_TYPOLOGY, SOURCE_REGISTRY]
    read:
      - docs/THAI_FLOOD_WARNING_ACTOR_TYPOLOGY.md
      - sources/registry.yaml
    rule: "classify product semantic before using it"

  overall_decision_state:
    start_nodes: [UNIFIED_CRISIS]
    then: [LVCN, LCF, COMMUNITY_DAG, ENV_DEGRADATION, HAHU]
    read:
      - unified_crisis_state.py
      - site/inputs/community/sustainment_policy.yaml


  social_or_community_reports:
    start_nodes: [SOCIAL_LISTENING, LIVE_DATA_SYSTEM]
    read:
      - social_listening.py
      - docs/METHOD_social_listening.md
      - sources/registry.yaml
    rule: "place/state/time evidence only; preserve publisher/provenance and never promote to official warning"

  experimental_flood_model_or_forecast:
    start_nodes: [HIERARCHICAL_FLOOD_ZOOM, WATER_BALANCE, RAW_STAGE_FORECAST]
    then: [CANAL_CHAIN_MODEL, BURDEN_LEDGER, PROSPECTIVE_EXPERIMENTS]
    read:
      - hierarchical_flood_zoom.py
      - water_balance.py
      - raw_stage_forecast.py
      - canal_graph.py
      - burden_ledger.py
    rule: "proposal/experiment branch; declare missing inputs and audits; do not launder into operational forecast"

  toledo_water_balance_or_capacity:
    start_nodes: [WATER_BALANCE, DRAINAGE_CAPACITY_INPUTS]
    read:
      - water_balance.py
      - docs/CAPACITY.md
      - site/inputs/areas/bangkok_east.balance.yaml
    rule: "exact computation is allowed only over declared finite inputs; OPEN remains OPEN"

  prospective_test_or_backtest:
    start_nodes: [PROSPECTIVE_EXPERIMENTS]
    then: [HIERARCHICAL_FLOOD_ZOOM, RAW_STAGE_FORECAST, WATER_BALANCE]
    read:
      - experiments/2026-09-bangkok-hierarchical-real-run.md
      - experiments/2026-09-27-samutsakhon-prospective-audit.md
      - experiments/2026-09-27-tha008-threshold-audit.md
    rule: "preserve locked prediction and post-hoc audit separately; no hindsight rewrite"


  multi_agent_write_or_handoff:
    start_nodes: [AGENT_COORDINATION, REPO_KG]
    read:
      - AGENTS.md
      - .ai/claims/README.md
      - CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md
    rule: "semantic changes require claim-first ownership; one ACTIVE writer per canonical node; implementation merges only through PR + RKG validation + claim validation + full regression"

artifact_precedence:
  governance_identity:
    first: site/inputs/governance/thailand_water_governance_reference.json
    overlays:
      - site/inputs/governance/flood_warning_actor_typology.yaml
  community_policy:
    first: site/inputs/community/sustainment_policy.yaml
    implementations:
      - shelter_decision.py
      - convergence_feasibility.py
      - shelter_operation_ladder.py
      - unified_crisis_state.py
  movement:
    first: site/inputs/community/self_help_dag.yaml
    implementation: community_dag.py
  operational_tools:
    first: site/inputs/community/operational_tools.yaml
    implementation: operational_resources.py
  public_shelter_seed:
    first: site/inputs/community/public_shelter_seeds.yaml
    implementation: public_shelter_seed.py
  sammakorn_hydraulics:
    first: site/inputs/canals/sammakorn_pond_canal_dag.yaml
    implementation: live_water_level.py
  live_sources:
    first: sources/registry.yaml
    pipeline: [collect.py, parsers.py, store.py, readout.py]

  experimental_water_balance:
    first: site/inputs/areas/bangkok_east.balance.yaml
    implementation: water_balance.py
    capacity_reference: site/inputs/capacity/bma_capacity.json
  declared_east_canal_chain:
    first: site/inputs/canals/east_chain.yaml
    implementation: canal_graph.py
  control_structure_burden:
    first: site/inputs/canals/control_structures.yaml
    implementation: burden_ledger.py
  social_listening:
    first: docs/METHOD_social_listening.md
    implementation: social_listening.py

  multi_agent_coordination:
    first: AGENTS.md
    claim_protocol: .ai/claims/README.md
    validator: agent_claims.py
    integration_gate: .github/workflows/floodconnect.yml

ai_response_discipline:
  - "state whether claim comes from live observation, static topology, policy/model, field evidence, or inference"
  - "for current conditions, verify freshness before using a reading"
  - "for a named real shelter/route, never infer safety from type/name/proximity"
  - "for government roles, separate canonical actor identity from warning-role overlay"
  - "when a canonical artifact exists, edit/extend it instead of creating a parallel ontology"
  - "if a lower-layer state is UNKNOWN, do not erase it by pointing to a higher known layer"
