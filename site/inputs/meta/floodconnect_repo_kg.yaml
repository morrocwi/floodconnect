  - "RIVER_KG -/-> flood forecast"
  - "BANGKOK_CANAL_KG -/-> guaranteed hydraulic direction"
  - "weather forecast -/-> exact local flood depth"
  - "canal observation -/-> evacuation order"
  - "tool_node -/-> route safe"
  - "pump present -/-> Dry Gate passed"
  - "facility archetype -/-> shelter level"
  - "GOVERNANCE static role -/-> current incident commander"
  - "WARNING_TYPOLOGY -/-> duplicate actor identity"
  - "support delivery graph -/-> resident movement graph"

  - "social listening -/-> official warning"
  - "raw stage persistence -/-> hydraulic forecast"
  - "derived alert label -/-> independent forecast evidence"
  - "urban drainage signal -/-> exact point flood depth"
  - "missing Toledo inputs -/-> fabricated water-balance result"
  - "TOLEDO_ROOT documentation -/-> registered DSVA equation or production forecast"
  - "declared east canal chain -/-> complete Bangkok canal topology"
  - "historical S0-S5 backtest state machine -/-> current canonical decision state"
  - "file-level non-conflict -/-> semantic non-conflict"
  - "separate branches -/-> separate semantic ownership"
  - "task-specific test pass -/-> full integration safety"
  - "expired claim -/-> silent ownership transfer"

question_routes:
  disaster_system_theory_or_dsva:
    start_nodes: [DSVA_THEORY, TOLEDO_ROOT]
    then: [DSVA_DECISION_MODEL, COMMUNITY_DAG, TDLC, LCF, LVCN, ORCG, ENV_DEGRADATION, SOCL, WARNING_TYPOLOGY, LIVE_DATA_SYSTEM, SAMMAKORN_HYDRAULIC, WATER_BALANCE, UNIFIED_CRISIS, PROSPECTIVE_EXPERIMENTS]
    read:
      - docs/research/DISASTER_SYSTEM_VIABILITY_ARCHITECTURE.md
      - docs/research/DSVA_TOLEDO_WELD.md
      - docs/research/DSVA_FLOODCONNECT_CANONICAL_SYNTHESIS.md
      - docs/research/DSVA_INFORMATION_CONTRACT_BRIDGE.md
      - docs/research/DSVA_SECOND_ORDER_LICENSE.md
      - experiments/2026-10-01-dsva-v05-second-order-redteam.md
      - docs/COMMUNITY_SELF_HELP_DAG.md
      - docs/THAI_DISTRIBUTED_LIFELINE_CONVERGENCE.md
      - docs/OPERATIONAL_RESOURCE_CAPABILITY_GRAPH.md
      - docs/ENVIRONMENTAL_DEGRADATION_CLOCKS.md
      - docs/THAI_FLOOD_WARNING_ACTOR_TYPOLOGY.md
      - experiments/2025-11-hat-yai-real-data-redteam.md
      - sources/registry.yaml
      - unified_crisis_state.py
    rule: "read DSVA v0.6, Toledo weld, repository-first synthesis, v0.5 information-contract bridge, second-order red-team, and DSVA_SECOND_ORDER_LICENSE before proposing a construct; preserve Toledo-existing vs DSVA-proposal; existing FloodConnect canonical subsystems remain authoritative; a strong reader requires first-order closures plus applicability/dependency/realizability/execution/requirement/verification meta-license; robustness is only within a declared applicability envelope; missing obligations yield CONDITIONAL/UNKNOWN/HOLD/LOCAL-PARTIAL; CAN-006/007/009 are load-bearing; theory claim != production forecast or operational command"

  disaster_decision_model_or_action_license:
    start_nodes: [DSVA_DECISION_MODEL, DSVA_THEORY]
    then: [LIVE_DATA_SYSTEM, UNIFIED_CRISIS, COMMUNITY_DAG, LCF, ORCG]
    read:
      - docs/research/DSVA_DECISION_MODEL.md
      - docs/research/DSVA_FINITE_OBSTRUCTION_KERNEL.md
