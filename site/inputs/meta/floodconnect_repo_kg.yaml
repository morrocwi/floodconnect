  - {from: COMMUNITY_DAG, relation: PROVIDES_MOVEMENT_TO, to: HAHU}
  - {from: COMMUNITY_DAG, relation: PROVIDES_MOVEMENT_TO, to: UNIFIED_CRISIS}
