# FloodConnect Repo Knowledge Graph (RKG)
# Canonical meta-layer for AI/human orientation.
# This graph describes repository concepts, source-of-truth artifacts, dependencies,
# epistemic boundaries, and recommended read paths. It contains NO live flood claim.
version: "1.5"
status: "canonical_repo_meta_graph"
updated_at: "2026-10-03"

lineage:
  - version: "1.5"
    date: "2026-10-03"
    reason: >-
      correction to the 1.4 entry below (checker MED item 3, this check):
      that entry said CI builds the public page "from ... the tracked
      `site/dist/api/v1/` snapshot" -- this overclaimed what
      site/build_data.py and site/build_page.py actually read.
      MEASURED: neither script reads site/dist/api/v1/ at all; they read
      the gitignored data/observations.sqlite and raw/ caches (absent on a
      fresh runner) plus tracked site/inputs/**/sources/*.yaml. CI is built
      from TRACKED INPUTS ONLY, and a fresh runner's page therefore shows
      the no-current-data/staleness state. site/dist/api/v1/** is a tracked
      snapshot this build does not regenerate -- it is uploaded unchanged
      alongside the page, passed through as-is. The 1.4 entry is left
      unedited below (lineage events are a historical record); this entry
      is the correction. No canonical node added/removed; CI-structure
      wording only.
  - version: "1.4"
    date: "2026-10-03"
    reason: >-
      project decision 2026-10-03 ("เอาออก (แนะนำ)"): removed the `build` job's
      "Collect live snapshots" step (`collect.py --all`) from
      .github/workflows/floodconnect.yml -- CI no longer performs any
      server-side live fetch on infrastructure we operate. CI is now
      validate + full regression + build the public page from whatever is
      already committed to the repo (the tracked `site/dist/api/v1/`
      snapshot and other tracked data), never a live upstream call of its
      own; deploy gating (needs.build.result == 'success') is unchanged.
      Every live fetch is caller-side only, per the self-install founder
      ruling. The CI node's summary below is updated to match. No canonical
      node added or removed; CI-structure only.
  - version: "1.3"
    date: "2026-10-02"
    reason: >-
      2026-10-02: renamed the root HydroRIVERS river-flow
      builder build_kg.py -> build_river_kg.py so it no longer shares a name with
      tools/kg/build_kg.py (the nationwide knowledge-graph builder) -- two different
      scripts, two different graphs, now two different names. Every reference across
      docs/tests/comments updated to match; tools/kg/build_kg.py's own name and imports
      are unchanged. canonical_artifacts for the river-KG node updated accordingly. No
      node added or removed; artifact-pointer only.
  - version: "1.2"
    date: "2026-10-02"
    reason: >-
      founder decision 2026-10-02: on-demand only. Removed the `*/30 * * * *` schedule trigger from
      .github/workflows/floodconnect.yml entirely -- the pipeline is on-demand only
      (push to main or manual workflow_dispatch), per founder decision 2026-10-02. With
      the schedule gone, build/deploy now use one gating rule for every non-PR trigger
      (needs.validate.result == 'success'), removing the former schedule/workflow_dispatch
      special case this file's v1.1 entry described. deploy's `if` also now requires
      `always() && needs.build.result == 'success'` so it is never silently skipped when
      build actually succeeded. No canonical node added or removed; CI-structure only.
  - version: "1.1"
    date: "2026-10-02"
    reason: >-
      added a `validate` job (RKG+claims+pytest) ahead of build/deploy in
      .github/workflows/floodconnect.yml, with build/deploy gated on validate for
      push/workflow_dispatch but not for schedule (a data-dependent test pair can fail
      without freezing the live page). The 30-min schedule cron itself was left
      UNCHANGED at this point -- that edit was pending a separate founder decision on
      the schedule cadence (resolved in the v1.2 entry above). No canonical node added
      or removed; this bump covers the CI-structure change only.

purpose:
  - "let a new AI understand FloodConnect without scanning the whole repository"
  - "prevent duplicate ontologies / duplicate actor identities / duplicate source-of-truth files"
  - "route questions to the smallest relevant canonical artifact set"
  - "make dependency and epistemic boundaries explicit"

meta_invariants:
  - "UNKNOWN != SAFE"
  - "no weighted score may override a failed hard constraint"
  - "topology/connectivity != forecast"
  - "observation != forecast != warning != operational instruction != response action"
  - "facility type != shelter safety"
  - "vehicle/tool type != route safety"
  - "tool capability never overrides Dry Gate"
  - "movement graph != lifeline/support graph"
  - "governance actor identity lives in thailand_water_governance_reference.json verified_anchors"
  - "role overlays must reference canonical actor IDs instead of duplicating agency identity"
  - "one ACTIVE writer per canonical RKG node for semantic changes"
  - "substantive concurrent work uses claim-first branch/PR integration"
  - "current incident interpretation uses live/official operational sources; static governance is context only"
  - "user/community reports are evidence inputs, not automatically verified operational truth"

ai_boot_sequence:
  - "AGENTS.md"
  - "AI.md"
  - "docs/AI_ENTRYPOINT.md"
  - "site/inputs/meta/floodconnect_repo_kg.yaml"
  - "README.md"
  - "sources/registry.yaml"
  - "site/inputs/community/sustainment_policy.yaml"
  - "site/inputs/governance/thailand_water_governance_reference.json"

epistemic_classes:
  LIVE_OBSERVATION: "fresh measured/relayed operational state; freshness and provenance required"
  STATIC_TOPOLOGY: "structure/connectivity/reference; not a forecast"
  POLICY_SCHEMA: "rules/invariants; contains no live site-safety claim"
  EXECUTABLE_MODEL: "deterministic evaluator given declared inputs; output inherits input limits"
  ROLE_OVERLAY: "assigns roles to canonical identities; must not duplicate identities"
  FIELD_EVIDENCE: "relayed case evidence; useful for design/testing but not universal truth"
  PROPOSAL: "repo-specific construct requiring validation; never present as external standard"
  DOCUMENTATION: "human explanation of a canonical artifact/model"

node_kinds:
  - DOMAIN_SYSTEM
  - MODEL
  - GRAPH
  - POLICY
  - REGISTRY
  - DATA_PIPELINE
  - GOVERNANCE_REGISTRY
  - ROLE_OVERLAY
  - DECISION_LAYER
  - ARTIFACT
  - OUTPUT


node_ontology:
  hydraulic_node:
    examples: [river_reach, canal_junction, pond, gate, pump_station, receiving_canal]
    represents: "water/control topology"
    may_be_occupied_by_people: false
    canonical_systems: [RIVER_KG, BANGKOK_CANAL_KG, SAMMAKORN_HYDRAULIC, CANAL_CHAIN_MODEL]

  community_node:
    examples: [household, buddy_cell, zone, internal_safe, egress, external_safe]
    represents: "people/support/movement topology"
    canonical_systems: [COMMUNITY_DAG, LVCN]
    rule: "egress is a connector, not a sustainment candidate"

  service_node:
    examples: [supply_point, community_kitchen, civil_society_provider, veterinary_team, charging_point]
    represents: "functional capability delivery"
    canonical_systems: [SUSTAINMENT_POLICY, TDLC]
    rule: "functional capability is separate from occupancy viability"

  shelter_operation_node:
    examples: [dry_interface, relief_transfer, day_support, overnight_shelter, full_shelter_operation]
    represents: "physical site capability level"
    canonical_systems: [SOCL, PSSS]
    rule: "Dry Gate precedes every level"

  tool_node:
    examples: [vehicle, boat, pump, generator, water_tank, portable_toilet, radio]
    represents: "deployable capability resource"
    canonical_systems: [ORCG]
    rule: "may attach capability to a node/edge; is not itself a route or shelter destination"

  governance_actor_node:
    examples: [tmd, rid, dwr, onwr, ddpm_ndwc, bma_dds, hii, province_district_local_authority]
    represents: "institution/actor identity"
    canonical_systems: [GOVERNANCE]
    rule: "identity is canonical; roles are overlays"

  information_product:
    examples: [observation, forecast, warning, operational_instruction, response_action]
    represents: "claim/action semantic carried by a source"
    canonical_systems: [WARNING_TYPOLOGY, SOURCE_REGISTRY, LIVE_DATA_SYSTEM]
    rule: "product semantics must not be silently promoted into one another"

edge_ontology:
  hydraulic_flow_edge:
    systems: [RIVER_KG, SAMMAKORN_HYDRAULIC, CANAL_CHAIN_MODEL]
    semantics: "water may/does move according to declared topology/control/evidence"
  resident_movement_edge:
    systems: [COMMUNITY_DAG]
    semantics: "people can move only when verified/fresh/mode/capacity constraints pass"
  lifeline_support_edge:
    systems: [TDLC, LCF, LVCN]
    semantics: "resources/helpers/services may move inward/laterally; graph need not be a DAG"
  tool_capability_attachment:
    systems: [ORCG]
    semantics: "verified tool deployment adds declared capability; never overwrites hard safety"
  role_assignment_edge:
    systems: [GOVERNANCE, WARNING_TYPOLOGY]
    semantics: "canonical actor -> one or more warning/operational roles"
  evidence_feed_edge:
    systems: [LIVE_DATA_SYSTEM, SOCIAL_LISTENING]
    semantics: "provenanced evidence feeds evaluators without becoming a command by itself"
  model_dependency_edge:
    systems: [FC_ROOT]
    semantics: "repo-level construct dependency represented in RKG edges"

nodes:

  REPO_KG:
    kind: REGISTRY
    label: "FloodConnect Repository Knowledge Graph"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - site/inputs/meta/floodconnect_repo_kg.yaml
      - docs/AI_ENTRYPOINT.md
      - docs/FLOODCONNECT_REPO_KG.md
      - repo_knowledge_graph.py
      - tests/test_repo_knowledge_graph.py
    summary: "Meta-graph that routes AI/humans to canonical constructs and prevents parallel ontology drift."
    key_boundary: "describes repository architecture; contains no live flood-state claim"


  AGENT_COORDINATION:
    kind: POLICY
    label: "Multi-Agent Write-Safety Protocol"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - AGENTS.md
      - CONTRIBUTING.md
      - .ai/claims/README.md
      - .ai/claims/_template.yaml
      - agent_claims.py
      - tests/test_agent_claims.py
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/CODEOWNERS
      - .github/workflows/floodconnect.yml
    summary: "Claim-first, one-active-writer-per-canonical-node, branch/PR/full-regression protocol for concurrent AI work."
    key_boundary: "file-level non-conflict does not imply semantic non-conflict; ownership is by canonical RKG node"

  FC_ROOT:
    kind: DOMAIN_SYSTEM
    label: "FloodConnect"
    epistemic_class: DOCUMENTATION
    canonical_artifacts: [README.md]
    summary: "Thailand-first flood context, community sustainment, movement, shelter, resource and governance system."

  DSVA_THEORY:
    kind: ARTIFACT
    label: "Disaster-System Viability Architecture — repository-synthesized Toledo-welded theory of preserving, losing, and recovering viable futures"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - docs/research/DISASTER_SYSTEM_VIABILITY_ARCHITECTURE.md
      - docs/research/DSVA_TOLEDO_WELD.md
      - docs/research/DSVA_FLOODCONNECT_CANONICAL_SYNTHESIS.md
      - docs/research/DSVA_INFORMATION_CONTRACT_BRIDGE.md
      - docs/research/DSVA_SECOND_ORDER_LICENSE.md
    root_objects:
      - toledo_domain_adapter
      - joint_information_state
      - typed_evidence_assimilation
      - adaptive_viable_policy_set
      - evidence_bounded_current_action_set
      - task_relative_reader_equivalence
      - viable_future_geometry
      - viability_horizon
      - finite_action_reader
      - human_service_state
      - institutional_actuation
      - intervention_value_calculus
      - hazard_induced_topology_transition
      - evidence_validity_and_expiry
      - forecast_support_breach
      - recoverability_policy_set
      - hysteretic_re_escalation
      - contradiction_safe_information_status
      - reader_specific_evidence_contract
      - reader_sufficient_state_closure
      - assume_guarantee_boundary_contract
      - shared_capacity_network_contract
      - capture_basin_recoverability_bridge
      - applicability_envelope
      - model_invalidation_gate
      - dependency_closure
      - contract_policy_realizability
      - action_license_lease
      - protected_requirement_coverage
      - persistent_recovery_return_set
      - independent_result_verification
      - scope_preserving_readout
    formal_core: "S_n -> q_DSVA -> first-order information contract -> {information status, nonempty mathbb_B_t} -> reader-sufficient augmented state -> possible futures -> second-order applicability/dependency/realizability/execution/requirement/verification meta-license -> {Pi_H^EB, Pi_H^REC} -> verified scope-preserving reader -> leased action/runtime feedback; CAN-006/007/009 remain load-bearing."
    thailand_instantiation: "Bangkok 2569 + finite Sammakorn witness are the first Toledo-style instantiation; the pre-existing Hat Yai Nov-2025 real-data red-team is the canonical non-Bangkok stress case for conflicting current/forward state, repeated pulses, adaptive freshness, multimodal movement, service-node fragility, outside-calibrated-range and throughput limits."
    summary: "Inside-out synthesis through one bridge: v0.5 closes first-order information/state/boundary/capacity/recovery semantics; v0.6 adds a second-order license envelope after adversarial tests showed all first-order closures can pass while action is still wrong. Model invalidation, hidden-dependency handling, contract realizability, runtime assurance, requirements traceability, persistent return sets and independent certificates enter only as leak-closing operators inside DSVA/Toledo."
    key_boundary: "general-theory research claim is canonical for DSVA; operational forecasts/warnings/actions still require reader-specific fresh evidence and validated models. Toledo T-CAN-002/003/006/007/008/009 are cited as existing anchors; every DSVA-T equation is a DSVA proposal until separately registered in Toledo."

  DSVA_DECISION_MODEL:
    kind: MODEL
    label: "DSVA v0.11 executable disaster decision model — finite retained obstruction + finite realizability projection"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - dsva_decision.py
      - dsva_kernel/core.py
      - dsva_kernel/contracts.py
      - dsva_kernel/requirements.py
      - dsva_kernel/engine.py
      - docs/research/DSVA_DECISION_MODEL.md
      - docs/research/DSVA_FINITE_OBSTRUCTION_KERNEL.md
      - docs/research/DSVA_AUDITED_MEANING_CLOSURE.md
      - docs/research/DSVA_THEORY_CONTRACT_PROJECTION.md
      - docs/research/DSVA_FINITE_REALIZABILITY_PROJECTION.md
      - site/inputs/decision/dsva_decision_schema.json
      - examples/dsva_decision_minimal.json
      - tests/test_dsva_decision.py
      - tests/test_dsva_decision_v08_redteam.py
      - tests/test_dsva_decision_v09_redteam.py
      - tests/test_dsva_decision_v010_theory_contracts.py
      - tests/test_dsva_decision_v011_realizability.py
    summary: "Executable projection of DSVA theory for finite anti-hindsight scenarios. v0.11 preserves the IDM exact-finite retained obstruction/quotient kernel and v0.9-v0.10 meaning/theory contracts, then projects DSVA SOL-20..28 with an actor-local finite adaptive-policy DAG, finite load-bearing assume-guarantee branch witnesses, and persistent recovery over the declared retained grid."
    key_boundary: "reference decision model != hazard forecast != universal safety proof; finite policy witness != optimal/universal policy; finite assume-guarantee witness != physical reachability proof; retained persistent recovery != continuous inter-sample recovery; declared checker independence != proven independent implementation; typed-reader confidence never overrides hard DSVA constraints."

  TOLEDO_ROOT:
    kind: ARTIFACT
    label: "Toledo formal dependency bridge for DSVA"
    epistemic_class: DOCUMENTATION
    canonical_artifacts:
      - docs/research/DSVA_TOLEDO_WELD.md
    existing_anchors:
      - T-CAN-002
      - T-CAN-003
      - T-CAN-006
      - T-CAN-007
      - T-CAN-008
      - T-CAN-009
    summary: "FloodConnect-side dependency map for the external Toledo retained-state, stepper, domain-weld, reader-equivalence, non-collapse and historical-invariance grammar used by DSVA."
    key_boundary: "not the authoritative Toledo registry and does not register DSVA equations; actual Toledo registration/source remains external to FloodConnect."

  RIVER_KG:
    kind: GRAPH
    label: "Thailand River Flow-Propagation Knowledge Graph"
    epistemic_class: STATIC_TOPOLOGY
    canonical_artifacts: [build_river_kg.py]
    outputs: [output/thailand_river_flow.graphml, output/thailand_river_flow.jsonld]
    key_boundary: "HydroRIVERS topology / NEXT_DOWN; not a flood forecast."

  BANGKOK_CANAL_KG:
    kind: GRAPH
    label: "Bangkok Canal Network"
    epistemic_class: STATIC_TOPOLOGY
    canonical_artifacts: [build_bangkok_canals.py]
    summary: "Bangkok canal connectivity/conflation/orientation evidence with explicit uncertainty."
    key_boundary: "edge direction may be unresolved; schematic conflation evidence is not guaranteed hydraulic truth."

  LIVE_DATA_SYSTEM:
    kind: DATA_PIPELINE
    label: "Live Flood-Context Data System"
    epistemic_class: LIVE_OBSERVATION
    canonical_artifacts:
      - sources/registry.yaml
      - collect.py
      - parsers.py
      - store.py
      - readout.py
      - docs/DATA_SYSTEM.md
    summary: "Registry-driven one-request-per-source collection, append-only storage, provenance and contradiction readout."

  LIVE_WATER:
    kind: DATA_PIPELINE
    label: "Bangkok Live Water / Pump Readout"
    epistemic_class: LIVE_OBSERVATION
    canonical_artifacts: [live_water_level.py]
    summary: "ThaiWater canal stations + BMA PumpHistory attachment/watch layer."

  SAMMAKORN_HYDRAULIC:
    kind: GRAPH
    label: "Sammakorn Pond–Canal Hydraulic DAG"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - site/inputs/canals/sammakorn_pond_canal_dag.yaml
      - docs/SAMMAKORN_POND_CANAL_DAG.md
    summary: "External canal/drain -> gate/gravity -> pond -> pump -> receiving canal; fail-closed on missing state."

  COMMUNITY_DAG:
    kind: GRAPH
    label: "Community Self-Help Movement DAG"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - site/inputs/community/self_help_dag.yaml
      - community_dag.py
      - docs/COMMUNITY_SELF_HELP_DAG.md
    summary: "Layered resident movement: household -> buddy -> zone -> internal safe -> egress -> external safe."

  SUSTAINMENT_POLICY:
    kind: POLICY
    label: "Community Sustainment Policy Schema"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts: [site/inputs/community/sustainment_policy.yaml]
    summary: "Canonical cross-construct schema for LVCN, water lifelines, convergence, shelter, HAHU, degradation and unified state."

  LVCN:
    kind: DECISION_LAYER
    label: "Lowest Viable Community Node"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - shelter_decision.py
      - docs/SHELTER_DECISION_AND_COMMUNITY_SUSTAINMENT.md
      - site/inputs/community/sustainment_policy.yaml
    summary: "Lowest support layer known to sustain people for the declared horizon without collapsing UNKNOWN."
    key_boundary: "not an external FEMA/Sphere/UNHCR standard."

  TDLC:
    kind: MODEL
    label: "Thai Distributed Lifeline Convergence"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - docs/THAI_DISTRIBUTED_LIFELINE_CONVERGENCE.md
      - site/inputs/community/sustainment_policy.yaml
    summary: "Thailand-first two-network model: people movement + support/lifeline convergence."

  LCF:
    kind: MODEL
    label: "Lifeline Convergence Feasibility"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - convergence_feasibility.py
      - site/inputs/community/sustainment_policy.yaml
    summary: "Whether demand gap can be closed by verified interface/path/supply/capacity/timing."

  LCB:
    kind: MODEL
    label: "Local Convergence Board"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - convergence_board.py
      - site/inputs/community/sustainment_policy.yaml
    summary: "Nearest verified SO-L0 dry interface + shared NEED/SUPPLY/ROUTE Kanban."
    key_boundary: "shared state, not a command hierarchy."

  SOCL:
    kind: MODEL
    label: "Shelter Operation Capability Ladder"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - shelter_operation_ladder.py
      - docs/SHELTER_OPERATION_CAPABILITY_LADDER.md
      - site/inputs/community/sustainment_policy.yaml
    summary: "Dry Gate -> SO-L0 interface -> L1 transfer -> L2 day support -> L3 overnight -> L4 full operation."
    key_boundary: "no verified dry operating footprint => no shelter-operation level."

  ORCG:
    kind: GRAPH
    label: "Operational Resource Capability Graph"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - site/inputs/community/operational_tools.yaml
      - operational_resources.py
      - docs/OPERATIONAL_RESOURCE_CAPABILITY_GRAPH.md
    summary: "tool_node/resource deployment -> verified capability -> node/edge capability cascade."
    key_boundary: "inventory presence alone grants no route/site capability."

  PSSS:
    kind: MODEL
    label: "Public Shelter Seed Strategy"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - public_shelter_seed.py
      - site/inputs/community/public_shelter_seeds.yaml
      - docs/PUBLIC_SHELTER_SEED_STRATEGY.md
    summary: "Discover public facilities quickly, then choose by hard capability gap after Dry Gate."
    key_boundary: "school/sports/hospital labels are discovery hints, not safety claims."

  HAHU:
    kind: MODEL
    label: "Human–Animal Household Unit"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - human_animal_household.py
      - docs/HUMAN_ANIMAL_HOUSEHOLD_UNIT.md
      - site/inputs/community/sustainment_policy.yaml
    summary: "Separates animal sustainment, movement readiness, destination compatibility and household continuity."

  ENV_DEGRADATION:
    kind: MODEL
    label: "Environmental Degradation Clocks"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - environmental_degradation.py
      - docs/ENVIRONMENTAL_DEGRADATION_CLOCKS.md
      - site/inputs/community/sustainment_policy.yaml
    summary: "Safe-now can degrade without rising water: sewage/backflow, wet materials, vectors, sewer gas and finite clocks."

  UNIFIED_CRISIS:
    kind: DECISION_LAYER
    label: "Unified Crisis State"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - unified_crisis_state.py
      - site/inputs/community/sustainment_policy.yaml
    state_vector: "Z_i(t,T)=(O,F,M,S,E,H,A,P)"
    summary: "Composes occupancy, function, movement, support, environment, forward hazard, animal topology and phase."

  GOVERNANCE:
    kind: GOVERNANCE_REGISTRY
    label: "Thailand Water Governance Canonical Actor Registry"
    epistemic_class: STATIC_TOPOLOGY
    canonical_artifacts:
      - site/inputs/governance/thailand_water_governance_reference.json
      - docs/THAILAND_WATER_GOVERNANCE.md
    summary: "Canonical actor identities and verified governance anchors."
    key_boundary: "context only; not live incident command or telemetry."

  WARNING_TYPOLOGY:
    kind: ROLE_OVERLAY
    label: "Thai Flood Warning Actor Typology"
    epistemic_class: ROLE_OVERLAY
    canonical_artifacts:
      - site/inputs/governance/flood_warning_actor_typology.yaml
      - docs/THAI_FLOOD_WARNING_ACTOR_TYPOLOGY.md
    summary: "OBSERVE -> INTERPRET -> INTEGRATE -> PUBLIC_WARN -> LOCAL_WARN_AND_ACT roles over canonical governance actors."
    key_boundary: "actor identity is referenced from GOVERNANCE; never duplicated here."

  SOURCE_REGISTRY:
    kind: REGISTRY
    label: "Operational Source Registry"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts: [sources/registry.yaml, sources/api_census.yaml]
    summary: "Agency/source URL, cadence, auth, licence, trust tier and host-safety rules. sources/api_census.yaml is the wider 162-entry government/third-party sweep this registry's 44 wired sources are drawn from -- closed out 2026-10-03 (0 entries left `unknown`); it is a census of what was observed, never itself a claim that an entry should be ingested."
    key_boundary: "a `reachable`/`needs_key` census row is not an ingestion decision; only sources/registry.yaml entries are actually wired into collect.py."


  SOCIAL_LISTENING:
    kind: DATA_PIPELINE
    label: "Community / Public Social Listening"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - social_listening.py
      - docs/METHOD_social_listening.md
    summary: "Place+state+time community/media signals stored without personal names; not an official warning channel."
    key_boundary: "community report != verified operational truth"

  DRAINAGE_CAPACITY_INPUTS:
    kind: REGISTRY
    label: "Drainage Capacity / Area Balance Inputs"
    epistemic_class: POLICY_SCHEMA
    canonical_artifacts:
      - docs/CAPACITY.md
      - site/inputs/capacity/bma_capacity.json
      - site/inputs/areas/bangkok_east.balance.yaml
      - site/inputs/areas/ram53.balance.yaml
      - site/inputs/areas/sammakorn.balance.yaml
    summary: "Declared design/capacity and area-balance inputs with explicit OPEN/RELAYED/INSTINCT boundaries."

  WATER_BALANCE:
    kind: MODEL
    label: "Toledo Water-Balance Readout (PROP-FLOOD-03)"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - water_balance.py
      - site/inputs/areas/bangkok_east.balance.yaml
      - site/inputs/areas/ram53.balance.yaml
      - site/inputs/areas/sammakorn.balance.yaml
    summary: "Finite water-balance step with refusal on missing/stale/undeclared inputs."
    key_boundary: "proposal; exact delta-S is refused when required A/c/Q/tau declarations are missing"

  CANAL_CHAIN_MODEL:
    kind: MODEL
    label: "Declared East Canal Chain Direction Model (PROP-FLOOD-04)"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - canal_graph.py
      - site/inputs/canals/east_chain.yaml
    summary: "Small declared named-canal chain with live direction only where both ends/datum/control evidence allow."
    key_boundary: "not the citywide OSM canal graph; unresolved direction stays unresolved"

  BURDEN_LEDGER:
    kind: MODEL
    label: "Control-Structure Burden Ledger (PROP-FLOOD-05a/05b)"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - burden_ledger.py
      - site/inputs/canals/control_structures.yaml
    summary: "Gradient/control-state burden and zone ordering across declared structures."
    key_boundary: "proposal; control-state/datum/missing evidence can refuse evaluation"

  HIERARCHICAL_FLOOD_ZOOM:
    kind: MODEL
    label: "Hierarchical Urban-to-Point Flood Zoom"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts:
      - hierarchical_flood_zoom.py
    summary: "Separates urban drainage debt, Toledo storage increment bounds, and point depth; preserves unresolved lower layers."
    key_boundary: "urban signal does not imply point depth without compatible local water/ground evidence"

  RAW_STAGE_FORECAST:
    kind: MODEL
    label: "Raw Stage-Only Persistence Forecast Helper"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - raw_stage_forecast.py
    summary: "Two-cycle phase-window threshold persistence using raw stage observations only."
    key_boundary: "not a hydraulic model; derived alert labels are deliberately excluded"

  PROSPECTIVE_EXPERIMENTS:
    kind: OUTPUT
    label: "Locked Prospective / Backtest Experiments"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - experiments/2025-11-hat-yai-real-data-redteam.md
      - experiments/2026-09-26-sammakorn-7day-backtest.md
      - experiments/2026-09-bangkok-hierarchical-real-run.md
      - experiments/2026-09-bangkok-toledo-real-backtest.md
      - experiments/2026-09-27-kanchanaburi-prospective.md
      - experiments/2026-09-27-samutsakhon-independent-prospective.md
      - experiments/2026-09-27-samutsakhon-prospective-audit.md
      - experiments/2026-09-27-tha008-clean-prospective.md
      - experiments/2026-09-27-tha008-threshold-audit.md
      - experiments/2026-10-01-dsva-v04-brutal-redteam.md
      - experiments/2026-10-01-dsva-v05-second-order-redteam.md
      - experiments/2026-10-01-dsva-v06-meta-license-retest.md
      - experiments/2026-10-02-dsva-v010-theory-gap-redteam.md
    summary: "Timestamped locked tests/audits; failed assumptions remain preserved for anti-hindsight learning."
    key_boundary: "experiment result/audit != production forecast rule; the S0-S5 state machine in the 7-day backtest is historical and superseded by Unified Crisis State"

  CI:
    kind: DATA_PIPELINE
    label: "FloodConnect CI / Pages"
    epistemic_class: EXECUTABLE_MODEL
    canonical_artifacts: [.github/workflows/floodconnect.yml]
    summary: "Tests critical invariants and rebuilds public page on demand (push to main / workflow_dispatch) from tracked inputs only (site/inputs, sources/*.yaml); the public page shows no-current-data/staleness unless refreshed caller-side; api/v1 JSONs are passed through unchanged. No schedule, no server-side live fetch -- every live fetch is caller-side only."

  SITE:
    kind: OUTPUT
    label: "Public FloodConnect Site"
    epistemic_class: DOCUMENTATION
    canonical_artifacts:
      - site/build_data.py
      - site/build_page.py
      - site/DATA_README.md
    summary: "Cached/curated presentation layer; must not invent risk score or unsupported operational truth."

  # --- New nodes below (added 2026-10-02): local-only clusters that had no RKG node
  # at all before this check (VERIFIED by direct grep of every local-only .py file's
  # basename against this file, pre-pass). No twin exists on either side for these --
  # they are additive, not merges.

  KB:
    kind: OUTPUT
    label: "Knowledge-Base CLI / Question-Bank Coverage / Minimal AI Entrypoint"
    epistemic_class: DOCUMENTATION
    canonical_artifacts:
      - kb.py
      - docs/knowledge/README.md
      - docs/knowledge/INDEX.yaml
      - docs/knowledge/WATER_MANAGER_QUESTION_BANK.md
      - AI.md
      - docs/AI_INTERFACE.md
      - tools/mcp/floodconnect_mcp.py
      - tools/api/export_api.py
      - skills/floodconnect/SKILL.md
    summary: "python3 kb.py find/status/reindex over docs/knowledge/*.md; reports coverage against the question bank. Also hosts `kb.py answer`/`compute` (see AI.md): a minimal compute entrypoint composing existing readout/accountability/community_dag outputs into one envelope -- it REUSES those modules' own epistemic tags verbatim, it never computes a new flood-state claim of its own. The MCP stdio server and static api/v1 export are merged in at file level alongside it; api/v1 and MCP read the last `tools/api/export_api.py` snapshot of the build artifacts kb.py reads live, so their freshness can lag kb.py's, and MCP's own route tool calls `community_dag.find_safe_route` rather than re-implementing it -- AI.md names all three as the entrypoint's three routes and is the single place the shared reasoning rules are stated."
    key_boundary: "a found/indexed document != that document's claims being verified; kb.py only locates, counts, and composes existing tagged outputs -- see AGENTS.md note on hand-editing INDEX.yaml being forbidden. `skills/floodconnect/SKILL.md` and `docs/AI_INTERFACE.md` point to AI.md for the reasoning rules rather than restating them -- a rules edit happens in exactly one file."

  EXPERIENCE_LOG:
    kind: OUTPUT
    label: "Field/Community Experience Log"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - experience_log.py
      - docs/knowledge/experience/README.md
    summary: "Structured store for field/community-report evidence distinct from docs/knowledge/'s RELAYED document cards."
    key_boundary: "a logged experience entry is evidence input, not automatically verified operational truth (same boundary as SOCIAL_LISTENING)."

  ASSETS_REGISTRY:
    kind: REGISTRY
    label: "Physical/Operational Assets Registry"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - assets_registry.py
      - tests/test_assets_registry.py
    summary: "Builds/queries the VERIFIED-asset database (pumps, gates, stations, etc.) from harvested CSV/plan sources into data/assets.sqlite."
    key_boundary: "an asset existing in the registry != that asset's current operational status; status comes from LIVE_DATA_SYSTEM, not this registry."

  BACKTEST:
    kind: OUTPUT
    label: "Backtest / Forward-Forecast Tooling"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - tools/backtest/run_backtest.py
      - tools/backtest/run_backtest_v1.py
      - tools/backtest/run_backtest_v2.py
      - tools/backtest/prop_flood_06.py
      - tools/backtest/prop_flood_06_v3.py
      - tools/backtest/prop_flood_06_v5.py
      - tools/backtest/forward_forecast_bkk_10day.py
      - tools/backtest/score_forward_forecast.py
    summary: "Historical replay + locked prospective-forecast tooling feeding PROSPECTIVE_EXPERIMENTS' timestamped experiment docs."
    key_boundary: "a backtest/forward-forecast result is PROPOSAL tier until locked as an experiment doc (see PROSPECTIVE_EXPERIMENTS); never cite a backtest script's live output as a production forecast."

  HARVEST:
    kind: DATA_PIPELINE
    label: "One-shot Harvest Scripts"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - tools/harvest/bma_drain_pipes.py
      - tools/harvest/bma_maplet_draft.py
      - tools/harvest/bma_station_detail_draft.py
      - tools/harvest/dwr_subbasin.py
      - tools/harvest/hii_flood_area_ckan.py
      - tools/harvest/hii_waterchart_draft.py
      - tools/harvest/ibtracs_bkk_500km.py
      - tools/harvest/point_elevation_openmeteo.py
      - tools/harvest/wikipedia_canals.py
    summary: "One-off/manual pull-and-cache scripts for sources not (yet) wired into collect.py --all's recurring sweep; feeds ASSETS_REGISTRY and SOURCE_REGISTRY candidate rows."
    key_boundary: "a harvested cache file is a point-in-time pull, not a live-refreshed source; see each script's own module docstring for last-run date."

  LAYER0:
    kind: OUTPUT
    label: "Layer-0 Capacity/Block Rendering"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - tools/layer0/in_out_capacity.py
      - tools/layer0/render_block.py
    summary: "Renders per-block in/out drainage-capacity readouts, downstream of DRAINAGE_CAPACITY_INPUTS."
    key_boundary: "a rendered block capacity figure inherits DRAINAGE_CAPACITY_INPUTS' own epistemic tier; this module adds no new measurement."

  RISKMAP:
    kind: OUTPUT
    label: "Sub-basin Risk Map"
    epistemic_class: PROPOSAL
    canonical_artifacts:
      - tools/riskmap/subbasin_risk.py
    summary: "Sub-basin-level risk rendering, downstream of HIERARCHICAL_FLOOD_ZOOM/WATER_BALANCE."
    key_boundary: "a rendered risk map is a PROPOSAL-tier readout aid, never a safety certification or evacuation instruction (same boundary as every other FloodConnect output)."

  HEROMAP:
    kind: OUTPUT
    label: "Sammakorn Hero/Overview Map"
    epistemic_class: DOCUMENTATION
    canonical_artifacts:
      - tools/heromap/sammakorn_map.py
    summary: "Renders the Sammakorn-area overview map used on the public page's top section."
    key_boundary: "a map rendering != a safety claim about any node/route shown on it."

  RECONCILE:
    kind: DATA_PIPELINE
    label: "History Replay / Signal Reconciliation"
    epistemic_class: FIELD_EVIDENCE
    canonical_artifacts:
      - readout_history.py
      - finite_temporal_ledger.py
      - dem_signal_check.py
      - klongmap_local_prior_experiment.py
    summary: "Replays readout_log for trend/history (readout_history.py, computes nothing new, picks no winner between runs -- AGENTS.md §3), plus signal/DEM/local-prior reconciliation checks grouped here as the closest existing boundary (tag INSTINCT -- a judgment call grouping four otherwise-uncategorized local-only scripts by shared 'reconcile past readings' shape, not a pre-existing repo term)."
    key_boundary: "a reconciliation/history-replay result is read-only over existing readout_log rows; it must never retroactively alter a stored observation (append-only rule, AGENTS.md §2)."

