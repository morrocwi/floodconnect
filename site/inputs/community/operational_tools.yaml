    label: "Passenger car / sedan"
    provides: [personnel_transport_light, light_cargo_transport]
    edge_effect: [dry_road_mobility]
    requires_qualified_operator: false
    floodwater_entry: PROHIBITED_BY_DEFAULT

  passenger_van_minibus:
