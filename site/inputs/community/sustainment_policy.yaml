# FloodConnect Shelter Decision & Community Sustainment policy.
# Operational schema rules only. This file contains NO live claim that a node is safe.

version: "0.2"
status: "operational_schema_fail_closed"

construct:
  id: LVCN
  name: "Lowest Viable Community Node"
  provenance: "FloodConnect repo-specific proposal informed by disaster/shelter literature"
  claimed_global_standard: false

architecture:
  hydrology_control: "separate readout layer"
  movement_graph: "community_dag.py DAG; people/vehicle movement only"
  support_network: "directed non-DAG support_edges; resources/helpers may move laterally/backward"
  rule: "never infer support delivery from movement topology alone"

lvcn:
  candidate_kinds:
    - household
    - buddy_cell
    - zone
    - internal_safe
    - external_safe
  excluded_kinds:
    - egress
    - supply_point
  exactness:
    exact: EXACT_LVCN
    higher_known_candidate_when_lower_unknown: KNOWN_VIABLE_UPPER_BOUND
  rule: "a higher known viable node must not erase UNKNOWN at a lower layer"

sustainment:
  states: [SUSTAINABLE, NOT_SUSTAINABLE, UNKNOWN]
  physical_safety: [SAFE, UNSAFE, UNKNOWN]
  resource_state: [SUFFICIENT, INSUFFICIENT, NOT_REQUIRED, UNKNOWN]
  required_fields:
    - physical_safety
    - potable_water_for_horizon
    - service_water_for_horizon
    - food_for_horizon
    - essential_medicine_for_horizon
    - critical_power
    - sanitation_hygiene
    - communications
    - vulnerable_support
  planning_horizon_h: null
  rule: "planning horizon is caller/authority declared; never default to 24/48/72 h"

escalation:
  states: [ESCALATABLE, ISOLATED, UNKNOWN]
  rule: "escalation capability is reported separately and never changes a safe/supplied node into NOT_SUSTAINABLE"

decision_states:
  - STAY_AND_SUSTAIN
  - RESUPPLY_WINDOW
  - PREPARE_TO_MOVE
  - REQUEST_LOGISTICS_OR_ASSISTED_EVACUATION
  - EVACUATE_ROUTE
  - SHELTER_OPERATION
  - RETURN_RELOCATE_CLOSE
  - VERIFY_BEFORE_ACTION

resupply_window:
  automatic_travel_instruction: false
  requires:
    - current_node_physical_safety_SAFE
    - declared_horizon_resource_gap
    - verified_supply_point
    - fresh_field_verified_movement_path
    - route_mode_feasible
    - no_conflicting_official_movement_instruction

shelter_phases:
  PRE_OPEN:
    - site_hazard_safety
    - structural_fire_safety
    - access_accessibility
    - communications
    - capacity
    - management_staffing
    - perimeter_flood_defense
    - dewatering_capability
    - exit_closure_plan
  OCCUPIED:
    - site_hazard_safety
    - structural_fire_safety
    - access_accessibility
    - drinking_water
    - service_water
    - sanitation_hygiene
    - food_special_diets
    - medicine_health
    - critical_power
    - communications
    - capacity
    - member_accountability
    - vulnerable_support
    - resupply_access
    - management_staffing
    - waste_management
    - sleeping_protection
    - exit_closure_plan
  RECOVERY:
    - site_hazard_safety
    - service_water
    - sanitation_hygiene
    - medicine_health
    - communications
    - waste_management
    - post_flood_cleaning
    - exit_closure_plan

member_need_profile:
  privacy: "aggregate operational needs only; no names, diagnoses, phone numbers, room/house identifiers"

  # Do not collapse these into one 'vulnerable' count. Different groups have different
  # dependencies and service needs.
  demographic_life_stage:
    - child_0_5
    - child_6_12
    - adolescent_13_17
    - adult_18_59
    - older_adult_60_plus
    - pregnant_person
    - postpartum_person

  health_function:
    - mobility_assistance
    - essential_medication
    - time_critical_medical_followup
    - medical_device_power_dependency
    - communication_assistance
    - special_diet
    - infant_feeding

  living_arrangement:
    - single_person_household
    - older_adult_alone
    - single_caregiver_household
    - dependents_without_co_resident_capable_adult
    - co_resident_capable_adults
    - co_resident_caregivers
    - unreachable_households

  dependency_link_gaps:
    - child_caregiver_link_uncovered
    - older_adult_support_link_uncovered
    - pregnancy_support_link_uncovered
    - medical_support_link_uncovered
    - living_alone_buddy_link_uncovered

  pairing_rule: >
    Demographic category alone never makes a node non-viable. Evaluate the declared
    dependency and whether a corresponding caregiver/buddy/medical/logistics support
    link exists and is reachable/fresh.

  typical_functional_pairings:
    - "child_0_5 -> caregiver + feeding/hygiene + evacuation assistance"
    - "child_6_12 -> responsible adult + communication/evacuation supervision"
    - "older_adult_60_plus with mobility/medical dependency -> caregiver or buddy + medicine/transport link"
    - "pregnant/postpartum person -> companion/buddy + maternal-health access"
    - "time-critical patient -> caregiver/buddy + verified medical referral/transport"
    - "medical-device power dependency -> critical power + backup + medical escalation"
    - "single-person household -> buddy/check-in link"
    - "single-caregiver household -> backup caregiver/buddy link for dependents"

defaults:
  unknown_is_safe: false
  allow_weighted_override: false
  allow_unverified_route: false
  allow_unverified_shelter: false
  allow_inferred_stock_duration: false
  allow_building_type_as_safety_proxy: false

implementation:
  code_module: "shelter_decision.py"
  movement_module: "community_dag.py"
  note: "Hydrology, movement, sustainment and support remain separate claim layers."
