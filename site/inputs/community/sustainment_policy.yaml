# FloodConnect Shelter Decision & Community Sustainment policy.
# Operational schema rules only. This file contains NO live claim that a node is safe.

version: "0.2"
status: "operational_schema_fail_closed"

construct:
  id: LVCN
  name: "Lowest Viable Community Node"
  provenance: "FloodConnect repo-specific proposal informed by disaster/shelter literature"
  claimed_global_standard: false

architecture:
  hydrology_control: "separate readout layer"
  movement_graph: "community_dag.py DAG; people/vehicle movement only"
  support_network: "directed non-DAG support_edges; resources/helpers may move laterally/backward"
  rule: "never infer support delivery from movement topology alone"

lvcn:
  candidate_kinds:
    - household
    - buddy_cell
    - zone
    - internal_safe
    - external_safe
  excluded_kinds:
    - egress
    - supply_point
  exactness:
    exact: EXACT_LVCN
    higher_known_candidate_when_lower_unknown: KNOWN_VIABLE_UPPER_BOUND
  rule: "a higher known viable node must not erase UNKNOWN at a lower layer"

sustainment:
  states: [SUSTAINABLE, NOT_SUSTAINABLE, UNKNOWN]
  physical_safety: [SAFE, UNSAFE, UNKNOWN]
  resource_state: [SUFFICIENT, INSUFFICIENT, NOT_REQUIRED, UNKNOWN]
  required_fields:
    - physical_safety
    - potable_water_for_horizon
    - service_water_for_horizon
    - food_for_horizon
    - essential_medicine_for_horizon
    - critical_power
    - sanitation_hygiene
    - communications
    - vulnerable_support
  planning_horizon_h: null
  assessed_horizon_h: null
  rule: >
    planning horizon is caller/authority declared; every SUFFICIENT/INSUFFICIENT assessment
    must declare assessed_horizon_h and assessed_horizon_h must be >= requested planning_horizon_h;
    never default to 24/48/72 h

escalation:
  states: [ESCALATABLE, ISOLATED, UNKNOWN]
  rule: "escalation capability is reported separately and never changes a safe/supplied node into NOT_SUSTAINABLE"

decision_states:
  - STAY_AND_SUSTAIN
  - STAY_AND_PREPARE
  - STAY_AND_PREPARE_WINDOW_CLOSING
  - RESUPPLY_WINDOW
  - REQUEST_OR_RECEIVE_SUPPORT_DELIVERY
  - VERIFY_SUPPORT_CAPACITY_OR_TIMING
  - REQUEST_LOGISTICS_OR_REASSESS_MOVEMENT
  - PREPARE_TO_MOVE
  - REQUEST_ASSISTED_EVACUATION
  - EVACUATE_ROUTE
  - SHELTER_OPERATION
  - RETURN_RELOCATE_CLOSE
  - VERIFY_AND_PREPARE
  - VERIFY_BEFORE_ACTION

support_capability:
  applies_to: [buddy_cell, zone, supply_point, community_kitchen, civil_society_provider]
  rule: "support capability is not occupancy viability"
  requires:
    - fresh_support_assessment
    - assessed_horizon_h_covers_requested_horizon
    - requested_resource_status_SUFFICIENT
  delivery_path:
    verified_path_only_state: PATH_ONLY
    need_closable_state: NEED_CLOSABLE
    need_closable_requires:
      - fresh_field_verified_support_path
      - path_capacity_status_SUFFICIENT
      - arrival_before_failure_true

resupply_window:
  automatic_travel_instruction: false
  requires:
    - current_node_physical_safety_SAFE
    - declared_horizon_resource_gap
    - verified_supply_point
    - verified_stock_for_each_requested_resource
    - supplier_assessed_horizon_covers_requested_horizon
    - fresh_field_verified_movement_path
    - route_mode_feasible
    - no_conflicting_official_movement_instruction

forward_hazard:
  independent_from_current_state: true
  states: [NONE, LOW, WATCH, HIGH, CRITICAL, ACTIVE, UNKNOWN]
  rule: >
    current SAFE/SUSTAINABLE may coexist with forward WATCH/HIGH/CRITICAL/ACTIVE;
    forward hazard may trigger preparation or preserve a closing mobility window but never
    fabricates an evacuation decision

shelter_phases:
  PRE_OPEN:
    - site_hazard_safety
    - structural_fire_safety
    - access_accessibility
    - communications
    - capacity
    - management_staffing
    - residual_flood_exposure
    - exit_closure_plan
    conditional:
      when_residual_flood_exposure_PRESENT_or_LIKELY:
        - perimeter_flood_defense
        - dewatering_capability
  OCCUPIED:
    - site_hazard_safety
    - structural_fire_safety
    - access_accessibility
    - drinking_water
    - service_water
    - sanitation_hygiene
    - food_special_diets
    - medicine_health
    - critical_power
    - communications
    - capacity
    - member_accountability
    - vulnerable_support
    - resupply_access
    - management_staffing
    - waste_management
    - sleeping_protection
    - privacy_dignity
    - child_safeguarding
    - gbv_protection
    - feedback_complaints
    - family_unity
    - psychosocial_referral
    - exit_closure_plan
  RECOVERY:
    - site_hazard_safety
    - service_water
    - sanitation_hygiene
    - medicine_health
    - communications
    - waste_management
    - post_flood_cleaning
    - exit_closure_plan

member_need_profile:
  privacy: "aggregate operational needs only; no names, diagnoses, phone numbers, room/house identifiers"

  principle: >
    Separate demographic/life-stage vulnerability from functional dependency and from
    living arrangement. A demographic label triggers assessment; hard failure comes from
    an unmet declared functional need or missing required support link, not age/pregnancy alone.

  demographic_life_stage:
    - child_0_5
    - child_6_12
    - adolescent_13_17
    - adult_18_59
    - older_adult_60_plus
    - pregnant_person
    - postpartum_person

  health_status_counts:
    - chronic_or_acute_illness
    - disability_or_functional_limitation
    - bedbound_or_homebound

  functional_need_counts:
    - needs_continuous_supervision
    - needs_mobility_assistance
    - needs_essential_medication
    - needs_time_critical_medical_followup
    - needs_power_dependent_medical_device
    - needs_communication_assistance
    - needs_special_diet
    - needs_infant_feeding
    - needs_maternal_health_access

  living_arrangement:
    categorical:
      - ALONE
      - PAIR
      - FAMILY_GROUP
      - MULTIGENERATIONAL
      - GROUP_CARE
      - UNKNOWN
    counts_flags:
      - single_person_household
      - older_adult_alone
      - single_caregiver_household
      - dependents_without_co_resident_capable_adult
      - co_resident_capable_adults
      - co_resident_caregivers
      - unreachable_households

  required_support_link_checks:
    - child_caregiver_link_uncovered
    - backup_caregiver_link_uncovered
    - older_adult_support_link_uncovered
    - pregnancy_support_link_uncovered
    - medical_support_link_uncovered
    - mobility_support_link_uncovered
    - power_dependency_support_link_uncovered
    - communication_support_link_uncovered
    - living_alone_buddy_link_uncovered

  composition_tags:
    descriptive_only:
      - LIVES_ALONE
      - PAIR
      - GROUP
      - CHILD_WITH_OLDER_ONLY
      - OLDER_ONLY_HOUSEHOLD
      - PREGNANT_ALONE
      - POSTPARTUM_ALONE
      - HEALTH_DEPENDENCY_ALONE
      - MULTIGENERATIONAL
      - SINGLE_CAREGIVER_WITH_DEPENDENTS
      - NO_CO_RESIDENT_CAPABLE_ADULT
      - MULTIPLE_FUNCTIONAL_DEPENDENCIES
    rule: "tags trigger focused assessment; tags never by themselves mark a household unsafe"

  pairing_rules:
    - "child/adolescent present -> caregiver link must be checked"
    - "single caregiver + dependents -> backup caregiver/buddy link must be checked"
    - "older adult + declared mobility/medicine/communication/supervision need -> older-adult support link required"
    - "pregnant/postpartum alone is an assessment trigger; maternal-health support link becomes hard only when a functional maternal-health need is declared"
    - "essential medicine/time-critical care/bedbound or power-dependent care -> medical support link required"
    - "chronic illness label alone does not create a medical-support hard constraint"
    - "mobility dependency -> mobility support link required"
    - "power-dependent medical device -> backup-power support link required"
    - "communication dependency -> communication support link required"
    - "living alone + any vulnerability/dependency -> buddy/check-in link required"

  non_inference_rules:
    - "two older adults living together are not assumed to be mutual caregivers"
    - "presence of a working-age adult does not imply caregiver capacity"
    - "pregnancy does not imply immobility"
    - "older age does not imply dependency"
    - "illness category does not reveal or store a diagnosis"
    - "co-residence does not imply the needed support function is available"

defaults:
  unknown_is_safe: false
  allow_weighted_override: false
  allow_unverified_route: false
  allow_unverified_shelter: false
  allow_inferred_stock_duration: false
  allow_building_type_as_safety_proxy: false

environmental_degradation:
  module: "environmental_degradation.py"
  purpose: "represent safe-now -> degrading -> unsafe transitions even when water depth is unchanged"
  states: [STABLE, DEGRADING, UNSAFE, UNKNOWN]
  unknown_is_safe: false

  immediate_triggers:
    sewage_intrusion:
      states: [NONE, SUSPECTED, CONFIRMED, UNKNOWN]
      rule: "SUSPECTED/CONFIRMED has no safe-age grace period"
      effects:
        - sanitation_hygiene_failure
        - contaminated-water precautions
    sewer_backflow:
      states: [NONE, SUSPECTED, CONFIRMED, UNKNOWN]
      effects:
        - sanitation_hygiene_failure
        - service_water_degradation

  clocks:
    wet_material_mold:
      watch_h: 24
      assume_mold_h: 48
      evidence_basis: "CDC flood/mold guidance"
      reset_requires: "fully_dried_and_remediated=true"
    standing_water_vector:
      weekly_control_h: 168
      evidence_basis: "CDC weekly source reduction; some common mosquitoes develop egg-to-adult in ~7-10 days"
      note: "168 h is a control-cycle deadline, not a universal disease-risk threshold"

  sewer_gas:
    odor_is_clearance: false
    h2s_ppm_inference_without_measurement: false
    qualitative_formation_inputs:
      - anaerobicity
      - organic_or_sewage_load
      - sulfate_if_measured
      - hydraulic_residence_time_if_measured
      - temperature_if_measured
    measured_h2s_trigger_ppm: 10
    trigger_provenance: "NIOSH occupational 10-minute ceiling; hazard trigger only, not residential clearance"
    confined_space_entry_allowed: false

  drain_trap:
    dry_trap_can_open_sewer_gas_path: true
    note: "trap seal control is distinct from sewer surcharge/backflow control"

  effective_horizon:
    equation: "T_effective = min(T_resource, T_environment, T_access, T_forward_hazard)"
    rule: >
      if a known environmental deadline falls inside the requested planning horizon,
      the node cannot be claimed sustainable for the full horizon unless a verified
      mitigation plan will occur before that deadline

  mitigation:
    clock_extension_requires_verified_effect: true
    no_unmeasured_guaranteed_extension: true
    preferred_source_controls:
      - safe drainage_or_water_removal
      - rapid drying_of_wet_materials
      - remove_organic_waste_and_keep_drains_clear
      - restore_or_isolate_wastewater_function
      - verified_backflow_protection
      - maintain_drain_trap_seal_when_dry_trap_is_the_pathway
      - standing_water_source_reduction
      - qualified_gas_monitoring_and_safe_ventilation
    em_or_chemical_treatment:
      automatic_credit: false
      note: "Thai official guidance may recommend context-specific treatments; FloodConnect does not assign extra safe hours without measured/validated effect"

  temporal_accumulation:
    module: "finite_temporal_ledger.py"
    toledo_alignment:
      bounded_window_required: true
      finite_event_set_required: true
      exact_duration_arithmetic: "Fraction/Q"
      infinity_sentinel_allowed: false
      unknown_prior_history_as_zero_allowed: false
      incomplete_history_numeric_accumulation_allowed: false
    timeline_window:
      required_fields: [start, end, complete]
      rule: "end > start and both timestamps finite/declared; complete must be true for exact accumulation"
    event_types: [START, OBSERVED_ACTIVE, MITIGATION, RESOLVED]
    verified_event_required: true
    left_censoring:
      rule: >
        OBSERVED_ACTIVE without a verified START proves activity but not onset.
        Mark LEFT_CENSORED; do not assign cumulative/current episode hours.
    transition_rules:
      - "duplicate START while active is invalid"
      - "RESOLVED without START is invalid"
      - "MITIGATION never stops a clock; only verified RESOLVED does"
    outputs:
      - current_episode_h_q
      - cumulative_h_q
      - recurrence_count
      - active_at_window_end
      - active_mechanism_count
      - max_concurrent_mechanisms
    interpretation: >
      These outputs are finite temporal bookkeeping within one declared observation window.
      They are not toxicity, pathogen, resilience, or risk scores.

  node_fields:
    - evaluated_at
    - sewage_intrusion
    - indoor_floodwater_present
    - sewer_backflow
    - drainage_surcharge_possible
    - backwater_valve_state
    - sewer_gas_odor
    - low_lying_or_enclosed_space
    - ventilation
    - measured_h2s_ppm
    - drain_trap_state
    - indoor_materials_wet
    - indoor_wet_since
    - fully_dried_and_remediated
    - standing_water_present
    - standing_water_since
    - water_movement
    - organic_or_sewage_load
    - mitigation_plan_verified
    - mitigation_before_deadline

privacy_architecture:
  public_aggregate_layer:
    allowed: "counts, functional needs, coverage gaps, no names/diagnoses/phone/address"
  restricted_local_roster:
    purpose: "last-mile buddy/zone/responder delivery to actual households"
    storage_rule: "must not be committed to the public FloodConnect repository"
    identifiers: "local pseudonymous/authorized references only"

implementation:
  code_module: "shelter_decision.py"
  movement_module: "community_dag.py"
  note: "Hydrology, movement, sustainment and support remain separate claim layers."
