# soi_tiers_2026-09-26.yaml
# Per-soi flood-onset ladder, หมู่บ้านสัมมากร (Ramkhamhaeng 110/112, Saphan Sung)
# Built 2026-09-26. Tags per row: RELAYED=community report, MEASURED=geometry from OSM/Bing roads + haversine,
# INSTINCT=tier grouping + interpolated geocode judgment, OPEN=unresolved (esp. trigger_levels).
# NO risk score/formula anywhere in this file (per project rule: a formula needs Toledo registration first).
# Ladder is purely empirical ordering by observed onset time + depth on 2026-09-26.
office: {lat: 13.758235, lon: 100.676084, note: "ARAYA office, ซอย 44"}
tiers_definition:
  T1: "ท่วมเข้าบ้านก่อนใคร (house entry <=06:00 หรือ depth>=20cm)"
  T2: "เข้าบ้าน/โรงรถ 06:00-08:00"
  T3: "เข้าโรงรถ/ถนนท่วมทั้งซอย 08:00-10:00"
  T4: "ท่วมถนน/ซึม หลัง 10:00"
  T5: ไม่มีรายงานวันนี้ (unknown != safe)
pond_overflow_vs_soi_onset_test: # INSTINCT, maintainer hypothesis check
  hypothesis: "บึงล้นก่อน แล้วซอยรอบบึงถึงท่วม (pond overflows -> nearby sois flood)"
  verdict: MIXED_REVERSED_IN_PART
  detail: >-
    INSTINCT read of today's data: the order does NOT hold cleanly. ซอย 50 (0-150m ring of
    บึงรับน้ำสัมมากร 4/ST.SPS.02) reported house entry at 04:00, several hours BEFORE any pond
    overflow report (earliest pond overflow report is บึงหน้าคอนโด ซ.18 / ทะเลสาบต้นสน around
    06:00-08:00). ซอย 48 and 48/3 (also 0-150-300m ring of the same pond/pump) follow at
    06:00-09:00, roughly overlapping the pond-overflow window rather than clearly after it.
    For the ซอย 17/18/A8/B5 cluster near บึงรับน้ำสัมมากร 1 (ST.SPS.04) the order looks closer
    to the hypothesis: บึงหน้าคอนโด ซ.18 overflow ~06:00-07:00 lines up with ซอย18 (06:00-07:00,
    same time, not clearly after) and precedes ซอย A8/B5 (08:00-09:00) and ซอย 17 (11:10).
    ทะเลสาบ 2 ล้นเข้าบ้าน at 11:20 (ST.SPS.04, บึง1) is LATE relative to nearby ซอย17/18 which
    already flooded hours earlier -- reversed for that pair.
    Reading: low-lying sois close to a canal/culvert (ซอย 50, 59) can flood from direct canal
    backflow BEFORE the retention pond itself is reported full; other sois cluster around the
    pond's overflow window. The single global rule "pond fills -> then sois flood" is not clean;
    it is closer to true for the ST.SPS.04/บึง1 cluster than for the ST.SPS.02/บึง4 cluster.
  what_would_settle_it: >-
    A time series of each pond's water level (not a single 11:25 snapshot) matched minute-for-
    minute against each soi's first-flood report. We have only one BMA canal snapshot
    (2026-09-26T04:01:59Z fetch, records timestamped 2026-09-25 20:05 -- i.e. the PRIOR evening,
    not today's event) and two pumphistory HTML captures (11:25, 12:00 Thai time) that show only
    pump ON/OFF status text (one pump "ขัดข้อง"/malfunction), no numeric pond-depth values in the
    files actually on disk. The maintainer-supplied 11:25 pond levels (บึง4 0.73m, บึง2 0.57m, บึง1
    1.27m, บ้านม้า2 ขัดข้อง 0/4) are RELAYED here, not independently re-derived from the raw files
    in this repo within this pass -- OPEN: could not locate the exact source file/endpoint that
    carries those numeric pump/level readings.
