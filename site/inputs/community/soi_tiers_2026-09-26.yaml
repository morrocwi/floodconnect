    interval: "15-minute, 2026-09-23 00:00 through 2026-09-26 12:30 in this pull"
    critical_finding: >-
      This endpoint DOES exist and returns a real time series (this is the calibration source the
      trigger_levels field needs). BUT for WL.SSB.07 the last non-null reading in the pulled window is
      2026-09-25 20:00 (value 0.40 m, warning_level 0.35 m, critical_level 0.45 m -- so already just
      above warning at 20:00 the evening BEFORE today's flood). Every 15-min slot from 2026-09-25 20:15
      through 2026-09-26 12:30 (i.e. the entire flood morning) is null -- the station appears to have
      stopped reporting right before/during the event. This does NOT satisfy "same-day reading exists"
      for any soi's first_time today, so trigger_levels stays OPEN for all rows. It does mean: if this
      endpoint is re-pulled later (station_id=77 for WL.SSB.07, and the equivalent station_id for
      WL.TPK.03) once the gap backfills or reporting resumes, trigger_levels CAN be calibrated from it --
