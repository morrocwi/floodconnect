  - "0 SELF: เช็กคนในบ้าน ไฟฟ้า ยา น้ำ โทรศัพท์ และทางออกของตัวเอง"
  - "1 BUDDY: เช็กบ้านคู่/กลุ่มบ้านว่าติดต่อได้และต้องการความช่วยเหลืออะไร"
  - "2 ZONE: รวม demand + supply + ทางผ่านได้ โดยไม่เปิดเผยข้อมูลส่วนบุคคลเกินจำเป็น"
  - "3 INTERNAL SAFE: เปิดใช้เฉพาะจุดที่ field-verified และยัง fresh"
  - "4 EGRESS: ยืนยันทางออกอย่างน้อย 2 ทางที่ failure domain ต่างกันเมื่อทำได้"
  - "5 EXTERNAL SAFE: ส่งต่อเฉพาะ node ที่ verified_safe=true, SAFE, fresh และ capacity พอ"
