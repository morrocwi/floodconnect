# FloodConnect community self-help DAG
#
# STATUS: DECLARED TOPOLOGY / NOT YET FIELD-VERIFIED FOR ROUTING.
#
# This file creates real graph structure for the two FloodConnect areas, but it does NOT
# claim that any internal refuge, egress point, or external safe place is currently safe.
# Those operational fields remain UNKNOWN until a person physically verifies them.
#
# The graph is intentionally layered so every edge moves forward:
# 0 household -> 1 buddy_cell -> 2 zone -> 3 internal_safe -> 4 egress -> 5 external_safe
# A direct edge may skip layers, but may never point backward or sideways.

version: "0.1"
status: "proposal_operational_schema"
epistemic_note_th: >
  ไฟล์นี้ประกาศ "โครงเครือข่ายที่จะใช้" ไม่ได้ประกาศว่าทางใดปลอดภัยจริง ณ ตอนนี้
  node/edge ที่ยังไม่ได้ตรวจภาคสนามต้องคง status=UNKNOWN, fresh=false และ
  field_verified/verified_safe=false; community_dag.py จะไม่ใช้เส้นทางเหล่านี้นำทางคน.

privacy_rule_th: >
  เก็บเฉพาะสิ่งที่จำเป็นต่อการช่วยเหลือ เช่น จำนวนคน ความต้องการช่วยเคลื่อนย้าย และสถานะติดต่อ
  หลีกเลี่ยงชื่อเต็ม เลขบ้าน โรคประจำตัว หรือข้อมูลส่วนบุคคลละเอียดในกราฟสาธารณะ.

layers:
  0: "คน/ครัวเรือน — ทำให้ตัวเองอยู่รอดก่อน"
  1: "buddy cell — กลุ่มบ้านช่วยตรวจสอบกัน"
  2: "zone — พื้นที่ย่อยรวมคำขอ/ทรัพยากร"
  3: "internal safe — จุดพัก/รวมพลในพื้นที่ที่ตรวจแล้ว"
  4: "egress — ประตูออก/ทางเชื่อมออกจากพื้นที่"
  5: "external safe — node ปลอดภัยภายนอกที่ตรวจภาคสนามแล้ว"

