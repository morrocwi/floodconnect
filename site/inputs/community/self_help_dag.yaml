  # access-first case -- boat mode blocked by obstacles/fences -> air/drone mode. Bangkok
  # MVP scope (project-floodconnect-mvp-scope). Only a zone + 4 `support` nodes declared
  # here (no household/buddy_cell/internal_safe/egress chain -- not what this check asked
  # for and would need field verification this repo has not done); every node stays
  # status=UNKNOWN/fresh=false, exactly like every other undeclared-verification node in
  # this file.
  # ---------------------------------------------------------------------------
  romklao_zone:
    kind: zone
    layer: 2
    area_id: romklao
    label_th: "node พื้นที่เคหะชุมชนร่มเกล้า (ลาดกระบัง)"
    status: UNKNOWN
    fresh: false
    capacity_persons:
