    # resources (docs/knowledge/card_tool_rescue_drones_romklao_2569.md) -- same pattern
    # as sammakorn_zone's boat entry: an OPTIONAL tool a zone may request via agencies,
    # not a claim that a drone is on-site today. condition_* are booleans/text only.
    resources:
    - type: drone
      ref: RES.TOOL.RESCUE_DRONE
      status: UNKNOWN
      condition_coordination_with_agency_required: true
      condition_line_of_sight_or_comms_link_required: true
      condition_payload_weight_check: true
      note_th: >
        เงื่อนไขก่อนใช้งานจริง -- ต้องประสานหน่วยงาน (อว./พม./สอป./บริษัทผู้ให้บริการ), ต้องมี
        สัญญาณควบคุม/แนวสายตาเพียงพอ, ต้องตรวจน้ำหนักของที่จะส่งก่อนบิน -- ใช้สำหรับส่งของ/
        สำรวจเท่านั้น ไม่ใช่โหมดย้ายคน (ดู community_dag.py EDGE_MODES)
      # shared_pool (added 2026-09-28, docs/knowledge/card_community_selforg_pattern_2569.md
      # -- แฟลตคลองจั่น/ร่มเกล้า self-organisation pattern, RELAYED) -- ชุมชนรวมกองกลางเอง
      # ไม่ใช่ทรัพยากรที่หน่วยงานจัดสรรให้ (ต่างจาก drone/kitchen ด้านบน)
    - type: shared_pool
      ref: RES.TOOL.SHARED_POOL
      status: UNKNOWN
      pools_active: [money, medicine, drinking_water]
      note_th: "กองกลางที่ชุมชนรวมกันเอง (เงิน/ยา/น้ำดื่ม) -- ไม่ใช่การจัดสรรจากหน่วยงาน"
    roles_active: [coordinator, welfare, route_checker, resource_keeper, comms, procurement_runner]

