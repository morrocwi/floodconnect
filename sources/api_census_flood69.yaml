  - id: flood69_api_klongmap
    agency: "พรรคประชาชน (People's Party) -- proxying BMA สำนักการระบายน้ำ (Dept. of Drainage and Sewerage) KlongMap"
    name_th: "แผนผังการไหลของน้ำในคลอง (proxy ของ weather.bangkok.go.th/KlongMap)"
    name_en: "Bangkok canal-flow map, mirrored/cached from BMA KlongMap"
    url: "https://flood69.peoplesparty.or.th/api/klongmap"
    kind: json_api
    auth: none
    format: json
    cadence: "page states its own cadence explicitly: 'ดึงข้อมูลผ่านเซิร์ฟเวอร์ตัวกลางที่เก็บสำเนาไว้ครั้งละ
      5 นาที เพื่อลดภาระระบบของ กทม.' (mirrored/cached every 5 minutes, to reduce load on BMA's
      own system) -- an explicit server-side caching layer in front of BMA, not a direct passthrough."
    has_coords: false
    coverage: "Bangkok canals only (ฝั่งธนบุรี / ฝั่งพระนคร zone toggle in UI, system_id 1/2 in payload)"
    asset_classes: [canal, gauge, gate, pump, tide_table]
    status: reachable
    http_status: 200
    probed_at: "2026-09-27"
    upstream_cited_on_page: "https://weather.bangkok.go.th/KlongMap (สำนักการระบายน้ำ กทม., linked
      directly in the page's own attribution footer: 'ภาพแผนผังและข้อมูล © สำนักการระบายน้ำ กทม.')"
    payload_shape: >
      Single JSON object, 6 top-level keys: waterStation (403 rows, per-station schema --
      water_id/water_name/lat-long/water_min-max/bed_bank/left_bank/right_bank/warning
      /critical thresholds x2 sets (out01/out02)/pump_count/water_gate_count/
      station_status/waterstatus/statusColor/water_control/district_name/river_name/
      map offset_x-y -- ALL null except water_id/system_id/active/offset_x/offset_y in
      this snapshot, so this call returns the map-LAYOUT table, not live values, at
      this moment -- OPEN why live fields are null here); stationMap (253 rows, station
      label + map pixel-offset, e.g. station_name "ค.บางพรม-ถ.กาญจนาฯ" = canal-x-road
      junction naming); arrowMap (241 rows, flow-direction arrows: offset_x/y,
      configs "32,32,0deg,0000FF" = width,height,rotation-degrees,hex-color, plus
      reverse/flow_id/configs_reverse fields for a second, opposite-direction arrow
      state -- null in this snapshot but structurally present); riverMap (12 named
      canal segments, river_map_id + Thai/English name); listRiverMap (89 rows joining
      station_id to river_map_id with profile_order (sequence position along the
      canal) and point (wl_out01 etc -- which gauge leg this reading is));
      dailyheightwater (1 object, BMA/Hydrographic-style tide table: date_stamp,
      daily_time/hight_water, daily_time_low/low_water, night_time/hight_water_pm,
      night_time_low/low_water_pm -- AM/PM high/low tide time+height).
    notes: >
      This is functionally a proxy of BMA's own KlongMap system, not an independent
      instrument or independent dataset -- it re-serves BMA's schema near-verbatim
      (water_control field name matches this repo's own
      docs/knowledge/BMA_STATION_DETAIL_PROBE.md finding on a DIFFERENT BMA endpoint,
      weather.bangkok.go.th/water/StationDetail -- same agency, same field vocabulary,
      different URL path (/KlongMap vs /water/...) -- not yet confirmed whether this
      is the exact same backend table or a sibling one -- OPEN). No licence/terms text
      seen on the page during this probe (footer only credits the source, does not
      state re-use terms) -- RELAYED, unresolved, same posture as this repo's other
      BMA sources.
    tag: RELAYED
    raw_archive: raw/live/flood69_peoplesparty/api_klongmap_2026-09-27.json
