# API census -- flood69.peoplesparty.or.th (third-party dashboard, พรรคประชาชน)
#
# Same schema/vocab as sources/api_census.yaml. This is a CENSUS of what this one
# third-party dashboard aggregates and re-serves -- not a claim of quality, not an
# endorsement, and not an adoption of any political framing. Tier: third_party
# aggregator (RELAYED). Its own upstream is BMA's KlongMap system
# (weather.bangkok.go.th/KlongMap), which this repo does not otherwise have wired in
# under this exact URL (bma_watermap/BMA_STATION_DETAIL_PROBE hit a different BMA
# endpoint, PageMap/GoogleMap + StationDetail).
#
# Method: WebFetch/curl (index.html, JS bundle) + one Playwright page load of
# https://flood69.peoplesparty.or.th/#klong to capture the SPA's own runtime network
# call (SPA bundles ship no literal API string; only a rendered page reveals it) +
# one curl of the resulting JSON endpoint. 4 distinct HTTP fetches total this check,
# all archived under raw/live/flood69_peoplesparty/. No auth, no retries, one request
# per URL.

census_date: "2026-09-27"
probe_budget_used: 4
notes_on_budget: >
  index.html (1) + main JS bundle index--avEOgbL.js (1, grepped for API strings --
  none found; the SPA's fetch call is dynamic, not a literal in the bundle) + one
  Playwright render of #klong to capture the real XHR (revealed /api/klongmap) +
  one curl of that JSON endpoint (1). Well under the 8-request budget for this check
  and under the workspace's "one request per URL, no retries" rule.

