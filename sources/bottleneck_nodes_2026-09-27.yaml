# bottleneck_nodes_2026-09-27.yaml -- ranked east-zone bottleneck structures on the paths
# between BKK-east canals and the Chao Phraya outfall, plus Sammakorn's own pumps.
#
# Founder context: DRAINAGE_CAPACITY_MAP.md already showed the river itself is NOT this
# week's bottleneck (~1,300 m3/s of river headroom exists but is unusable right now -- see
# that doc's new section "ทำไมที่ว่างในแม่น้ำ ... ใช้ไม่ได้ทันที"). This ledger ranks the
# STRUCTURES between Sammakorn/east-zone canals and that river outfall by utilisation
# (current/rated, or "at full" when only a status statement exists) and by
# contributing-canal in-degree (how many upstream canal reaches feed into it) -- the
# combination that determines which structure is actually limiting drainage right now.
#
# Toledo: no equation -- ranking is a sort on numbers/states already recorded in
# sources/capacity_ledger.yaml, sources/drainage_mode.yaml, and data/observations.sqlite's
# assets table (queried directly this check). No new capacity numbers are invented; a
# missing utilisation is left OPEN.
#
# Coordinates: taken directly from data/observations.sqlite's assets table (lat/lon
# columns) where a row exists; OPEN (never geocoded) where no asset row carries a
# coordinate for that exact structure -- see each row's `coord_source` field.

ranked_2026_09_27:

  - rank: 1
    id: outfall:phra_khanong
    name_th: "จุดออกพระโขนง (สถานีสูบน้ำพระโขนง + อุโมงค์พระโขนง)"
    lat: 13.7085
    lon: 100.5953
    coord_source: "data/observations.sqlite assets (pump_station:water_station:1)"
    kind: pump_station_and_tunnel
    capacity_m3s: 49
    utilisation: "at_full (proxy)"
    utilisation_basis: >
      Not itself individually metered this check, but this structure is part of the
      ฝั่งพระนคร pump group reported RELAYED at full capacity (1,200/1,200 m3/s, all
      running) since 25 ก.ย. 2569 (led:bkk_total_pumping_phranakhon,
      sources/capacity_ledger.yaml) -- utilisation shown here is a scope-proxy from that
      wider group, not a per-station reading of พระโขนง alone (OPEN at the per-station
      level).
    in_degree_contributing_canals: "high -- serves the east-side canal network (แสนแสบ/ประเวศ chain) that Sammakorn's own watershed ultimately drains toward (per capacity_ledger.yaml notes on this row)"
    tag: RELAYED
    why_ranked_1: >
      Highest confirmed utilisation of any structure in this list (reported at-full, not
      just "actively managed") AND high in-degree (terminal outfall for the whole
      catchment Sammakorn sits within) -- the closest thing this ledger has to a measured
      real bottleneck on the east-zone path.

