    utilisation: OPEN
    utilisation_basis: "No m3/s capacity published for this gate (drainage_mode.yaml, capacity_ledger.yaml both OPEN) -- only a numeric managed CONTROL BAND exists (water_control=0.2, warning=0.5, critical=0.6 m.รทก.), not a throughput figure, so utilisation cannot be computed, only inferred qualitatively from being actively controlled rather than passive."
    in_degree_contributing_canals: "high -- มีนบุรี-หนองจอก + บางกะปิ-สะพานสูง reaches of คลองแสนแสบ converge here (AGENTS.md §8, east_chain.yaml)"
    tag: OPEN
    why_ranked_2: >
      Highest in-degree of any gate in this list (two large sub-catchments converge) and
      its open/closed STATE is itself only inferred, not measured (AGENTS.md §8) -- ranked
      above the other 3 gates because มีนบุรี sits furthest upstream in the east chain,
      so a bottleneck here backs up the most area behind it.

