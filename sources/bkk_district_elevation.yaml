_meta:
  generated: '2026-09-27'
  purpose: One row per Bangkok district (all 50 khet). Ground-level elevation vs. mean sea level (MSL),
    sampled from the RTSD 2010 georeferenced flood-risk map already in this repo (raw/rtsd_2010/), using
    the same affine georeferencing + legend-color-matching method as raw/rtsd_2010/sammakorn_sample.json
    (see that file's own method notes).
  founder_ask: 'https://policywatch.thaipbs.or.th/article/environment-190 -- see docs/knowledge/card_media_thaipbs_policywatch_env190.md:
    that article does NOT contain subsidence/below-MSL/district-elevation content (checked twice), so
    it contributes ZERO rows/values to this file. Every value here is RTSD-map-derived or OPEN.'
  method: 'For each district: took the district''s centroid lat/lon (source: Wikipedia ''List of districts
    of Bangkok'', used only as a point locator -- not as an elevation source), converted WGS84 -> UTM
    Zone 47N (EPSG:32647) -> pixel coordinates via the affine model already recorded in raw/rtsd_2010/georef.json,
    then read the 5x5-pixel neighbourhood (~165 x 165 m) around that pixel, classified each pixel to the
    nearest RTSD legend color, and took the majority class. If the 5x5 block showed >=4/25 pixels in a
    class >=2 elevation tiers (>=1 m) away from the majority -- a signature of hitting map label text
    / road lines / dike markers instead of the terrain color fill -- the district is marked OPEN instead
    of reporting a contaminated reading.'
  caveats:
  - 'This is a SINGLE POINT sample per district (the plotted centroid), not a district-wide or polygon-area
    statistic. A district can straddle several elevation classes; ''below_msl: true'' means the sampled
    centroid point read as RTSD class ''< 0 m'', not that the whole district is below MSL.'
  - RTSD survey is from October 2010; Bangkok/Samut Prakan land subsidence since then means current ground
    level may be lower than mapped (same caveat as sammakorn_sample.json).
  - subsidence_rate_mm_yr is null for every row -- no source in this check (article or map) states a per-district
    subsidence rate.
  - 'district_code is ''10'' (Bangkok''s 2-digit province code) + the district''s BMA map-number (Wikipedia
    ''Map #'' column) zero-padded to 2 digits -- this matches the standard Thai administrative geocode
    convention (province+district) but was NOT independently cross-checked against a DOPA/NSO registry
    in this check; treat as RELAYED-inferred, not VERIFIED.'

