    0 m'': 3, ''0 - 0.5 m'': 11, ''>= 3.5 m'': 6, ''0.5 - 1 m'': 5}) mixed the majority class ''0 - 0.5
    m'' with a distant class (>=2 elevation tiers away, e.g. ''>= 3.5 m'' brown) at >=4/25 pixels -- a
    known artifact where the map''s printed district-name text, road lines, or dike markers sit exactly
    at the plotted centroid and get misclassified by nearest-legend-color matching (same failure mode
    already documented in raw/rtsd_2010/sammakorn_sample.json''s ''limits'' section). Left OPEN rather
    than reporting a contaminated majority; a real reading would need the sample point moved off the label
    text or a district boundary polygon to sample many points and take a spatial (not just pixel-neighbourhood)
    majority -- not attempted here (20-minute sampling budget for this check).'
