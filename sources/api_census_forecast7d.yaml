  # ============================================================
  # MET Norway Locationforecast -- ECMWF-based, ~10 days, needs User-Agent
  # ============================================================

  - id: metno_locationforecast
    agency: "MET Norway (Norwegian Meteorological Institute)"
    name_th: "พยากรณ์อากาศจุด (MET Norway, ฐาน ECMWF, ~10 วัน)"
    name_en: "MET Norway Locationforecast/2.0 compact -- free, no key, ECMWF-based"
    url: "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat={lat}&lon={lon}"
    kind: json_api
    auth: "none -- but a real, identifying User-Agent header is REQUIRED by MET Norway's ToS (not a key, a courtesy/ToS rule; a generic/blank UA can get you blocked)"
    format: json
    cadence: "hourly steps"
    horizon_days: "9.75 days measured this run (90 timesteps, first 2026-09-27T11:00Z, last 2026-10-07T00:00Z)"
    resolution: "ECMWF-based, ~9-11km"
    thailand_coverage: "yes, any point -- global service"
    licence: "CC-BY-4.0 (MET Norway), free for any use with attribution, incl. commercial"
    has_coords: true
    coverage: global
    asset_classes: [rain]
    status: verified-200
    http_status: 200
    probed_at: "2026-09-27"
    sample_path: "raw/live/metno_locationforecast/2026-09-27T*_sammakorn.json"
    use: promoter_forecast_7d
    notes: >
      VERIFIED this run -- Sammakorn point, with an identifying User-Agent
      ("thailand_flood_kg-research/0.1 (contact: floodconnect-project)") per MET
      Norway's ToS. HTTP 200, 90 hourly timesteps = 9.75 days ahead, ECMWF-based,
      genuinely free (CC-BY, commercial-OK) and no API key at all -- only real
      requirement is the honest User-Agent, which this repo's `collect.py` already
      sets a generic UA for BMA hosts; this source would need its OWN distinct UA
      string per MET Norway's rule, not the shared generic one, if ever wired in.
      Good candidate #7 model in a multi-model layer-0 ensemble alongside Open-Meteo's
      roster (independent of Open-Meteo's own re-serving of similar underlying models).
      Daily aggregation caveat (MEASURED from the same sample, no new fetch): naive
      summing of every `next_6_hours` block per day double/triple-counts (each
      timestep repeats an overlapping 6h-ahead window, 4-24 blocks/day depending on
      how many timesteps happen to fall in a day) -- correct daily totals require
      keeping only the non-overlapping blocks (timestep hour % 6 == 0). Done that way,
      Sammakorn daily precip_mm (mm/day, this run, generated ~11:35 UTC 2026-09-27):
      09-27(partial, 2 of 4 blocks only) 17.9, 09-28 12.2, 09-29 2.8, 09-30 2.0,
      10-01 5.1, 10-02 5.6, 10-03 4.8, 10-04 3.5, 10-05 5.4, 10-06 4.1 -- notably LOWER
      than the Open-Meteo multi-model spread (median 82.3mm/7d) and closer to the low
      end of the GFS-ensemble spread (median 33.4mm/7d) -- a third independent
      signal, itself lower than both. 7-day total (09-27 partial through 10-03):
      ~51.9mm.
    tag: VERIFIED

