# API census -- free (or free-with-instant-key), >=7-day precipitation forecast sources
# for any Thai point, plus radar/nowcast, per founder request (verbatim, relayed via
# founder's instructions): "มี api free แบบ windy ไหมที่เราเชื่อมได้" -> "เอาเลย และเลือก API ที่ตรวจ
# พยากรณ์อากาศหรือปริมาณน้ำฝนในพื้นที่ได้ล่วงหน้า 7 วันขึ้นไปก็ดีนะ".
#
# Scope: this file is NARROWER and MORE CURRENT than the existing forecast-shaped rows in
# sources/api_census.yaml (openmeteo_flood_api, openmeteo_ensemble_api, openmeteo_marine_api,
# openmeteo_multimodel_thailand, nasa_power_api) -- those already exist and are not
# duplicated here. This file adds: the 16-day MULTI-MODEL daily forecast (actually queried
# with explicit `model=` this time, not `best_match`), the ensemble API's actual per-member
# 7-day totals (not just "it returns members" -- real numbers), the Previous Runs API
# (forecast skill-checking), MET Norway Locationforecast, RainViewer radar/nowcast, and a
# census-only survey of Windy/commercial APIs/TMD/HII weekly maps. CENSUS + one verification
# fetch each -- not a claim of quality, not a decision to wire into collect.py.
#
# Same schema/vocab as sources/api_census.yaml (VERIFIED/RELAYED/OPEN tags). New fields this
# file adds: horizon_days, resolution, thailand_coverage, licence, sample_path, use
# (layer0_in | promoter_forecast_72h | promoter_forecast_7d | radar_nowcast | skill_check).
#
# Method: curl, generic or agency-specific User-Agent, 20s timeout, ONE request per URL, no
# retries. Raw payloads archived under raw/live/<source_id>/<UTC timestamp>.<ext>. This check
# used 13 live HTTP requests total (2 forecast16d, 1 ensemble, 1 previous-runs, 1 seasonal,
# 1 MET Norway, 1 RainViewer, 1 TMD failed-TLS + 1 TMD retry-with -k, 1 wrong-agency probe
# (onep.go.th, an error -- HII/สสน is NOT ONEP, corrected below), 1 thaiwater rain-forecast
# page, 2 WebFetch doc-page reads for Previous-Runs variable naming and Windy) -- well under
# the 20-request budget. No API keys obtained or stored anywhere in this check.

census_date: "2026-09-27"
probe_budget_used_approx: 13
notes_on_budget: >
  11 curl/HTTP fetches (one of which, the first TMD attempt, failed on local TLS trust and
  is counted since it was a real network attempt) + 2 WebFetch doc-page reads (Open-Meteo
  Previous-Runs docs to get the correct `_previous_dayN` variable suffix after the first
  attempt returned normal, not skill-check, data; Windy.com API page, which returned only a
  JS-shell with no usable content -- Windy is therefore still OPEN/RELAYED on pricing, see
  below). One probe (onep.go.th) was this check's own mistake -- ONEP (Office of Natural
  Resources and Environmental Policy policy office) is not the agency behind the "สสน. ONE-
  WEEK rain forecast maps" the founder's brief names; that agency is HII (สสน., Hydro-
  informatics Institute) via thaiwater.net, corrected to the right host in the very next
  probe. Left in this census as a documented dead-end, not silently erased.

sources:

  # ============================================================
  # Open-Meteo -- multi-model 16-day daily precipitation (explicit model= this time)
  # ============================================================

  - id: openmeteo_forecast16d_multimodel
    agency: "Open-Meteo (aggregates >10 national NWP centres)"
    name_th: "พยากรณ์ปริมาณฝนรายวัน 16 วัน หลายโมเดลพร้อมกัน (ระบุ model= จริง)"
    name_en: "Open-Meteo /v1/forecast, forecast_days=16, explicit multi-model precipitation_sum"
    url: "https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&daily=precipitation_sum&forecast_days=16&models=ecmwf_ifs025,gfs_seamless,icon_seamless,jma_seamless,gem_seamless,ukmo_seamless,meteofrance_seamless,bom_access_global,cma_grapes_global,knmi_seamless"
    kind: json_api
    auth: none
    format: json
    cadence: "model-dependent, 1h-6h update cycle"
    horizon_days: 16
    resolution: "9-11km global per model (varies by model, no Thailand-specific regional high-res model in this set)"
    thailand_coverage: "yes, any point"
    licence: "Open-Meteo non-commercial free use (CC-BY-4.0-style attribution requested); commercial use needs a paid plan -- this repo is non-commercial"
    has_coords: true
    coverage: "global, includes Thailand"
    asset_classes: [rain]
    status: verified-200
    http_status: 200
    probed_at: "2026-09-27"
    sample_path: "raw/live/openmeteo_forecast16d_multimodel/2026-09-27T*_sammakorn.json (+ _nakhonsawan.json)"
    use: promoter_forecast_7d
    notes: >
      VERIFIED this run -- Sammakorn (13.758,100.676) AND upstream Nakhon Sawan
      (15.7,100.1). Each model actually returns a DIFFERENT number of populated days
      within the requested 16 (the array is always length 16 but later entries are
      `null` once that model's own real horizon ends) -- MEASURED per-model day counts,
      Sammakorn sample: gfs_seamless 16/16 non-null, ecmwf_ifs025 15/16, knmi_seamless
      15/16, jma_seamless 11/16, gem_seamless 9/16, icon_seamless 7/16, ukmo_seamless
      7/16, cma_grapes_global 5/16, meteofrance_seamless 4/16, bom_access_global 0/16
      (all-null this run -- either not covering this region or a live outage; not
      re-probed, per no-retry rule). So "16-day forecast" is real for gfs_seamless and
      near-real for ecmwf/knmi; most others degrade to 5-11 real days despite the array
      shape. 7-day precipitation_sum totals (mm) at Sammakorn, this run: ecmwf 87.8,
      gfs 53.1, icon 91.0, jma 82.3, gem 78.9, ukmo 99.7, meteofrance 45.9, cma 59.6,
      knmi 87.4 (bom excluded, all-null) -- 9 valid models, MEDIAN 82.3mm, MAX 99.7mm
      (ukmo), MIN 45.9mm (meteofrance). This is a real cross-model spread, not
      accuracy -- no skill-verification source found this check (see skill_check use
      tag on previous-runs entry below, still OPEN).
    tag: VERIFIED

  # ============================================================
  # Open-Meteo Ensemble -- real per-member 7-day totals (GFS-ENS, 31 members)
  # ============================================================

  - id: openmeteo_ensemble_daily_precip
    agency: "Open-Meteo (serves NOAA GEFS ensemble, 31 members, via ensemble-api host)"
    name_th: "ฝนสะสม 7 วัน แบบความน่าจะเป็น (GEFS 31 สมาชิก, ผลรวมรายวัน)"
    name_en: "Open-Meteo Ensemble API, daily precipitation_sum, models=gfs_seamless"
    url: "https://ensemble-api.open-meteo.com/v1/ensemble?latitude={lat}&longitude={lon}&daily=precipitation_sum&forecast_days=16&models=gfs_seamless"
    kind: json_api
    auth: none
    format: json
    cadence: "6-hourly update, up to 35-day horizon depending on model"
    horizon_days: 16
    resolution: "~25km (GEFS), 31-member ensemble"
    thailand_coverage: "yes, any point"
    licence: "same as Open-Meteo forecast API -- non-commercial free"
    has_coords: true
    coverage: "global, includes Thailand"
    asset_classes: [rain]
    status: verified-200
    http_status: 200
    probed_at: "2026-09-27"
    sample_path: "raw/live/openmeteo_ensemble_daily/2026-09-27T*_sammakorn_gfs.json"
    use: promoter_forecast_7d
    notes: >
      VERIFIED this run -- 31 GFS-ENS members returned real per-member daily
      `precipitation_sum` columns. 7-day cumulative totals across the 31 members at
      Sammakorn (mm, sorted): 15.4, 15.6, 18.2, 19.5, 20.7, 21.8, 24.4, 25.2, 26.3,
      26.5, 27.2, 31.3, 32.0, 32.5, 33.0, 33.4, 33.6, 34.4, 40.8, 43.4, 44.6, 48.0,
      48.9, 49.3, 54.6, 57.2, 60.5, 60.8, 66.7, 74.3, 75.2 -- MEDIAN 33.4mm, MAX 75.2mm.
      This is a genuinely different signal from the deterministic multi-model spread
      above (median 82.3mm there vs. 33.4mm here, same week, same point) -- MEASURED
      disagreement between a multi-model deterministic ensemble and a single-model
      (GFS) member ensemble, not resolved this check, tag OPEN on which one to trust
      more; the honest layer-0 framing is "spread across two independent kinds of
      uncertainty (which model? which member?)", not a single number.
    tag: VERIFIED

  # ============================================================
  # Open-Meteo Previous Runs -- forecast skill-checking (attempted, wrong variable name
  # this run -- corrected in notes, NOT re-fetched, OPEN)
  # ============================================================

  - id: openmeteo_previous_runs
    agency: "Open-Meteo"
    name_th: "ประวัติการพยากรณ์ย้อนหลัง (ตรวจความแม่นของโมเดลเอง)"
    name_en: "Open-Meteo Previous Runs API -- forecast as it looked N days ago"
    url: "https://previous-runs-api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&hourly=precipitation,precipitation_previous_day1,precipitation_previous_day3&past_days=5&forecast_days=1&models=gfs_seamless"
    kind: json_api
    auth: none
    format: json
    cadence: n/a
    horizon_days: "n/a (backward-looking; models archived since Jan 2024, GFS temperature since Mar 2021, per Open-Meteo docs)"
    resolution: "hourly, same underlying-model grid as gfs_seamless"
    thailand_coverage: "yes, any point"
    licence: "same as Open-Meteo forecast API"
    has_coords: true
    coverage: "global, includes Thailand"
    asset_classes: [rain]
    status: verified-200
    http_status: 200
    probed_at: "2026-09-27"
    sample_path: "raw/live/openmeteo_previous_runs/2026-09-27T*_skillcheck_hourly.json"
    use: skill_check
    notes: >
      MEASURED, corrected this run after two false starts (both kept below, not
      erased): (1) first probe used plain `daily=precipitation_sum` -- HTTP 200 but
      returned the SAME plain forecast series, not a previous-run comparison; (2)
      second probe tried the `_previous_dayN` suffix on `daily=` variables -- HTTP 400,
      "Cannot initialize ForecastVariableDaily from invalid String value" (the suffix
      only exists on HOURLY variables, not daily, on this host); (3) third probe used
      `hourly=precipitation,precipitation_previous_day1,precipitation_previous_day3`
      with `past_days=5&forecast_days=1&models=gfs_seamless` -- HTTP 200, real data.
      Aggregated to daily sums here (summing the 24 hourly values per UTC day; every
      day had all 24 hours present, no gaps) -- first real MEASURED skill readout in
      this repo comparing GFS's own forecast against its own later best-estimate
      (NOT an independent gauge/observation -- see caveat below) for the SAME days,
      Sammakorn point, mm/day:
        2026-09-22: current-best-estimate 19.4 | forecast made 1 day before 4.2  | made 3 days before 8.8
        2026-09-23: current-best-estimate 31.1 | forecast made 1 day before 24.0 | made 3 days before 14.8
        2026-09-24: current-best-estimate 53.3 | forecast made 1 day before 20.7 | made 3 days before 30.1
        2026-09-25: current-best-estimate 39.4 | forecast made 1 day before 51.1 | made 3 days before 30.7
        2026-09-26: current-best-estimate 117.4 | forecast made 1 day before 27.2 | made 3 days before 11.4
        2026-09-27: current-best-estimate 31.3 | forecast made 1 day before 7.6  | made 3 days before 58.1
      Biggest miss: 2026-09-26 -- GFS's own 1-day-ahead forecast said 27.2mm, its
      3-day-ahead forecast said only 11.4mm, but GFS's OWN later best estimate for
      that same day is 117.4mm -- a 4-10x MEASURED underforecast of the single
      biggest-rain day in this window, by this one model, against ITSELF (not
      against a rain gauge). CAVEAT, load-bearing: the "current-best-estimate"
      column on this host is GFS's own reanalysis-blended value for a past day, NOT
      an independent ground observation (e.g. a BMA/HII rain gauge) -- this is a
      model-vs-itself skill check, tag MEASURED-vs-forecast, not MEASURED-vs-observed.
      The founder separately relayed a same-event rainfall figure around 203mm
      (RELAYED, source/exact site not specified in this check's brief, NOT
      independently verified here, and not necessarily the same station/window as
      this 13.758,100.676 grid-cell point) -- if that number is a real gauge reading
      for Sammakorn/Sept 26, it would make GFS's underforecast even larger than the
      117.4-vs-27.2 gap measured here; this discrepancy itself is flagged OPEN, not
      resolved, until a true gauge-based cross-check (thaiwater_rain_24h, already
      connected in this repo) is run against this same date/point.
    tag: MEASURED-vs-forecast

