    hec_ras: "Reach"
    hec_hms: "Reach"
    mike: "branch between H-points"
    notes: "canonical alias = HEC-RAS/HEC-HMS Reach; SWMM has no equivalent object."

  - our_class: "dam / reservoir (เขื่อน)"
