    hec_ras: "storage-elevation curve headroom (implied, not a named output) -- RELAYED"
    hec_hms: "reservoir 'available storage' (implied from storage-elevation) -- RELAYED"
    mike: "no fixed term found -- OPEN"
    swmm: "Storage Unit 'available volume' (max - current, implied) -- RELAYED"
    infoworks: "no fixed term found -- OPEN"
    wrf: "no equivalent"
    swat: "no fixed term found -- OPEN"
    rri: "no equivalent found"
    fews: "no fixed term found -- OPEN"
    glofas_openmeteo: "no equivalent"
    notes: "Our founder's 'wallet/debt' analogy has no standard-model equivalent anywhere
