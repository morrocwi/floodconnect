export_notes:
  swmm_inp:
    what_it_needs: ["conduit geometry (shape, diameter/width x height, length, roughness n)",
      "invert elevations at each end of every conduit, in the SAME datum (MSL / ม.รทก.)",
      "junction rim/ground elevation (for surcharge/flooding to compute)",
      "storage unit depth-area-volume curve (or a functional/tabular shape)",
      "subcatchment area, %imperv, width, slope, and an infiltration method + parameters",
      "pump curve (Type 1-4) with on/off depths",
      "a rain gage time series (we have this: DDS/BMA telemetry)"]
    what_we_lack: "invert elevations in MSL for nearly every conduit/canal in this repo
      (bma_plan2569_canal_dimensions.yaml has width/depth-dredged only, no discharge or
      invert -- OPEN, already flagged in terminology_crosswalk.yaml's conveyance_capacity
      row); no stage-storage curve for Sammakorn's own retention pond (OPEN, already flagged
      in storage_deficit_available_storage); no %imperv/runoff-coefficient for any unit
      (OPEN, runoff_coefficient row)."
    tag: OPEN

  hec_dss:
    what_it_needs: ["pathname convention (A/B/C/D/E/F parts: basin/location/parameter/date/
      time-interval/version)", "a declared vertical datum per gauge (MSL vs local gauge
      datum -- units_datum_crosswalk.yaml already tracks this per station)",
      "cross-section geometry (station-elevation pairs) for any HEC-RAS reach we'd export",
      "Manning's n per reach/panel"]
    what_we_lack: "cross-section geometry for essentially every canal (we hold plan-view
      dimensions, not surveyed station-elevation profiles -- OPEN); Manning's n anywhere in
      this repo (OPEN, not previously flagged, new gap found by this check)."
    tag: OPEN

  cf_netcdf:
    what_it_needs: ["a standard_name + canonical unit per exported variable (this file
      supplies the mapping)", "a CF-compliant grid or point/timeSeries featureType
      (discrete sampling geometries) with proper coordinate variables (time, lat, lon,
      or a station id + WKT/CRS attribute)", "an explicit datum/CRS attribute (EPSG:4326 or
      EPSG:32647) since CF's own vertical-datum support is thin for local/national datums
      like ม.รทก."]
    what_we_lack: "most of our variables have no registered CF standard_name (this file
      marks them PROPOSAL floodconnect:* pending Toledo/CF submission); no formal CRS/datum
      attribute is currently attached to any exported file in this repo (OPEN, new gap)."
    tag: OPEN

  waterml2:
    what_it_needs: ["an ObservedProperty URI per variable (we would mint our own
      floodconnect: URIs where CF/WaterML has no fixed term)", "a MonitoringPoint per
      station with a declared position (EPSG:4326) and vertical datum", "a
      MeasurementTimeseriesObservationCollection per station/parameter with ISO 8601 UTC
      timestamps and an explicit interpolation-type / aggregation-duration metadata field"]
    what_we_lack: "no ObservedProperty URI registry of our own yet (this file is the
      first step toward one, via the canonical_name column); no declared interpolation-type
      metadata (instantaneous vs mean-over-interval) for any of our own collected series --
      OPEN, new gap found by this check."
    tag: OPEN
