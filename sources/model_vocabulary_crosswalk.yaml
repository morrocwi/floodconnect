    rri: "discharge at a river cell -- RELAYED"
    fews: "parameterId 'Q.observed' / 'Q.simulated' (site convention) -- RELAYED"
    glofas_openmeteo: "river_discharge (Open-Meteo Flood API field name, GloFAS-derived) --
