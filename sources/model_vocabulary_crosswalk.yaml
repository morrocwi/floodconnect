    hec_hms: "terminal junction/reach (no dedicated 'outfall' element)"
    mike: "open boundary"
    notes: "canonical alias = SWMM Outfall."

  - our_class: "river reach (แม่น้ำ)"
    swmm: "not modeled (SWMM is a pipe/urban-conduit tool, not a river hydraulics tool) --
