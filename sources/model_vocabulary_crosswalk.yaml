node_edge_classes:
  # our KG class -> each model's element type for the SAME network object.
  - our_class: "sub-polder / drainage unit"
    swmm: "Subcatchment"
    hec_ras: "Storage Area (2D) / cross-section group forming a reach"
    hec_hms: "Subbasin"
    mike: "catchment / model area"
    notes: "canonical alias = SWMM Subcatchment for urban units, HEC-HMS Subbasin for
      basin-scale units."

  - our_class: "pond / retention basin (แก้มลิง)"
    swmm: "Storage Unit"
    hec_ras: "Storage Area"
    hec_hms: "Reservoir"
    mike: "reservoir / storage node"
    notes: "canonical alias = SWMM Storage Unit. our pond = SWMM Storage Unit = HEC-RAS
      Storage Area = MIKE reservoir/storage node (founder's own example, confirmed)."

  - our_class: "canal reach"
    swmm: "Conduit (open-channel type)"
    hec_ras: "Reach (a sequence of cross-sections) -- RELAYED, not verbatim-confirmed this
      task (fetch_log #4)"
    hec_hms: "Reach (routing element)"
    mike: "branch between two H-points"
    notes: "canonical alias = HEC-RAS/HEC-HMS Reach for river-scale canals, SWMM Conduit for
      urban drains."

  - our_class: "junction (node where reaches/conduits meet)"
    swmm: "Junction"
    hec_ras: "Junction"
    hec_hms: "Junction"
    mike: "H-point node"
    notes: "canonical alias = SWMM/HEC-RAS/HEC-HMS 'Junction' -- all three use this exact
      word (VERIFIED for SWMM/HEC-RAS from the fetched pages, RELAYED for HEC-HMS since its
      docs page 404'd, fetch_log #5)."

  - our_class: "gate (ประตูระบายน้ำ / ปตร.)"
    swmm: "Orifice (gated) or a controlled Weir"
    hec_ras: "Inline/Lateral Structure with a gate opening"
