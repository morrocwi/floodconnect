    hec_hms: "no dedicated element"
    mike: "structure 'pump'"
    notes: "canonical alias = SWMM Pump."

  - our_class: "tunnel (อุโมงค์ระบายน้ำ)"
    swmm: "Conduit (closed, circular/force-main cross-section)"
    hec_ras: "Culvert (large box/circular) or a 1D reach with a closed cross-section"
    hec_hms: "Reach"
    mike: "MIKE FLOOD-class culvert/tunnel structure"
    notes: "canonical alias = SWMM Conduit (closed) for the hydraulic object; HEC-RAS Culvert
      terminology if analysed as an open-channel structure instead."

  - our_class: "outfall (river/sea discharge point)"
