    mike: "Q-point discharge -- RELAYED"
    swmm: "Link Flow / Pump curve flow -- RELAYED"
    infoworks: "link flow -- RELAYED"
    wrf: "no equivalent"
    swat: "no equivalent (SWAT reports channel flow, not pump/gate outflow specifically) --
