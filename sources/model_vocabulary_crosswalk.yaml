# sources/model_vocabulary_crosswalk.yaml -- ONE vocabulary crosswalk: our 27 concepts
# (sources/terminology_crosswalk.yaml) x international exchange standards x the
# hydrological/hydraulic/NWP models Thai agencies actually use (or, where not verified in
# our own docs, the models the field generally uses -- tagged accordingly).
#
# Founder instruction (verbatim, 2026-09-27): "ทำให้ภาษาเป็นภาษาเดียวกัน เชื่อมกับทั่วโลกด้วย
# โดยเฉพาะกับโมเดลที่ประเทศไทยนิยมใช้"
#
# Founder follow-up (verbatim): "เลือกให้เลยระดับโลก" -- pick the canonical vocabulary.
# ORCHESTRATOR DECISION (recorded here, reversible by the founder):
#   canonical.variables        = CF Conventions standard_name + SI canonical units
#   canonical.exchange         = OGC WaterML 2.0 (time series) / OGC SensorThings
#                                 (live sensor observations); ISO 8601 UTC time;
#                                 EPSG:4326 (lon/lat) / EPSG:32647 (UTM 47N) positions;
#                                 vertical datum stated explicitly every time
#                                 (ม.รทก. = MSL, Ko Lak / Ko Sichang benchmark).
#   canonical.network_urban    = EPA SWMM element vocabulary (Subcatchment, Junction,
#                                 Storage Unit, Conduit, Pump, Orifice, Weir, Outfall) --
#                                 chosen because it is open/free, a node-link network model
#                                 like our own KG, and already the model USED in Thai
#                                 academic/municipal drainage studies this repo holds
#                                 (EEC 5-city report, Chanthaburi thesis -- both SWMM 5,
#                                 VERIFIED below).
#   canonical.network_river    = HEC-RAS (steady/unsteady open-channel) / HEC-HMS (basin
#                                 rainfall-runoff) vocabulary for river reaches and basins --
#                                 chosen because it is free (USACE) and is the class of tool
#                                 our own docs point future volunteers toward for this basin
#                                 (PROBLEM_STATEMENT_AND_POSITIONING.md, LITREVIEW doc) --
#                                 no VERIFIED citation in our docs of RID actually running
#                                 HEC-RAS/HMS on this basin, so that specific claim is RELAYED,
#                                 not VERIFIED; the vocabulary choice itself does not depend on it.
#   canonical.secondary         = DHI MIKE 11/MIKE+/MIKE FLOOD, InfoWorks ICM, Delft-FEWS kept
#                                 as SECONDARY alias mappings only -- commercial and/or
#                                 platform-specific, no VERIFIED evidence in our docs that a
#                                 named Thai agency runs them on THIS basin (see per-row notes;
#                                 general industry knowledge that DHI MIKE and InfoWorks are
#                                 widely used by Thai consultants/RID on other projects is
#                                 RELAYED (from recollection), not checked this check).
#   practice: our field names and future exports FOLLOW the canonical column
#             (cf_standard_name for variables; swmm/hec_* for node/edge classes). Every other
#             model's term in this file is an ALIAS onto the canonical, not a peer choice.
#             Where CF has no standard_name for a concept, we propose our own namespaced name
#             (`floodconnect:<concept_id>`), marked "ข้อเสนอ -- ยังไม่ลง Toledo" / "PROPOSAL --
#             not yet in Toledo" -- never presented as an existing CF term.
#
# Scope: new file only (2026-09-27). No tracked file edited, no commit, no
# build, no collect run. Companion Thai doc:
# docs/knowledge/MODEL_VOCABULARY_CROSSWALK_2026-09-27.md
#
# Toledo: no new equation is introduced by this file. toledo_symbol values below are COPIED
# from sources/terminology_crosswalk.yaml (already-cited PROP-FLOOD-xx codes) -- this file
# adds no new proposal.
#
# Tags (per row, AGENTS.md ss2):
#   VERIFIED = this check opened the official documentation page itself this run (web fetch,
#              logged in fetch_log below), or the fact is already VERIFIED in
#              terminology_crosswalk.yaml / units_datum_crosswalk.yaml / a docs/knowledge card
#              this repo holds (SWMM-5 usage in EEC/Chanthaburi studies).
#   RELAYED  = general field/vendor knowledge from the worker's own recollection, OR a web
#              fetch that failed/returned a truncated page (tagged RELAYED per task
#              instruction "if a fetch fails, tag the row RELAYED") -- not independently
#              re-checked this check.
#   OPEN     = no equivalent found and none confidently attributable; "no equivalent" is a
#              valid, honest answer, never forced.
#
# fetch_log (<=8 fetches, one per URL, no retries; official documentation pages only):
#   1. cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
#      -> OK but table too large to enumerate every match in one pass; the well-known
#         standard_name strings below (precipitation_amount, lwe_precipitation_rate,
#         water_surface_height_above_reference_datum, water_volume_transport_in_river_channel,
#         soil_moisture_content, sea_surface_height_above_mean_sea_level) are RELAYED (from
#         recollection, matches the founder's own examples), NOT individually re-confirmed
#         against the fetched table text -- tagged RELAYED, not VERIFIED, for that reason.
#   2. ogc.org/standard/waterml/ -> OK, confirms WaterML 2.0 parts (1 timeseries, 2 ratings/
#      gaugings, 3 HY_Features, 4 GWML2); did not expose observedProperty vocabulary terms.
#   3. epa.gov/water-research/storm-water-management-model-swmm -> OK, confirms SWMM models
#      street inlets, storage/treatment units, flow dividers, pumps, weirs, orifices,
#      backwater/surcharging/reverse-flow/ponding; page itself doesn't enumerate every
#      element name (User's Manual would) -- element names below (Subcatchment, Junction,
#      Storage Unit, Conduit, Outfall, Node Flooding) are RELAYED (from recollection of the
#      SWMM 5 manual), not line-by-line re-verified against this page.
#   4. hec.usace.army.mil/confluence/rasdocs/ras1dtechref/latest -> OK, confirms Junction,
#      Storage Area, Lateral Structure, Cross Section, Flow as real HEC-RAS terms; "Reach"
#      and "Stage" not found verbatim in the fetched excerpt (RELAYED for those two).
#   5. hec.usace.army.mil/confluence/hmsdocs/hmsum/latest/hms-components/basin-models ->
#      404 Not Found -> all HEC-HMS element names below (Subbasin, Reach, Junction,
#      Reservoir, Source, Sink, Diversion) are RELAYED per instruction (fetch failed).
#   6. ogc.org/standard/sensorthings/ -> OK, confirms Things/Locations/Datastreams/
#      ObservedProperty/Observations/Sensors as the SensorThings entity set.
#   (2 of the 8-fetch budget left unused; MIKE/InfoWorks/Delft-FEWS vendor doc pages were not
#   fetched -- founder's own message ranks them secondary, and no VERIFIED claim below rests
#   on having fetched them; all MIKE/InfoWorks/FEWS cells are RELAYED (from recollection) or
#   OPEN and are marked as such.)

_meta:
  generated: "2026-09-27"
  scope: "model/standard vocabulary crosswalk for the 27 concepts of terminology_crosswalk.yaml"
  companion_files:
    - "sources/terminology_crosswalk.yaml (our_term_th / toledo_symbol / si_unit source)"
    - "sources/units_datum_crosswalk.yaml (si_unit / datum source)"
    - "docs/knowledge/MODEL_VOCABULARY_CROSSWALK_2026-09-27.md (Thai doc)"
  models_verified_used_by_a_named_thai_agency_in_our_own_docs:
    - model: "EPA SWMM 5"
      agency: "เทศบาลเมืองฉะเชิงเทรา/บ้านสวน/ศรีราชา-แหลมฉบัง/พัทยา/พลา (EEC 5-city urban drainage
        study, ทุน ม.บูรพา/วช.) -- docs/knowledge/card_research_2026-09-27_eec_integrated_drainage.md"
      tag: VERIFIED
    - model: "EPA SWMM 5"
      agency: "จังหวัดจันทบุรี urban drainage climate-adaptation study (TSTJ 2021 journal
        article) -- docs/knowledge/card_research_chanthaburi_urban_drainage_swmm.md"
      tag: VERIFIED
    - model: "Open-Meteo multi-model blend (serves ECMWF IFS/AIFS, NOAA GFS/GEFS, DWD ICON,
        JMA, Environment Canada GEM, Meteo-France, UK Met Office, BOM, CMA, KNMI, DMI,
        MET Norway, Google GraphCast/WeatherNext) + GloFAS-via-Open-Meteo river discharge"
      agency: "used BY this repo itself (collect.py, sources/registry.yaml) as third_party
        trust-tier forecast input -- NOT a Thai government agency's own model"
      tag: VERIFIED
    - model: "HEC-RAS / HEC-HMS (SWMM/HEC-RAS-class full hydraulic model)"
      agency: "named only as a CLASS OF TOOL our own docs suggest volunteers look for in a
        future round (PROBLEM_STATEMENT_AND_POSITIONING.md L71, LITREVIEW doc row 31) --
        no VERIFIED citation that RID or BMA actually runs HEC-RAS/HMS on this basin"
      tag: RELAYED
  models_named_in_task_but_not_found_used_by_any_Thai_agency_in_our_docs:
    note: "grep across docs/ + sources/ found ZERO occurrences of MIKE 11 / MIKE+ / MIKE
      FLOOD / MIKE 21, InfoWorks ICM, WRF (as a hydrology model -- the only WRF hit is
      unrelated, RID's 'WRFL' weighted-rainfall abbreviation in vol06_effective_rainfall.md),
      ROMS, SWAT, RRI, or Delft-FEWS anywhere in this repo, in any Thai-agency context. All
      six are therefore OPEN for 'is this used in Thailand' and their vocabulary mappings
      below are RELAYED (from recollection) at best, marked per-row."
    models: ["MIKE 11", "MIKE+", "MIKE FLOOD", "MIKE 21", "InfoWorks ICM", "WRF (hydrology)",
      "ROMS", "SWAT", "RRI", "Delft-FEWS"]

canonical:
  variables: "CF Conventions standard_name + SI canonical units"
  exchange: "OGC WaterML 2.0 (time series exchange) / OGC SensorThings (live sensor
    observations); ISO 8601 UTC; EPSG:4326 / EPSG:32647 (UTM 47N); vertical datum always
    stated explicitly (ม.รทก. = MSL, Ko Lak benchmark, per units_datum_crosswalk.yaml)"
  network_urban: "EPA SWMM element vocabulary (open, node-link, VERIFIED already used in
    Thai academic/municipal studies this repo holds)"
  network_river: "HEC-RAS (open-channel) / HEC-HMS (basin) vocabulary (free, USACE; the class
    of tool our own docs point volunteers toward for this basin -- RELAYED that RID itself
    runs it here)"
  secondary_only: ["MIKE 11", "MIKE+", "MIKE FLOOD", "MIKE 21", "InfoWorks ICM", "Delft-FEWS"]
  alerts: "OASIS Common Alerting Protocol (CAP) severity/urgency/certainty as the canonical
    ALERT-layer vocabulary -- per the parallel threshold worker's adoption in
    sources/rain_alert_thresholds_crosswalk.yaml (`unified_ladder` block, mapping GloFAS
    return-period flags / Google Flood Hub severity / ECMWF EFI onto our L0-L5 rungs). This
    file does NOT duplicate that numeric ladder -- see that file for the L0-L5 <-> CAP <->
    model-flag numeric mapping; this file only adds the vocabulary rows below and points to
    it. RELAYED (from the coordinator's message, not independently re-verified against an
    OASIS CAP spec fetch this check -- 0 of the 8-fetch budget spent on CAP; CAP is a widely
    known standard so the value names below are RELAYED (from recollection), not VERIFIED)."
  rule: "our field names and any future export follow the canonical column for that layer;
    every other model's term is an ALIAS, not a peer choice. Where CF has no standard_name,
    the concept gets a namespaced floodconnect: proposal, tagged 'ข้อเสนอ -- ยังไม่ลง Toledo'."

concepts:

  - concept_id: drainage_unit_node
    our_term_th: "พื้นที่ปิดล้อมย่อยบริหารจัดการน้ำท่วม (Sub Polder)"
    our_symbol: "U (PROP-FLOOD-06); b/node (PROP-FLOOD-03); Z (PROP-FLOOD-05b)"
    si_unit: "identifier; area in m2"
    canonical_name: "no CF standard_name (not a physical quantity) -- PROPOSAL:
      floodconnect:drainage_unit -- ข้อเสนอ, ยังไม่ลง Toledo"
    cf_standard_name: "OPEN (not a measurable variable; CF has no 'catchment' entity type)"
    waterml_or_wmo_term: "OGC HY_Features 'CatchmentDivide' / 'Catchment' (WaterML 2.0 pt.3) --
      RELAYED (from recollection, not opened this check)"
    hec_ras: "Storage Area (2D flow area) -- RELAYED"
    hec_hms: "Subbasin -- RELAYED"
    mike: "MIKE 11/MIKE+ catchment / model area -- RELAYED"
    swmm: "Subcatchment -- RELAYED (SWMM-5 manual, matches the two VERIFIED Thai studies)"
    infoworks: "Subcatchment -- RELAYED"
    wrf: "no equivalent (WRF is atmospheric, not a network element)"
    swat: "Subbasin / HRU (Hydrologic Response Unit) -- RELAYED"
    rri: "grid cell (RRI is a raster rainfall-runoff-inundation model, not node-based) -- RELAYED"
    fews: "locationId (Delft-FEWS location) -- RELAYED"
    glofas_openmeteo: "grid cell (Open-Meteo/GloFAS forecast grid, not the same shape as our
      node) -- see grid_cell_mean_vs_point concept for the mismatch"
    notes: "canonical = SWMM 'Subcatchment' for the urban units, HEC-HMS 'Subbasin' for basin-
      scale units -- both alias to our declared tuple <A_U,O_U,P_U,c_U>."
    tag: VERIFIED

  - concept_id: storage_account
    our_term_th: "ปริมาตรเก็บกัก (ลบ.ม.)"
    our_symbol: "S_b(k) (PROP-FLOOD-03); S_k (PROP-FLOOD-08-DRAFT)"
    si_unit: "m3"
    canonical_name: "no exact CF match for 'stored volume in a node' -- PROPOSAL:
      floodconnect:storage_volume -- ข้อเสนอ, ยังไม่ลง Toledo (nearest CF term,
      lwe_thickness_of_water_in_soil, is soil-column not node-storage -- OPEN)"
    cf_standard_name: "OPEN -- no CF standard_name for network-node storage volume"
    waterml_or_wmo_term: "WaterML 2.0 observedProperty 'storageVolume' (custom vocabulary
      entry, not a fixed enum in the spec) -- RELAYED"
    hec_ras: "Storage Area volume (stage-storage curve) -- RELAYED"
    hec_hms: "Reservoir element storage -- RELAYED"
    mike: "MIKE 11/MIKE+ reservoir/storage node volume -- RELAYED"
    swmm: "Storage Unit (Node) volume, via depth-area-volume curve -- RELAYED"
    infoworks: "Storage node volume -- RELAYED"
    wrf: "no equivalent"
    swat: "pond/reservoir storage -- RELAYED"
    rri: "cell water depth x cell area (no named 'storage' object) -- RELAYED"
    fews: "parameterId e.g. 'H.storage' (site convention, not fixed by spec) -- RELAYED"
    glofas_openmeteo: "no equivalent (GloFAS reports discharge, not node storage)"
    notes: "canonical = SWMM 'Storage Unit'. Export needs a depth-area-volume curve we do not
      hold for Sammakorn (see export_notes.swmm_inp below)."
    tag: VERIFIED

  - concept_id: drainage_capacity_outflow_rate
