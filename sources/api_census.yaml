# PHASE 1 -- Thai flood/water API census.
#
# Purpose: enumerate every publicly reachable Thai water/flood data source this check's
# probe budget could cover -- API, open-data dataset, telemetry page, CSV/JSON endpoint --
# across HII/thaiwater.net, RID, EGAT, ONWR, BMA DDS, DDPM, TMD, GISTDA, DWR, PWA/MWA,
# provincial/basin telemetry, and data.go.th CKAN. This is a CENSUS, not a claim of
# quality or a decision to ingest -- `status`/`tag` say what this check actually observed,
# nothing more. Sources already wired into `sources/registry.yaml` are listed here too
# (status: connected) so this file is one complete map, but are not re-probed -- their
# registry entry is the live record.
#
# Method: curl, browser User-Agent, 15s timeout, ONE request per URL, no retries, no
# auth attempts, sleep >=1s between requests to the same host, samples only (no large
# downloads) except one CSV fetched in full before this rule was re-confirmed mid-task
# (mwa_chaophraya_level_csv -- noted below, not repeated).
#
# tag vocabulary (per-source, this check's own observation):
#   VERIFIED -- this check (or the agency card it draws from, itself produced this same
#               2026-09-27 sweep) actually fetched the URL and saw the payload/page.
#   RELAYED  -- only seen listed on a portal/menu/CKAN record/agency card; not fetched
#               by this check.
#   OPEN     -- existence/shape unknown or unresolved after the probe attempted.
#
# status vocabulary (checked by tests/test_api_census.py -- an unrecognized value fails
# that test rather than silently undercounting a status == "reachable"/"unreachable"
# roll-up elsewhere):
#   connected   -- already in registry.yaml, feeding collect.py. Carries a `wired_as`
#                  field when this census row's own id differs from the registry.yaml
#                  id it maps to.
#   catalog_only -- HTTP 2xx/plausible content was observed, but a prior pass decided NOT
#                  to wire it (a portal/HTML/PDF/JS/image page with no machine-readable
#                  endpoint, a duplicate of an already-connected source, an ownership/
#                  access caution, or an out-of-scope international layer). Carries a
#                  `catalog_reason` field stating why. Added 2026-10-03 (C3-GOV9 pass)
#                  to retire the generic `reachable` value once every such row had been
#                  triaged one way or the other -- see that pass's commit for the full
#                  59-row sweep. A row may still be promoted from catalog_only to
#                  connected later if a future pass finds a reason to wire it. A row
#                  converted from one of the finer `reachable_*` subtypes below also
#                  carries `catalog_subtype` (the retired status value) so the original
#                  observation shape is not lost -- a second C3-GOV9 pass (2026-10-03)
#                  folded the 31 rows still sitting in those finer subtypes into
#                  catalog_only, since the subtype header definition itself already said
#                  "not ingested yet" i.e. pending, not decided.
#
#   The `reachable_*` values below describe what `catalog_subtype` records once a row
#   has been folded into `catalog_only` -- none of them should appear as a row's own
#   top-level `status` any more (guarded by test_api_census.py); they remain documented
#   here because `catalog_subtype` reuses the same vocabulary.
#   reachable_http_only       -- plain HTTP (not HTTPS) returns 200; the HTTPS endpoint
#                                 fails its TLS handshake. Not itself a reason to wire --
#                                 content still has to be checked separately.
#   reachable_image_only      -- HTTP 200 but the page is a chart-image/iframe wrapper
#                                 (JPG/PNG), no HTML table or numeric cell.
#   reachable_js_only         -- HTTP 200 but the content loads client-side only (SPA
#                                 shell / hydration script), nothing server-rendered.
#   reachable_calendar_wrapper -- HTTP 200 but only a date-picker landing page, no table.
#   reachable_duplicate       -- HTTP 200 but the same underlying table as an
#                                 already-wired source (not a second data source).
#   reachable_portal_only     -- HTTP 200 but a parent-bureau/branding landing page, no
#                                 station list or numeric reading in the fetched HTML.
#   reachable_pdf_unparsed    -- HTTP 200, a PDF with a real text layer (page count and
#                                 extractability confirmed), just not ingested yet.
#   unreachable            -- non-2xx / timeout / connection error, no TLS-specific cause.
#   unreachable_tls_error  -- the HTTPS handshake itself fails (curl rc=35 etc) -- the
#                             host may still be reachable over plain HTTP; check before
#                             calling it down.
#   needs_key   -- API key required, observed or documented.
#   unknown     -- not probed, only named on a page/portal.
#   unresolved_url -- no single concrete URL exists to probe (e.g. only a frontend
#                     route or an unconfirmed candidate feed-path pattern was found);
#                     carries no probed_at/http_status since no GET was fired.
#   not_a_source -- not a URL-having source at all (e.g. a code-review finding about
#                   an existing collector/parser); carries no probed_at/http_status.
#   host_blocked -- confirmed anti-bot/WAF block (403 bot-block signature), a host's own
#                   stated no-scraping policy (e.g. BoM RMM MJO), or any other
#                   host-safety-rule 403 this check will not re-probe in bulk (folds in
#                   the former separate "dormant" status -- same meaning). Distinct
#                   from plain `unreachable` (timeout/404/5xx/no-response) -- a
#                   host_blocked source will not respond differently on a re-probe;
#                   never retry it.

census_date: "2026-10-03"
probe_budget_used_approx: 78
notes_on_budget: >
  2026-09-27 sweep: ~39 fresh HTTP probes (9 data.go.th CKAN searches + ~14 targeted URL
  checks) on top of an already-extensive same-day agency-card sweep (docs/knowledge/
  agencies/*.md, ~60+ probes) that this census reuses and cites rather than re-running.
  2026-10-03 close-out: one additional GET per URL (curl -s -m 15, no
  retries) against each of the 30 entries that were still `unknown`, plus a
  classification-only pass (no new network request) reclassifying 3 of the 17
  `unreachable` entries to `host_blocked` (confirmed WAF/anti-bot 403s or a host's own
  stated no-scraping policy). ~30 new probes this check; combined total ~70, still well
  under the 120-request budget.
  2026-10-03 C3-GOV9 pass: one GET per URL against the 6 sources this check actually
  wired (now `tools/capture_source_sample.py` contract-test captures, see
  sources/registry.yaml), plus one re-probe of dwr_telemetry_station_positions
  (404 on the redirect target -- stays catalog_only) and one re-probe of
  reliefweb_api's v2-without-key shape (403 "not an approved appname", confirming it
  is the same gap already covered by reliefweb_api_v2's needs_key gate). 8 new probes
  this check; combined total ~78, still well under the 120-request budget. Sources
  drawn only from a prior sweep and not re-fetched by any round are tagged RELAYED (no
  pass itself saw the payload).

