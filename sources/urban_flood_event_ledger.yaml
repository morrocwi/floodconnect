schema_version: 1
ledger_kind: urban_flood_event_ledger
append_only: true
schema_description: 'Binary urban-flooding ground-truth ledger, append-only, adopted from docs/knowledge/card_thirdparty_urban_event_layer_and_zoom_2026-09-27.md
  §2.1 (the review''s proposed schema for the one real gap that card found: an ''urban flooding occurred''
  event record separate from data/observations.sqlite''s observations/contradictions tables). One row
  per event, one event may cover a city, a BMA flood-road district code, or a single PROP-FLOOD-06 node
  -- see unit_scope. observed_y_t (urban_flood_observed) and official_disaster_declared are ALWAYS separate
  fields, never merged, per the founder''s contradiction-first rule (CO_FORECAST_PROTOCOL.md §2b).'
fields:
- 'event_id: string, unique, never reused (append-only key)'
- 'unit_scope: city | district | node'
- 'unit: free-text identifier for the scope (city name, BMA flood-road district code, or PROP-FLOOD-06
  unit id)'
- 't_onset_observed: ISO8601 timestamp of the first evidence row supporting urban_flood_observed (never
  the same as t_onset_official)'
- 't_onset_official: ISO8601 timestamp of an official declaration, or null if none'
- 'evidence: list of {class, source, detail/value, observed_at_utc, tag} -- class is one of road_telemetry
  | canal_overbank | evacuation_shelter | community_reports_consistent | media | satellite'
- 'urban_flood_observed: true | false | UNCERTAIN -- the binary ground-truth call itself'
- 'official_disaster_declared: true | false | OPEN -- a regulatory/administrative fact, kept separate
  from urban_flood_observed even when both are true'
- 'declaring_agency: string or null'
- 'warnings: list of {issuer, issued_at, scope, text, lead_time_h, lead_time_note, tag} -- scope is regional_class
  | node_specific (mandatory, per TODO #51: prevents a coarse citywide warning''s lead time from being
  laundered into a node''s achieved lead)'
- 'notes: free text'
- 'contradictions: list of {description, tag} -- rows where this repo''s own data disagrees with a third-party/relayed
  claim; never resolved by silent preference'
- 'tag: VERIFIED | MEASURED | RELAYED | INSTINCT | OPEN -- mandatory on every event row AND on every evidence/warning
  sub-row (a row-level tag never upgrades a sub-row''s own weaker tag)'
decision_rule:
  chosen:
    name: road_telemetry_district_cluster_v1
    threshold_cm: 10.0
    min_roads: 3
    window_hours: 6.0
    tag: INSTINCT
  statement: urban_flood_observed = true for a district-day cluster when >= min_roads distinct thaiwater_flood_road
    stations sharing a BMA flood-road district code (the middle segment of station_code, e.g. FL.BKP.04
    -> district BKP) report value_cm >= threshold_cm within window_hours of each other, chain-clustered
    (consecutive qualifying readings <= window_hours apart join the same cluster).
  calibration_note: OPEN -- threshold_cm=10, min_roads=3, window_hours=6 chosen as a first pass because
    it produces a plausible-looking event count (25 district-events in the only year this source actually
    holds data, 2026) without collapsing to near-zero (min_roads=5) or exploding toward single-road noise
    (min_roads=2). This is INSTINCT, not derived from any registered threshold -- founder should confirm
    or adjust against the alternatives matrix below before this rule is treated as final.
  alternatives_matrix:
  - threshold_cm: 10.0
    min_roads: 2
    window_hours: 6.0
    total_events: 32
    by_year:
      2026: 32
    chosen: false
  - threshold_cm: 10.0
    min_roads: 3
    window_hours: 6.0
    total_events: 25
    by_year:
      2026: 25
    chosen: true
  - threshold_cm: 10.0
    min_roads: 5
    window_hours: 6.0
    total_events: 13
    by_year:
      2026: 13
    chosen: false
  - threshold_cm: 20.0
    min_roads: 2
    window_hours: 6.0
    total_events: 23
    by_year:
      2026: 23
    chosen: false
  - threshold_cm: 20.0
    min_roads: 3
    window_hours: 6.0
    total_events: 16
    by_year:
      2026: 16
    chosen: false
  - threshold_cm: 20.0
    min_roads: 5
    window_hours: 6.0
    total_events: 11
    by_year:
      2026: 11
    chosen: false
  - threshold_cm: 30.0
    min_roads: 2
    window_hours: 6.0
    total_events: 4
    by_year:
      2026: 4
    chosen: false
  - threshold_cm: 30.0
    min_roads: 3
    window_hours: 6.0
    total_events: 0
    by_year: {}
    chosen: false
  - threshold_cm: 30.0
    min_roads: 5
    window_hours: 6.0
    total_events: 0
    by_year: {}
    chosen: false
  data_note: 'MEASURED 2026-09-27: source thaiwater_flood_road holds 7,699 rows total (2019-01-30 .. 2026-09-27),
    but only 10 rows fall outside 2026 (1 in 2019, 2 each in 2021/2022/2023/2025, all value=0) -- isolated
    probe/test fetches, not a real historical archive. 7,689 of 7,699 rows (99.87%) are from 2026. Every
    candidate district-event below is therefore 2026-only; this is a measured gap in what this source
    holds, NOT a claim that Bangkok roads had zero flooding 2019-2025 -- the historical case-card events
    (2554, 2565, 2567 x2) below cover some of that gap via RELAYED news synthesis, at city/regional grain
    only, not per-road.'
