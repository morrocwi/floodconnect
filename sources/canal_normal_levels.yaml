  # Added 2026-09-27 (TODO #50/#62, bma_plan2569 extraction): WL.BMA.02 (คลองบ้านม้า 2,
  # สถานีสูบน้ำคลองบ้านม้า 2 / ST.SPS.01) had NO normal_level_m on record anywhere in this
  # repo before this row -- both tools/heromap/sammakorn_map.classify_tier() and
  # site/build_data.py's sammakorn_node_readout() correctly rendered "ยังไม่มีเกณฑ์ปกติ" /
  # NO_NORMAL_BASIS for it (see tests/test_sammakorn_chain.py, pre-fix). basis here is
  # NOT a dry-season statistical median like the rows above -- it is the agency's own
  # printed operating ceiling (แผน ค, "ถ่ายเทไหลเวียน ไม่เกินเตือนภัย") from the BMA 2569
  # plan's ตาราง ง, p.191 (printed ง-25), same row as the ST.SPS.01 capacity match (see
  # docs/knowledge/bma_plan2569_control_structures.yaml row_id bma_plan2569:ctrl:p191:28).
  # `basis: official_threshold` is a distinct tag from `dry_season_median` /
  # `MEASURED-history` on purpose -- see resolve_normal_level()'s "OFFICIAL-BMA-plan"
  # branch in site/build_data.py, added alongside this row so the basis_label shown to
  # the public never mislabels an official printed ceiling as a computed statistic.
  #
  # CORRECTION 2026-09-27 (P0, orchestrator-verified via read-only SQL, same day as the
  # row above): this row's lat/lon (13.7763, 100.6713) and its 0.40/0.50 m.MSL lines are
  # the BMA plan 2569 ตาราง ง p.191 row for สถานีสูบน้ำคลองบ้านม้า 2 / ST.SPS.01 (the PUMP
  # STATION) -- NOT for WL.BMA.02 (the water-level TELEMETRY GAUGE "จุดวัดคลองบ้านม้า ตอน
  # ถนนรามคำแหง", per docs/knowledge/bma_plan2569_stations.yaml seq 39, lat 13.77273 /
  # lon 100.66595, ~0.6 km away -- distance check: haversine(13.7763,100.6713 ->
  # 13.77273,100.66595) ≈ 630 m, well over the 100 m same-station tolerance). WL.BMA.02's
  # OWN feed (bma_watermap) carries its own warning/critical (2.14 / 2.68 m) which differ
  # from this row's 0.40/0.50 by ~1.7 m -- consistent with a datum difference, not a
  # measurement error (see sources/rain_alert_thresholds_crosswalk.yaml rule R4:
  # "compare only same station, same datum" -- unknown/mismatched datum = REFUSE, never
  # silently apply). This row is kept, append-only (AGENTS.md §2 "never prune"), but is
  # now correctly re-keyed below to the station it actually describes (ST.SPS.01) so
  # `load_canal_normal_levels()` / `resolve_normal_level()` (site/build_data.py) and
  # `load_normal_levels()` (tools/heromap/sammakorn_map.py) -- both key strictly by
  # `station_code` -- stop applying it to WL.BMA.02. WL.BMA.02 therefore resolves to
  # NO_NORMAL_BASIS / "ยังไม่มีเกณฑ์ปกติ" again (grey), not "สูงกว่าปกติ"/ABOVE_NORMAL and
  # never "ปกติ". See the contradiction row logged in
  # docs/knowledge/statement_contradictions_2026-09-27.yaml (station_vs_plan list,
  # id station_vs_plan:2026-09-27_wl_bma_02_vs_st_sps_01) and
  # docs/knowledge/INCIDENTS_2026-09-27.md item 4 for the full incident writeup.
  # `station_distance_m` / `datum` below are read by
  # resolve_normal_level()/load_canal_normal_levels()'s general guard: any
  # `basis: official_threshold` row with `station_distance_m` > 100 (or absent) or a
  # `datum` that is missing/"OPEN"/unconfirmed is refused (never applied), independent of
  # this specific re-key -- so a future mis-located/undated official_threshold row fails
  # the same way instead of silently rendering.
  - station_code: "ST.SPS.01"
    canal_name_th: "คลองบ้านม้า 2 (สถานีสูบน้ำคลองบ้านม้า 2 / ST.SPS.01)"
    applies_to: "ST.SPS.01 (สถานีสูบน้ำคลองบ้านม้า 2), ไม่ใช่ WL.BMA.02 (คนละตำแหน่ง ~630 ม. และคนละ datum ที่ยังไม่ยืนยัน)"
    lat: 13.7763
    lon: 100.6713
    station_distance_m: 0
    normal_level_m: 0.40
    basis: official_threshold
    warning_level_m: 0.40
    critical_level_m: 0.50
    control_plan_A_m: -1.00
    control_plan_B_m: -0.50
    control_plan_C_m: 0.40
    datum: "m MSL (ม.รทก., BMA plan 2569 ตาราง ง)"
    source: "แผนปฏิบัติการป้องกันและแก้ไขปัญหาน้ำท่วม กทม. 2569, ตาราง ง, p.191 (พิมพ์ ง-25), แถวสถานีสูบน้ำคลองบ้านม้า 2"
    tag: VERIFIED
    note: "CORRECTED 2026-09-27: 0.40/0.50 ม.รทก. คือเพดานควบคุมของสถานีสูบน้ำคลองบ้านม้า 2 (ST.SPS.01) เท่านั้น -- เดิมเคยผูกผิดกับ WL.BMA.02 (เกจวัดระดับ คนละตำแหน่ง คนละ datum ที่ยังไม่ยืนยัน) ทำให้ค่า 0.71-0.73 ม. ของ WL.BMA.02 ถูกจัดผิดเป็น ABOVE_NORMAL/สูงกว่าปกติ -- แก้แล้ว: station_code เปลี่ยนจาก WL.BMA.02 เป็น ST.SPS.01 (re-key, append-only, แถวเดิมไม่ถูกลบ) WL.BMA.02 กลับสู่ NO_NORMAL_BASIS/ยังไม่มีเกณฑ์ปกติ; ห่างกัน ~630 ม. และ datum ยังเป็น OPEN"

