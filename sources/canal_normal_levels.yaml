# canal_normal_levels.yaml -- Scope: new data only, from a data-sweep pass
# (2026-09-27). Does not edit sources/registry.yaml,
# sources/capacity_ledger.yaml, or any other tracked file. Not committed as part of
# this change.
#
# Founder ask (verbatim): "สกัดหาประโยชน์มาให้ได้ เพื่อให้คลองกลายเป็น node ที่จะระบุได้ง่ายๆ
# ว่าสถานการณ์กลับสู่ปกติ คลองนี้ควรอยู่ที่เลขเท่าไหร่" -- per-canal NORMAL/CONTROL level so a
# future readout can say "คลองนี้กลับสู่ปกติที่ X ม."
#
# basis values used here:
#   dry_season_median : MEASURED median of station value_msl (m) over a fetched
#     2026-02-01..2026-03-15 (dry-season, Gregorian; = ปลายเดือน ก.พ.-กลาง มี.ค. 2569)
#     window from api-v3.thaiwater.net waterlevel_graph (station_type=canal). Raw payload
#     archived at raw/backtest/hii_history/canal_<oldcode>_<id>_normal.json (6 requests,
#     1 request/URL, this check's target-F budget). Tag: MEASURED-history (measured by this
#     task, not an agency-published "normal" figure).
#   control_level     : an agency-stated operational control/warning level -- NOT found
#     for these 6 canals in the one plan document checked (see notes/OPEN below). None
#     used here.
#   OPEN              : no basis found.
#
# IMPORTANT caveat (say plainly): a computed dry-season median is a DESCRIPTIVE statistic
# of one ~6-week window, not an agency-declared "normal operating level" -- do not present
# it to the public as an official control level. It is however directly comparable, on
# the exact same station/instrument, to any live reading -- which is what makes it useful
# as a "back to normal" reference node per founder's ask. RELAYED->MEASURED-history
# distinction matters here per AGENTS.md epistemic floor.

