  - id: overpass_bkk_drainage_features
    agency: "OpenStreetMap contributors (via Overpass API)"
    name_th: "ทางระบายน้ำ/ท่อลอด/ท่อ ใน OSM ช่วง bbox กรุงเทพฯ (waterway=drain|ditch, tunnel=culvert, man_made=pipeline)"
    name_en: "OSM drain/ditch/culvert/pipeline features, Bangkok bbox"
    url: "https://overpass-api.de/api/interpreter (query: way[waterway=drain|ditch], way[tunnel=culvert], way[man_made=pipeline][substance=water], bbox 13.4,100.3,14.0,100.9)"
    kind: overpass_query
    contains: >
      COULD NOT COMPLETE -- both attempts failed. First (POST, --data-urlencode
      data@file) returned HTTP 406 from overpass-api.de's own Apache layer (not a
      Thailand/BMA host -- no live-ops risk). Second, corrected attempt (explicit
      Content-Type + inline query string, same host) also returned HTTP 406. Per this
      task's "one query-format retry allowed on syntax failure, not a third attempt"
      rule, stopped there rather than escalate to a mirror -- a third attempt at
      overpass.kumi.systems also failed at the network layer (exit 1, no response) and
      is not counted as a retry against the same host. Feature counts for
      drain/ditch/culvert/pipeline specifically are therefore UNKNOWN this check -- only
      the pre-existing `output/bangkok_canals.graphml` (waterway=canal only, built by
      an earlier task, see `tools/kg/README.md`) is available: 8,672 nodes / 10,006
      edges, all tagged `canal_node`/RELAYED. That earlier survey did not query
      waterway=drain|ditch, tunnel=culvert, or man_made=pipeline, so it gives no
      drainage-pipe count either.
    format: json (attempted)
    coverage: "Bangkok bbox (attempted, not returned)"
    has_coords: true
    licence: "ODbL (OpenStreetMap contributors) -- applies if/when this query succeeds"
    auth: none
    status: unreachable
    http_status: 406
    probed_at: "2026-09-27"
    sample_archived_path: "raw/gis/overpass_bkk_drains/counts.json"
