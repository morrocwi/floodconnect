# PHASE -- Bangkok storm-drain / sewer / culvert / pipe network source census.
#
# Founder ask, verbatim (2026-09-27, 16:46): "เครือข่ายท่อต่างๆ หาได้ไหม หาได้ที่ไหน
# เอามาต่อกันเป็น kggraph" -- can the storm-drain/sewer/culvert/pipe network (ท่อระบายน้ำ,
# ท่อลอด, รางระบายน้ำ, บ่อพัก, สถานีสูบย่อย) be found, where, and connected into the KG
# under the canal layer.
#
# Same schema intent as sources/api_census.yaml (this is a NEW, separate file -- that
# file is not edited). Method: curl, browser User-Agent, 20s timeout, ONE request per
# URL, no retries (one query-format retry allowed on the same Overpass URL when the
# first attempt failed on request syntax, not on host response -- logged below, not
# repeated a third time). No auth attempts beyond an unauthenticated GET.
#
# tag vocabulary: VERIFIED (this check fetched the URL and read the payload) / RELAYED
# (only seen listed on a portal/search result, not itself fetched) / OPEN (existence/
# shape unknown or unresolved after the probe).
# status vocabulary: reachable | needs_key | unreachable | js_only | unknown (not
# probed).

census_date: "2026-09-27"
founder_ask_th: "เครือข่ายท่อต่างๆ หาได้ไหม หาได้ที่ไหน เอามาต่อกันเป็น kggraph"
probe_budget_used_approx: 11
notes_on_budget: >
  ~11 fresh HTTP probes this check: 1 BMA ArcGIS REST services-root discovery, 1
  water_manag_data folder (token-gated), 1 BMA folder listing, 1 FLOODGATE layer
  metadata, 1 data.bangkok.go.th drainage-office org page, 1 drain-pipe CKAN dataset
  page, 1 drain-pipe CSV download, 1 pipe_jacking CKAN dataset page, 2 Overpass API
  attempts (both failed -- see overpass_bkk_drainage_features row), 1 data.go.th CKAN
  package_search. Two WebSearch calls (not counted in the HTTP budget) located the BMA
  ArcGIS host and the data.bangkok.go.th drainage-office organization page.

