  - id: bma_opendata_drain_pipe_csv
    agency: "กรุงเทพมหานคร / สำนักการระบายน้ำ (BMA Department of Drainage and Sewerage)"
    name_th: "โครงข่ายท่อระบายน้ำ (ชุดข้อมูล drain_pipe)"
    name_en: "BMA drainage-pipe network dataset (data.bangkok.go.th)"
    portal_url: "https://data.bangkok.go.th/dataset/drain-pipe"
    download_url: "https://data.bangkok.go.th/dataset/93a20240-92d6-4d3b-9fa8-54b7742cb1bc/resource/123b05d1-ac86-465a-acab-2fab35b7d310/download/drain_pipe.csv"
    kind: csv_download
    contains: >
      2,904 rows (2,903 data rows + header), one row roughly per road-segment drainage
      record. Fields: No, DISTRICT_NAME (เขต), ROADCL_NAME (ชื่อถนน/ตรอกซอย the segment
      runs along), PIPE_FROM / PIPE_TO (named street/intersection endpoints -- explicit
      TOPOLOGY, not coordinates), R_DIMENSION/R_LENGTH/R_TYPE (right-side pipe: size in
      metres, length in metres, type e.g. ท่อกลม=round pipe), L_DIMENSION/L_LENGTH/L_TYPE
      (left-side pipe, same shape), ROAD_DIMENSION/ROAD_LENGTH/ROAD_TYPE (road-level
      culvert/drain, type e.g. รางระบายน้ำ=drainage channel), PJ_DIMENSION/PJ_LENGTH/
      PJ_TYPE (pipe-jacking / เครื่องดันท่อลอด segments), PIPE_LENGTH (total). This is a
      genuine drain-SEGMENT inventory with explicit from/to street topology and
      dimensions -- the closest official match to the founder's ask found this check.
    format: "CSV, windows-874/TIS-620 encoded (not UTF-8 -- must decode with cp874)"
    coverage: "citywide by DISTRICT_NAME field, but row density is uneven -- many rows
      have blank PIPE_FROM/PIPE_TO/ROADCL_NAME (see below); not confirmed exhaustive
      for all 50 เขต within this check's read"
    has_coords: false
    coord_note: >
      NO lat/lon anywhere in this file. Position is only inferable by matching
      DISTRICT_NAME + ROADCL_NAME + PIPE_FROM/PIPE_TO street names against a street
      gazetteer (OSM or BMA's own road layer) -- that would be a NEW geocoding step,
      not present in the source, and is explicitly out of scope per this repo's "no
      geometric guessing without INSTINCT tag + founder OK" rule.
    licence: "Open Government Data of Bangkok portal (CKAN) -- licence field not read
      off the dataset page this check (OPEN); portal is presented as open government
      data, not confirmed ODbL/CC-equivalent text"
    auth: none
    status: reachable
    http_status: 200
    probed_at: "2026-09-27"
    sample_archived_path: "raw/live/bma_open_data_drainage_org/drain_pipe_full.csv"
    tag: VERIFIED

