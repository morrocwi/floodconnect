# sources/province_agency_crosswalk.yaml -- explicit, reviewable crosswalk from
# docs/knowledge/water_system_dag.mmd's governance `AG_*` nodes to the area nodes
# (province:<2-digit DOPA code>, district:<4-digit code>, basin:onwr:<N>) a KG builder
# wires via a `RESPONSIBLE_FOR` edge. Same pattern as sources/owner_agency_crosswalk.yaml
# -- no regex/fuzzy matching, every row read off an existing, already-committed source.
#
# Row shape:
#   agency_id: <AG_* node id in docs/knowledge/water_system_dag.mmd -- verbatim>
#   area_id: <province:NN | district:NNNN | basin:onwr:N>
#   role_template: false  -- a per-province/per-district AG_ node already exists and
#                             names this exact area (checked against the DAG label).
#                role_template: true  -- no per-province/per-district AG_ node exists;
#                             this row points the GENERIC role node (AG_PROV_GOV /
#                             AG_PROV_RID / AG_PROV_PAO / AG_BASIN_CMT) at the area under
#                             the documented legal basis (LAW_DISASTER2550 names the
#                             provincial governor as ผอ.จังหวัด in every province; the
#                             Water Resources Act 2561 names a lum-nam committee for
#                             every one of the 36 basins). No new AG_ node is invented
#                             here for the provinces/basins without one.
#   tag: VERIFIED (role_template: false rows -- the DAG label names this province/
#        basin by name, read directly, not inferred) | RELAYED-GENERAL (role_template:
#        true rows -- the role is legally general, the specific office is not yet its
#        own DAG node)
#   evidence: why
#
# Coverage as of this file's creation (2026-10-04): the 9 provinces with a per-province
# AG_PROV_GOV_*/AG_PROV_RID_*/AG_PROV_PAO_* triple in the DAG (checked against
# docs/knowledge/water_system_dag.mmd directly, not guessed): อ่างทอง (ATG),
# พระนครศรีอยุธยา (AYA), ชัยนาท (CNT), ลพบุรี (LPB), นครสวรรค์ (NSW), นนทบุรี (NTB),
# ปทุมธานี (PTT), สิงห์บุรี (SBR), สระบุรี (SRB) -- province codes are the standard DOPA
# 2-digit codes (same codes already observed in sources/hii_station_geocode.yaml's
# geocode rows, e.g. Pathum Thani=13, Chai Nat=18 -- cross-checked, not reinvented).
# The other 68 provinces and every basin without its own committee node use the
# role_template rows below, kept small and explicit rather than invented per-province.
#
# A KG builder consumes this file to add RESPONSIBLE_FOR edges
# (agency -RESPONSIBLE_FOR-> area, {role_template, tag}); this file itself adds no node
# or edge to any graph -- not yet wired into tools/kg/build_kg.py (OPEN, Phase 3 of the
# 2026-10-04 KG-links design).

province_rows:
  - province_code: "15"
    province_name_th: "อ่างทอง"
    gov: AG_PROV_GOV_ATG
    rid: AG_PROV_RID_ATG
    pao: AG_PROV_PAO_ATG
    tag: VERIFIED
    evidence: "DAG labels AG_PROV_GOV_ATG/AG_PROV_RID_ATG/AG_PROV_PAO_ATG name อ่างทอง exactly"
  - province_code: "14"
    province_name_th: "พระนครศรีอยุธยา"
    gov: AG_PROV_GOV_AYA
    rid: AG_PROV_RID_AYA
    pao: AG_PROV_PAO_AYA
    tag: VERIFIED
    evidence: "DAG labels name พระนครศรีอยุธยา exactly"
  - province_code: "18"
    province_name_th: "ชัยนาท"
    gov: AG_PROV_GOV_CNT
    rid: AG_PROV_RID_CNT
