bangkok_rows:
  - area_id: "province:10"
    agency_id: AG_BMA_GOV
    role_template: false
    tag: VERIFIED
    evidence: "AG_BMA_GOV label \"ผู้ว่าฯ กทม. = ผู้อำนวยการ กทม.\" -- the BMA governor is province:10's own governance node, not a role template"
  - area_id: "district:1044"
    agency_id: AG_DIST_SS
    role_template: false
    tag: VERIFIED
    evidence: "AG_DIST_SS label \"ผอ.เขตสะพานสูง\" = Saphan Sung; district_code 1044 read from sources/bkk_district_elevation.yaml (district_th: สะพานสูง), not guessed -- the 2026-10-04 design note's OPEN on this code is resolved"

basin_rows:
  - basin_id: "basin:onwr:10"
    agency_id: AG_BASIN_CHAOPHRAYA
    role_template: false
    tag: VERIFIED
    evidence: "DAG label \"คณะกรรมการลุ่มน้ำเจ้าพระยา (basin:onwr:10)\" -- basin id is the label's own token"
  - basin_id: "basin:onwr:12"
    agency_id: AG_BASIN_PASAK
    role_template: false
    tag: VERIFIED
    evidence: "DAG label \"คณะกรรมการลุ่มน้ำป่าสัก (basin:onwr:12)\" -- basin id is the label's own token"

role_template_rows:
  - applies_to: "every province:NN not listed in province_rows or bangkok_rows above"
    gov: AG_PROV_GOV
    rid: AG_PROV_RID
    pao: AG_PROV_PAO
    role_template: true
    tag: RELAYED-GENERAL
    evidence: >
      LAW_DISASTER2550 (Disaster Prevention and Mitigation Act 2550) names the
      provincial governor ผอ.จังหวัด (= AG_PROV_GOV's role) in every province; the
      generic AG_PROV_RID/AG_PROV_PAO role nodes exist in the DAG with the same
      template labels ("โครงการชลประทานจังหวัด / สำนักงานชลประทานที่ N",
      "อบจ. (องค์การบริหารส่วนจังหวัด)") for every province, but the DAG has not (yet)
      been given a per-province AG_ node for the other 68 provinces. This row lets a
      consumer answer "who is accountable here" with the correct ROLE and an explicit
      role_template flag, without this file inventing a new per-province DAG node.
  - applies_to: "every basin:onwr:N not listed in basin_rows above"
    cmt: AG_BASIN_CMT
    role_template: true
    tag: RELAYED-GENERAL
    evidence: >
      Water Resources Act 2561 establishes a คณะกรรมการลุ่มน้ำ (basin committee) for
      every one of the 36 declared basins; the DAG's generic AG_BASIN_CMT role node
      carries this template label, but only 2 of the 36 basins (Chao Phraya, Pasak)
      have their own named AG_BASIN_* node today.
