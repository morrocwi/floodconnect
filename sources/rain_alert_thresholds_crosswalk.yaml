  global_layer_disagreement_note: >
    No global-model number here overrides or averages with a Thai-agency number anywhere in this
    file. Where a global system supplies only a category (CAP, Meteoalarm, Google Flood Hub) it is
    mapped via R11 (categorical only, no numeric conversion). Where a global system supplies a
    return-period THRESHOLD (GloFAS) it would be mapped via R10 (same station/reach only, currently
    OPEN — no value held). ECMWF EFI/SOT is recorded but not mapped at all (OPEN). Every rung_mapping
    above not already tagged VERIFIED/RELAYED-with-a-real-value is explicitly marked
    "ข้อเสนอ — ยังไม่ลง Toledo / รอผู้ก่อตั้งตัดสิน", per the founder's own rule for any edge that is
    our choice rather than an agency's.
