# =================================================================================================
# conversion_rules — R1-R9, per founder's "สร้างกฎแปลงเพื่อให้เกณฑ์ชัด" instruction. Every rule states
# from/to, formula-in-words+symbols, validity conditions, what is REFUSED, source/basis, Toledo status.
# None of these are registered Toledo equations -- plain-arithmetic/lookup rules only, exactly the same
# discipline as sources/units_datum_crosswalk.yaml's own computation_rules block.
# =================================================================================================
conversion_rules:
  - rule_id: R1
    name: depth_intensity_same_duration_identity
    from: {quantity: rainfall_intensity, unit: mm/h, window: "duration D hours"}
    to: {quantity: rainfall_depth, unit: mm, window: "same duration D hours"}
    formula_words: "depth (mm) equals intensity (mm/h) multiplied by duration (h), for the SAME duration window on both sides"
    formula_symbols: "depth_mm = intensity_mm_per_h * duration_h"
    conditions_of_validity: "valid ONLY when both sides describe the identical duration window (e.g. a 1h intensity converts to a 1h depth, not a 24h depth) — this is a unit identity, not an empirical relationship"
    refused_when: "the two sides name different durations (that is R2's problem, not R1's) — R1 never bridges durations"
    source_basis: "plain arithmetic (depth = rate x time), same discipline as sources/units_datum_crosswalk.yaml computation_rules.never_add_intensity_to_accumulation"
    toledo_status: "not a Toledo equation — dimensional identity, same footing as capacity_ledger.yaml's own /86400 conversion"

  - rule_id: R2
    name: depth_intensity_across_durations_via_idf_return_period_match
    from: {quantity: rainfall_depth, unit: mm, window: "24h (or any duration in the IDF table)"}
    to: {quantity: rainfall_intensity, unit: mm/h, window: "a DIFFERENT duration (e.g. 1h) in the same IDF table"}
    formula_words: >
      NOT an identity. The only sanctioned bridge across durations is: (1) find the return period T
      in the official Bangkok IDF table whose value AT THE GIVEN DURATION equals the input, (2) read
      off that SAME T's value at the target duration from the same table row. If no T reproduces the
      input at the given duration, or the input falls outside the table's own duration/return-period
      range, this rule REFUSES — no interpolation, no extrapolation, no division by an assumed
      "average rain hours per day".
    formula_symbols: "intensity_D2(T) := IDF_table[T][D2], where T solves depth_D1(T) = given_depth, D1 = given duration, D2 = target duration"
    conditions_of_validity: "both durations D1, D2 must be columns actually present in the IDF table (5min,10min,15min,30min,1h,2h,3h,6h,12h,24h); T must be one of the table's own return periods (2y,5y,7y,10y,12y)"
    refused_when: "no exact or declared-tolerance match exists in the table for the given duration/value pair; input outside the table's stated range"
    worked_check_80_vs_58_7: >
      RESULT: NOT REPRODUCED BY THE IDF TABLE'S OWN SAME-T MATCHING -- kept OPEN, not VERIFIED.
      The BMA plan's own design-capacity quote (p63) pairs 80 mm/24h with 58.7 mm/h as if the same
      design statement. Checking against docs/knowledge/bma_plan2569_assets.yaml's design_storm_table_p18
      (VERIFIED IDF table): the 2-year return period row gives 24h depth = 93.6 mm and 1h intensity =
      58.7 mm/h -- so 58.7 mm/h DOES match the table's own T=2y/1h column exactly (VERIFIED), but the
      24h depth at that SAME T=2y is 93.6 mm, NOT 80 mm. The 80 mm/day figure is therefore NOT the
      T=2y/24h value from this table -- it is a separately-stated, rounded system-capacity figure that
      happens to be presented alongside the T=2y/1h intensity value, not derived from the 24h column of
      the same return period. The plan's own prose ("80 mm in 1 day, on average rain falls ~3 hours a
      day") is also not simple division (80/3 = 26.7, not 58.7). CONCLUSION: the 80<->58.7 pairing is
      OPEN -- not an IDF same-T identity, and not a stated /3h division either; it is two independently
      declared numbers presented together in the plan's own text.
    worked_check_104_vs_76: >
      Same method: 76.0 mm/h matches the table's own T=5y/1h column exactly (VERIFIED), but T=5y/24h
      is 122.4 mm, NOT 104 mm. Same conclusion as above: OPEN, not an IDF same-T identity.
    source_basis: "docs/knowledge/bma_plan2569_assets.yaml design_storm_table_p18 (VERIFIED, BMA plan 2569 PDF p18)"
    toledo_status: "not yet in Toledo — empirical table lookup, not a derived formula"

  - rule_id: R3
    name: day_boundary_shift_by_resummation_only
    from: {quantity: rainfall_depth, unit: mm, window: "24h ending at one day-boundary convention (e.g. TMD 07:00 ICT)"}
    to: {quantity: rainfall_depth, unit: mm, window: "24h ending at a different day-boundary convention (local midnight or UTC midnight)"}
    formula_words: "shifting the day boundary is only valid by RE-SUMMING the underlying hourly series over the new window — never by pro-rating or shifting a single already-aggregated daily total"
    formula_symbols: "depth[new_window] = sum(hourly_mm[t] for t in new_window_hours) -- requires the hourly series, not just the daily total"
    conditions_of_validity: "the underlying hourly-resolution series must exist and be accessible"
    refused_when: "only a pre-aggregated daily total is available (no hourly series to re-sum) -- REFUSED, no pro-rating allowed"
    source_basis: "sources/units_datum_crosswalk.yaml international_apis.day_boundary_mismatch block (already VERIFIED/RELAYED per-source boundary statements)"
    toledo_status: "not a Toledo equation — a resummation procedure, not a formula"

  - rule_id: R4
    name: water_level_vs_agency_line_margin
    from: {quantity: water_level, unit: m, window: instantaneous}
    to: {quantity: margin_to_agency_line, unit: m, window: instantaneous}
    formula_words: "margin (m) equals the gauge reading H minus the agency's own named line (warning/critical/bank), read at the SAME station and the SAME vertical datum only"
    formula_symbols: "margin_m = H - line_value (same station, same datum)"
    conditions_of_validity: "H and line_value must share the identical datum (m MSL or the same station-local zero) — never mixed"
    refused_when: >
      cross-station comparison is REFUSED unless both stations' readings are confirmed m MSL; the 8
      BMA-plan station codes with a coordinate mismatch >100m and any station whose datum basis is
      unresolved (per sources/units_datum_crosswalk.yaml water_level block, e.g. the BMA canal
      water_level_m family, tag OPEN there) are REFUSED for cross-station use until their datum is
      confirmed. HII's own "%bank" (storage_percent-style) field has no confirmed denominator
      definition found this check (see hii_situation_level / hii_storage_percent_bands_candidate
      schemes above, both OPEN) — treat any %-bank figure as OPEN, not a computable margin, until a
      primary HII glossary confirms the denominator.
    source_basis: "sources/units_datum_crosswalk.yaml computation_rules.never_mix_msl_and_local; docs/knowledge/bma_plan2569_canal_thresholds.yaml"
    toledo_status: "not a Toledo equation — subtraction on a shared datum, a stated REFUSAL rule otherwise"

  - rule_id: R5
    name: discharge_ratio_same_reach_only
    from: {quantity: discharge, unit: m3/s, window: instantaneous}
    to: {quantity: discharge_ratio, unit: dimensionless, window: instantaneous}
    formula_words: "ratio equals the gauge's discharge Q divided by that SAME station/reach's own declared bankfull or agency-critical discharge — never a different reach's number"
    formula_symbols: "ratio = Q / Q_bankfull_or_critical (same station/reach)"
    conditions_of_validity: "Q_bankfull_or_critical must be declared for that exact station/reach (e.g. C.13 flooded_min 3,721 m3/s per sources/coping_thresholds.yaml is C.13-specific, NOT interchangeable with the Bangkok-reach 2,500-3,500 m3/s band, per that file's own explicit non-merge note)"
    refused_when: "a GloFAS/model-estimated discharge (openmeteo_flood, forecast-inferred) is NEVER substituted for a real gauge reading at the same coordinate, per sources/units_datum_crosswalk.yaml computation_rules.grid_cell_vs_gauge_not_equal — tag forecast-inferred always"
    source_basis: "sources/coping_thresholds.yaml chao_phraya_bkk_reach rows; sources/units_datum_crosswalk.yaml international_apis.openmeteo_flood row"
    toledo_status: "not a Toledo equation — a ratio of two same-reach declared numbers"

  - rule_id: R6
    name: reservoir_storage_percent_declared_denominator
    from: {quantity: storage_volume, unit: million_m3, window: instantaneous}
    to: {quantity: storage_percent, unit: "%", window: instantaneous}
    formula_words: "storage percent equals stored volume divided by the reservoir's own declared capacity, AT THE AGENCY'S OWN STATED DEFINITION of that capacity (normal/effective storage level, vs the reservoir's maximum/spillway-crest storage) — the two denominators give different percentages for the same volume, so the definition used MUST be stated every time"
    formula_symbols: "storage_pct = volume_mcm / capacity_mcm(definition) * 100 -- definition in {normal_storage, max_storage}"
    conditions_of_validity: "the denominator definition (normal vs max) must be stated alongside every percentage; EGAT's egat_dam_storage_pct is RELAYED-assumed 'against the dam's own rated full-supply capacity' per sources/units_datum_crosswalk.yaml, not independently re-verified this check"
    refused_when: "the denominator definition is unstated or unconfirmed (as with HII's own storage_percent field, whose 209.48% sample value already proves it is not naive percent-of-design-capacity) — treat as OPEN, not computable, until confirmed"
    source_basis: "sources/units_datum_crosswalk.yaml quantities.storage_percent block"
    toledo_status: "not a Toledo equation — a ratio requiring a stated, agency-specific denominator"

  - rule_id: R7
    name: category_forecast_to_interval
    from: {quantity: rainfall_depth, unit: mm/24h, window: 24h}
    to: {quantity: interval, unit: "[lower, upper] mm/24h", window: 24h}
    formula_words: "a named class or colour maps to its own declared [lower, upper] band from the scheme it belongs to (see `schemes` above); the open-ended top class's upper edge is REFUSED, never set to +infinity"
    formula_symbols: "interval(class) = [lower(class), upper(class)] ; upper(top_class) := REFUSED"
    conditions_of_validity: "used only to produce a POSSIBLE/ROBUST qualitative label from a forecast category, never a point numeric estimate"
    refused_when: "the class is the open-ended top class (e.g. TMD 'หนักมาก' >=90.1, or risk-map 'ม่วง' >250.0) — no upper bound is stated, so none is fabricated"
    source_basis: "this file's own `schemes` block above"
    toledo_status: "not a Toledo equation — a lookup into an already-declared band table"

  - rule_id: R8
    name: per_model_forecast_to_rung_worst_first
    from: {quantity: any, unit: "per named forecast model", window: "per model's own window"}
    to: {quantity: any, unit: "unified ladder rung", window: "same as from"}
    formula_words: "evaluate EACH named model/source separately against the rung's declared edge; report the WORST model (the one placing the term closest to/over the danger edge) FIRST, with every other model's placement shown alongside — never averaged into one number"
    formula_symbols: "rung_reported := rung(worst_case_model) ; rung(model_i) shown for all i"
    conditions_of_validity: "applies whenever more than one model/source reports the same declared term (rain forecast ensembles, dam-release figures from EGAT vs HII, etc.)"
    refused_when: "n/a — this rule itself IS the refusal of averaging, per PROP-FLOOD-06 v6.1's own multi_model_scenarios discipline"
    source_basis: "toledo-wt-flood06/docs/proposals/PROP-FLOOD-06.md v6.1 definitions.multi_model_scenarios (worst_case/best_case/majority_band, never averaged)"
    toledo_status: "not a Toledo equation — a selection/reporting discipline, reused verbatim from PROP-FLOOD-06's own already-registered convention"

  - rule_id: R10
    name: return_period_to_rung_same_reach_only
    from: {quantity: discharge_or_level, unit: "m3/s or m", window: "a stated return period T (e.g. 2y/5y/20y)"}
    to: {quantity: any, unit: "unified ladder rung", window: n/a}
    formula_words: >
      A return-period exceedance (GloFAS, Google Flood Hub, or any other return-period-based global
      model) maps to a rung ONLY by matching the return-period's stated discharge/level value against
      the SAME station/reach's own agency-declared critical/bankfull number for that identical
      location — exactly like R5's discharge ratio rule, applied to a return-period-labelled source
      instead of a raw gauge reading. Never matched against a different reach's number.
    formula_symbols: "rung := rung_of(agency_critical_value) where agency_critical_value is declared for the SAME station/reach as the return-period figure"
    conditions_of_validity: "the agency must have its own declared critical/bankfull value for that exact station/reach; the return-period source and the agency value must refer to the identical point"
    refused_when: "no agency-declared critical value exists for that exact station/reach (current state for all 3 GloFAS-collected points in this repo — see global_layer.systems.glofas_return_period, OPEN) — REFUSED, not guessed"
    source_basis: "generalises R5 (discharge_ratio_same_reach_only) to a return-period-labelled input"
    toledo_status: "not a Toledo equation — a same-reach lookup/match rule"

  - rule_id: R11
    name: cap_style_categorical_mapping_no_numeric_conversion
    from: {quantity: "categorical severity/urgency/certainty label (CAP, Meteoalarm, or any similar global vocabulary)", unit: categorical, window: n/a}
    to: {quantity: any, unit: "unified ladder rung", window: n/a}
    formula_words: >
      A global categorical vocabulary (CAP severity/urgency/certainty, Meteoalarm colour) maps to a
      rung by NAME ONLY, exactly like R9's categorical mapping for a national/local flag — this is
      the same rule generalised to a global-model vocabulary. The mapping itself is a PROPOSAL
      (INSTINCT) unless the founder adopts it; it is never derived from or blended with a numeric
      threshold from any other rule.
    formula_symbols: "rung := categorical_map(global_label) -- a stated lookup table, not a formula"
    conditions_of_validity: "always usable as a proposal; becomes a decided mapping only when the founder accepts it"
    refused_when: "n/a — no numeric conversion is ever attempted by this rule"
    source_basis: "generalises R9 (declaration_flag_to_rung_categorical_only) to global-model vocabularies"
    toledo_status: "not a Toledo equation — a categorical mapping rule, proposal status until decided"

  - rule_id: R9
    name: declaration_flag_to_rung_categorical_only
    from: {quantity: "official declaration or flag colour", unit: categorical, window: n/a}
    to: {quantity: any, unit: "unified ladder rung", window: n/a}
    formula_words: "a flag/declaration maps to a rung by NAME ONLY (categorical lookup) — never converted into or averaged with a numeric quantity; the underlying observed number (if any) that triggered the declaration is kept as a SEPARATE field alongside the declared flag, never merged into one value"
    formula_symbols: "rung := categorical_map(flag_name) ; observed_value kept separate, never substituted for or blended with the flag"
    conditions_of_validity: "always — this is the correct handling for Hat Yai flags, Rangsit levels, BMA's เตือนภัย/วิกฤติ labels, and DDPM's เฝ้าระวัง/แจ้งเตือน/อพยพ vocabulary"
    refused_when: "n/a — this rule never numerically converts; if a numeric equivalent is needed and none is declared, that specific need is OPEN, not this rule's problem"
    source_basis: "this file's own `schemes` block (Hat Yai, Rangsit, DDPM, BMA canal thresholds all carry both a categorical label AND, where available, a numeric edge, kept as two separate fields)"
    toledo_status: "not a Toledo equation — a categorical mapping rule"

# =================================================================================================
# unified_ladder — FloodConnect's OWN language, per founder's "เอาเกณฑ์ ... มาวางเพื่อสร้างเกณฑ์รวม
# เดียวกันในภาษาของเรา". THIS IS A MAPPING, NOT NEW NUMBERS. Every rung cites PROP-FLOOD-06's own
# L0-L5/LR tier ladder (toledo-wt-flood06/docs/proposals/PROP-FLOOD-06.md) and the T7-T0 action
# labels (thailand_flood_kg/docs/T7_T0_DATA_PLAN.md), and shows, per quantity family, which agency
# level lands on that rung in the agency's OWN words. Where agencies disagree for the same rung, ALL
# are kept and the earliest/strictest (worst-case) is marked explicitly — never averaged.
# =================================================================================================
unified_ladder:
  _meta:
    numbers_source: "every numeric edge below is copied from the `schemes` block above (or is PROP-FLOOD-06's own already-declared S_H/T_act edges) — this block adds NO new number of its own except where explicitly marked ข้อเสนอ (proposal, not yet decided)"
    tier_source: "toledo-wt-flood06/docs/proposals/PROP-FLOOD-06.md — L0..L5, LR (refused); T_act/S_H bands"
    action_label_source: "thailand_flood_kg/docs/T7_T0_DATA_PLAN.md — PREPARE(L0-L1)/READY(L1-L2)/ACTIVATE(L2-L3)/EARLY_MOVE(L3-L4)/RESPONSE(L4-L5/LR)"
    banned_words_avoided: ["ไม่ต้อง", "ห้าม", "ไม่ควร", "ผ่อนคลาย"]

  rungs:
    - rung: L0
      action_label: PREPARE
      resident_wording_th: "ติดตามข่าวตามปกติ"
      global_layer_at_this_rung: {cap: "Minor/Future/Possible (proposal)", meteoalarm: "green (proposal)", glofas: "OPEN — no value held", google_flood_hub: "ปกติ (cross-check only)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD white/ปลอดภัย 0-35.0 (VERIFIED-transcription)", "TMD เล็กน้อย/ปานกลาง 0.1-35.0 (RELAYED)"]
          worst_case_first: "n/a — this rung is the lowest, no disagreement to arbitrate"
        rain_mm_h: {agency_levels: ["BMA period1/2 normal band 10-60/60-90 (VERIFIED)"]}
        canal_river_level: {agency_levels: ["below any agency's own 'เตือนภัย'/warning line (VERIFIED, per-structure)"]}
        discharge_vs_bankfull: {agency_levels: ["well below coped_max (e.g. C.13 < 2,800 m3/s, RELAYED historical evidence, not an agency declaration)"]}
        reservoir_percent: {agency_levels: ["OPEN — no confirmed denominator (see R6)"]}
        official_declaration: {agency_levels: ["Rangsit: no level declared", "Hat Yai: เขียว/no flag", "DDPM: no ประกาศ"]}

    - rung: L1
      action_label: "PREPARE → READY"
      resident_wording_th: "เตรียมของที่ย้ายง่าย"
      global_layer_at_this_rung: {cap: "Minor/Future/Possible (proposal)", meteoalarm: "yellow (proposal)", glofas: "OPEN — no value held (candidate: 2y exceedance, proposal)", google_flood_hub: "ปกติ (cross-check only)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD risk-map yellow 35.1-65.0 (VERIFIED-transcription)", "TMD descriptive หนัก lower edge 35.1 (RELAYED) — CONSISTENT, same number"]
          worst_case_first: "both agree at 35.1 — no disagreement"
        rain_mm_h: {agency_levels: ["FORECAST_RAIN_72H_EXCEEDS promoter tier per PROP-FLOOD-06 (deliberately lowest tier, a watch signal only)"]}
        canal_river_level: {agency_levels: ["Rangsit: below level-1 in-gate 2.40m", "BMA canal: below 'เตือนภัย'"]}
        discharge_vs_bankfull: {agency_levels: ["ratio < ~0.75 of coped_max (INSTINCT interpolation of PROP-FLOOD-06 S_H<0.3 band — ข้อเสนอ, ยังไม่ลง Toledo / รอผู้ก่อตั้งตัดสิน"]}
        reservoir_percent: {agency_levels: ["OPEN"]}
        official_declaration: {agency_levels: ["DDPM: เฝ้าระวัง (RELAYED, no numeric edge)", "Hat Yai group: น้ำเงิน (RELAYED, qualitative)"]}

    - rung: L2
      action_label: READY
      resident_wording_th: "ย้ายของ ตรวจทางน้ำเข้าบ้าน"
      global_layer_at_this_rung: {cap: "Moderate/Expected/Likely (proposal)", meteoalarm: "yellow (proposal)", glofas: "OPEN — no value held (candidate: 2-5y exceedance, proposal)", google_flood_hub: "ปกติ→อันตราย boundary (cross-check only)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD risk-map orange 65.1-125.0 (VERIFIED-transcription)"]
          worst_case_first: "n/a, single scheme for this axis at this rung"
        rain_mm_h: {agency_levels: ["BMA CANAL_AT_WARNING_LINE-style promoter", "BMA period abnormal-weather quote '>90 มม./ชม.' (VERIFIED) — NOTE: this text-quote edge (90.1) sits ABOVE this rung's own mm/24h-mapped orange band; kept as a separate axis per the no-cross-unit-conversion rule (R1/R3), not reconciled numerically here"]}
        canal_river_level: {agency_levels: ["BMA canal: at 'เตือนภัย' (worked example ปตร.แสนแสบ 0.50 m MSL, VERIFIED)", "Rangsit level 1 เฝ้าระวัง 2.40-2.60m in-gate (VERIFIED)"]}
        discharge_vs_bankfull: {agency_levels: ["RID C.29B approaching but below 3,500 critical (RELAYED)"]}
        reservoir_percent: {agency_levels: ["OPEN"]}
        official_declaration: {agency_levels: ["DDPM: แจ้งเตือน (RELAYED)", "Rangsit: level 1 เฝ้าระวัง (VERIFIED)", "Hat Yai group: เหลือง (RELAYED)"]}
      bangkok_specific_override:
        note: "BMA design capacity 80 mm/24h (VERIFIED) sits INSIDE the TMD orange band (65.1-125.0) -- for BMA drainage units, the rung meaning 'exceeds the drainage system's own design capacity' starts at 80, not at the TMD-wide red edge (125.1). This is a per-unit override for BMA-governed units only, sourced VERIFIED (BMA plan 2569 p63), NOT a change to the TMD scheme itself."
        applies_to: "BMA drainage sub-polder units only (not province-wide TMD reading)"

    - rung: L3
      action_label: ACTIVATE
      resident_wording_th: "ยืนยันเส้นทาง จุดปลอดภัยที่ตรวจแล้ว"
      global_layer_at_this_rung: {cap: "Severe/Expected/Likely (proposal)", meteoalarm: "orange (proposal)", glofas: "OPEN — no value held (candidate: 5y exceedance, proposal)", google_flood_hub: "อันตราย (cross-check only, per card §4)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD risk-map red 125.1-250.0 (VERIFIED-transcription)", "BMA design-capacity exceedance >=80 for BMA units (VERIFIED, per bangkok_specific_override above) — EARLIEST/STRICTEST trigger for BMA units specifically"]
          worst_case_first: "for a BMA drainage unit: 80 (BMA design) is STRICTER (fires earlier) than 125.1 (TMD red) -- BMA's own 80 is reported as the worst-case/earliest trigger for that unit, TMD red kept alongside as the province-wide reading, never averaged"
        rain_mm_h: {agency_levels: ["BMA RAIN_24H_EXCEEDS_DESIGN promoter (>80mm/24h, min tier L3 per PROP-FLOOD-06)", "DDS KPI 100 mm/h boundary (VERIFIED, a service-level target, not itself an alert)"]}
        canal_river_level: {agency_levels: ["BMA CANAL_AT_CRITICAL_LINE-style promoter (min tier L4 per PROP-FLOOD-06 -- NOTE: this specific promoter's OWN min tier is L4, shown here only to locate it on the agency axis; the ladder rung assignment follows PROP-FLOOD-06's own promoter table, not re-derived)", "Rangsit level 2 ปานกลาง 2.60-2.90m (VERIFIED)"]}
        discharge_vs_bankfull: {agency_levels: ["ratio approaching 1.0 (S_H approaching flooded_min, PROP-FLOOD-06 L3 band 0.9<=S_H<1.2)"]}
        reservoir_percent: {agency_levels: ["OPEN"]}
        official_declaration: {agency_levels: ["Rangsit level 2 ปานกลาง (VERIFIED)"]}

    - rung: L4
      action_label: EARLY_MOVE
      resident_wording_th: "ย้ายกลุ่มเปราะบางออกทางที่ยืนยันแล้ว"
      global_layer_at_this_rung: {cap: "Severe/Immediate/Likely (proposal)", meteoalarm: "orange→red boundary (proposal)", glofas: "OPEN — no value held (candidate: 5-20y exceedance, proposal)", google_flood_hub: "อันตราย/อันตรายมาก boundary (cross-check only)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD risk-map red upper region approaching 250.0 (VERIFIED-transcription, no separate agency edge inside red band)", "26 Sep 2026 observed 203-205 mm/24h at three BKK stations sits inside TMD red (125.1-250.0) -- observed event, not a declared agency edge, kept as historical evidence (VERIFIED, sources/coping_thresholds.yaml)"]
        rain_mm_h: {agency_levels: ["BMA period3 quote '>90 มม./ชม.' explicit abnormal-weather wording (VERIFIED)"]}
        canal_river_level:
          agency_levels: ["BMA canal วิกฤติ (worked example 0.60 m MSL, VERIFIED)", "Rangsit level 3 วิกฤต >=3.00m in-gate (VERIFIED, explicit 'ประตูน้ำป้องกันไม่ได้' quote)", "Chao Phraya BMA river +2.00 m MSL failure line (VERIFIED, explicit 'อาจทำให้การป้องกันน้ำท่วมไม่ได้ผล' quote) -- EARLIEST/STRICTEST trigger for river-facing units"]
          worst_case_first: "the +2.00 m MSL river-failure line is BMA's own most explicit 'danger' quote in the whole crosswalk -- reported as the strictest trigger on this axis"
        discharge_vs_bankfull: {agency_levels: ["RID C.29B at or above 3,500 critical (RELAYED)", "C.13 historical flooded_min 3,721 m3/s (RELAYED, evidence not declaration)"]}
        reservoir_percent: {agency_levels: ["OPEN"]}
        official_declaration: {agency_levels: ["Hat Yai red flag (9.30 X.90 / +16.4 X.173A / >300mm-3day / >200mm-day, RELAYED)", "Rangsit level 3 วิกฤต (VERIFIED)", "Hat Yai group ส้ม (RELAYED)"]}

    - rung: "L5 / LR"
      action_label: RESPONSE
      resident_wording_th: "ออกจากพื้นที่ทางที่ปลอดภัยตอนนี้"
      global_layer_at_this_rung: {cap: "Extreme/Immediate/Observed (proposal)", meteoalarm: "red (proposal)", glofas: "OPEN — no value held (candidate: 20y exceedance, proposal)", google_flood_hub: "อันตรายมาก (cross-check only, per card §4)"}
      quantity_families:
        rain_mm_24h:
          agency_levels: ["TMD risk-map purple >250.0 (VERIFIED-transcription, open upper edge, R7 REFUSED-no-infinity applies)", "TMD descriptive หนักมาก >=90.1 kept as a DIFFERENT scheme (RELAYED) -- not merged onto this same numeric edge, per the founder's own instruction not to merge schemes"]
        rain_mm_h: {agency_levels: ["PUMPS_ZERO_RUNNING_ABOVE_THRESHOLD promoter (0 pumps running AND level >= critical, min tier L5 per PROP-FLOOD-06)"]}
        canal_river_level: {agency_levels: ["BMA CANAL_AT_BANK_LEVEL promoter (min tier L5, no remaining headroom by definition)", "Rangsit level 4 รุนแรง -- structural failure, not a water-level number (VERIFIED)"]}
        discharge_vs_bankfull: {agency_levels: ["min(D_H,R_H)=0 AND F_H(U)>0 per PROP-FLOOD-06 L5 pre-check (system already exceeded)"]}
        reservoir_percent: {agency_levels: ["candidate 'เกินความจุเก็บกัก' >100% (RELAYED, unconfirmed origin -- see hii_storage_percent_bands_candidate)"]}
        official_declaration: {agency_levels: ["Hat Yai group แดง ('น้ำท่วมแล้ว ทุกคนอยู่ในที่ปลอดภัย ไม่มีการอพยพ', RELAYED)", "DDPM: อพยพ (RELAYED)", "Rangsit level 4 รุนแรง (VERIFIED)"]}

    - rung: LR
      action_label: "RESPONSE (refused readout)"
      resident_wording_th: "ใช้ข้อมูลสดล่าสุดเท่านั้น ระบบนี้ไม่มีข้อมูลตอนนี้"
      quantity_families:
        note: "LR dominates every numeric level per PROP-FLOOD-06 (no cov(U) component present/inferable) -- not a quantity family mapping, a refusal state. No agency scheme maps onto LR; it is FloodConnect's own data-availability state."

  cross_agency_disagreement_note: >
    Where the SAME nominal rung has more than one agency edge on the SAME axis (e.g. L2/L3 rain
    mm/24h: TMD orange 65.1 vs BMA design-exceedance 80 for BMA units), BOTH are kept, and the
    numerically EARLIEST (strictest, worst-case) one is the one FloodConnect's own rung fires on
    for that specific unit type -- per the founder's explicit worst-case-first rule. No edge here
    was invented by this check; every number is a direct copy from the `schemes` block above.

  global_layer:
    _meta: >
      Founder instruction (verbatim, 2026-09-27): "ทำให้ระบบภาษาอันตรายหรือเกณฑ์ในภาษาของเราเชื่อมได้หมด
      ตั้งแต่โมเดลระดับโลก ถึงองค์กร กรมต่างๆ" -- adds a global-model layer on top of the national/agency
      rungs above, via R10 (return-period -> rung, same station/reach only) and R11 (CAP-style
      categorical mapping only, never numeric). Every rung-mapping in this block is explicitly a
      PROPOSAL/INSTINCT unless a specific tag says otherwise -- the founder decides, this check does
      not silently adopt any of these as settled.
    systems:
      - system_id: cap_common_alerting_protocol
        name: "Common Alerting Protocol (CAP), WMO/OASIS standard vocabulary"
        tag: RELAYED
