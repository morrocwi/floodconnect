# Founder question (verbatim, 2026-09-27): "สกัดเกณฑ์หน่อยว่า กรมอุตุฯ เค้าแบ่งเกณฑ์ฝนเป็นสีต่างๆ ยังไง
# ด้วยหน่วยอะไร และสอดคล้องกับอย่างอื่นไหม" + "เช่นเกณฑ์ของกรมชลฯ หรือเกณฑ์ของ ปภ. และเกณฑ์ของ กทม. หรือจังหวัด"
# Follow-up (verbatim): "ว่าตัวเลขเหล่านี้อันตราย" -> every level below carries a `danger_meaning`
# field, quoted from the agency's own wording, never our paraphrase.
# Follow-up (verbatim): "เอาเกณฑ์ของ กรมชล อุตุ ปภ กทม จังหวัด มาวางเพื่อสร้างเกณฑ์รวมเดียวกันในภาษาของเรา"
# -> `unified_ladder` block (mapping only, not new numbers).
# Follow-up (verbatim): "สร้างกฎแปลงเพื่อให้เกณฑ์ชัด" -> `conversion_rules` block.
#
# WRITE SCOPE: this file + docs/knowledge/RAIN_ALERT_THRESHOLDS_CROSS_AGENCY_2026-09-27.md are the
# only two files this check wrote. No tracked file edited, no commit, no build, no collect.py run.
#
# Web fetch budget: <=8 fetches total, one request per URL, no retries, official sources only
# (tmd.go.th, rid.go.th, disaster.go.th, bangkok.go.th, thaiwater.net/hii.or.th, onwr.go.th).
# Fetches actually made this check (see docs card §0 for the full log): tmd.go.th (FAILED, TLS cert
# error, same failure mode already recorded elsewhere in this repo, NOT retried) / ndwc.disaster.go.th
# (redirected, not re-fetched, NOT retried) / wmsc.rid.go.th (200, no numeric criteria on the page
# itself) / thaiwater.net/water/wl (200, page shell only, no criteria text extracted). Every other
# agency row below is built from this repo's OWN already-collected primary sources (BMA plan 2569
# PDF text, HII API sample payload, Hat Yai/Rangsit government-plan cards) or from WebSearch snippets,
# tagged RELAYED (secondary, not independently re-verified by this check's own primary fetch).
#
# Tags: VERIFIED (this repo's own primary-source extraction, cited) / RELAYED (secondary source,
# WebSearch snippet, or another repo file's own RELAYED tag) / MEASURED (a live API sample this repo
# read directly) / INSTINCT (a judgement call) / OPEN (no source found, or found-and-not-fetchable).

