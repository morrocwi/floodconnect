    url: "https://tiwrm.hii.or.th/DATA/REPORT/php/chart/chaopraya/2013/20241004_chaopraya_chart_edit.png"
    page: "https://tiwrm.hii.or.th/DATA/REPORT/php/chart/chaopraya/2013/chaopraya.php"
    fetched_utc: "2026-09-28"
