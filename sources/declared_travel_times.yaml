# ------------------------------------------------------------------ paths to Bangkok
# For each upstream node: the ordered downstream path to the Bangkok receiving node as KG
# node ids, with a per-hop window. A later worker can walk `hops` to flag every node
# downstream of an L5 / structural-failure node, with its arrival window (cumulative).
# `envelope_h` = union of the declared and measured rows for that hop (never an average).
# A hop with window null => everything downstream of it is REFUSED TAU_UNDECLARED
# (still list the nodes: an L5 flag can propagate by topology even where timing is refused).
# Two variants for the main stem below C.13: `declared_hops` (C.13 -> C.29A -> C.4) and
# `measured_hops` (C.13 -> C.7A -> C.35 -> C.12). Cumulative windows use the
# `bangkok_window_h` line, which takes C.13 -> Bangkok = [84, 96] h = union of declared
# 84 h (60 + 24) and the single measured 96 h (n=1, weak).
receiving_node_mvp:
  declared: {label: "C.4 สะพานพุทธ", kg: null, note: "KG_ABSENT"}
  measured: {label: "C.12 สามเสน", kg: "node:gauge:thaiwater_waterlevel:C.12"}

paths:
  node:gauge:thaiwater_waterlevel:C.13:
    declared_hops:
      - {to: "node:gate:hii_watergate:46", window_h: [60, 60], rows: [dec_c13_to_c29a]}
      - {to: "KG_ABSENT:C.4", window_h: [24, 24], rows: [dec_c29a_to_c4]}
    measured_hops:
      - {to: "node:gauge:thaiwater_waterlevel:C.7A", window_h: [10, 25], rows: [mea_c13_to_c7a]}
      - {to: "node:gauge:thaiwater_waterlevel:C.35", window_h: [1, 23], rows: [mea_c7a_to_c35]}
      - {to: "node:gauge:thaiwater_waterlevel:C.12", window_h: null, state: "REFUSED TAU_UNDECLARED", rows: [mea_c35_to_c12]}
    bangkok_window_h: [84, 96]
    bangkok_basis: "envelope of declared 84 h (dec_c13_to_c29a + dec_c29a_to_c4) and measured 96 h (mea_c13_to_c12, n=1)"
  node:gauge:thaiwater_waterlevel:C.2:
    hops:
      - {to: "node:gauge:thaiwater_waterlevel:C.13", window_h: [12, 24], rows: [dec_c2_to_c13, mea_c2_to_c13], envelope_h: [12, 24]}
      - {then: "node:gauge:thaiwater_waterlevel:C.13 path"}
    bangkok_window_h: [96, 120]
  node:gauge:thaiwater_waterlevel:N.67:
    hops:
      - {to: "node:gauge:thaiwater_waterlevel:C.2", window_h: [6, 6], rows: [dec_n67_to_c2], tag: "INSTINCT-endpoint"}
      - {then: "node:gauge:thaiwater_waterlevel:C.2 path"}
    bangkok_window_h: [102, 126]
  node:gauge:thaiwater_waterlevel:P.17:
