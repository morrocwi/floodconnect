# declared_travel_times.yaml -- per-edge travel time (delay d_e) for every upstream control
# node that drains to Bangkok, plus the ordered downstream path of each node to Bangkok.
#
# Written 2026-09-28 for the founder request (verbatim): "หมายถึง กทม. หาว่าน้ำจาก KG graph
# ใน node ของเขื่อนต่างๆ จะมาถึง กทม. เมื่อไหร่ น้ำเหนือ เพราะถือเป็นหนี้สำคัญ".
# Read with docs/knowledge/INBOUND_DEBT_ARRIVAL_TIMES_2026-09-28.md (answer + reasoning).
#
# Rules this file follows (Toledo PROP-FLOOD-09 v1.1, toledo-wt-flood08,
# docs/proposals/PROP-FLOOD-09.md -- itself NEW DERIVATION / PROPOSAL, tier Dr, unverified):
#   - d_e is DECLARED (an official agency publication) or MEASURED (this repo's own data,
#     tools/backtest/lag_estimate.py) -- never derived, never assumed;
#   - an edge with neither has delay_min_h/delay_max_h = null and
#     state REFUSED / reason TAU_UNDECLARED -- never 0;
#   - no averaging across sources: one row per (edge, source). Where two sources cover the
#     same edge, `envelope_h` in `paths:` is the union [min of mins, max of maxes], and the
#     row says so -- a union is not an average;
#   - tick = 1 hour (integer hours; the declared "2.5 วัน" = 60 h is already integral, so
#     PROP-FLOOD-09's OPEN rounding rule is not triggered by any row here).
#
# Tag vocabulary (AGENTS.md §2): VERIFIED / MEASURED / RELAYED / INSTINCT / OPEN.
#   "VERIFIED-visual" = the label text and both bracket end-arrows were read by eye from
#   the archived official image (HII chart) this check -- the image, not an OCR, not a
#   memory. "INSTINCT-endpoint" = the label and one end are read, but the OTHER end is a
#   tick mark that does not sit on a labelled station; the station named is the nearest
#   one drawn beside the tick (judgement).
#
# Equations: the path window = element-wise sum of per-edge [min, max] (Δ1 of PROP-FLOOD-09
# composed edge by edge over storage-free junctions). That interval sum is **not yet in
# Toledo** as a registered form (composition only; see the doc §6). No other formula here.

sources:
