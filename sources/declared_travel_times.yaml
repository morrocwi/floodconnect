    what: >
      Static background image of HII's Chao Phraya diagram (file name dated 2024-10-04,
      "edit"). Travel-time labels are drawn as RED BRACKET LINES with an arrow at each end,
      so the image itself shows which two points each label spans (unlike the SVG below).
      Values are single numbers, not flow-conditioned, not dated per value.
    tag: "VERIFIED-visual (labels + bracket ends read from the image)"
  hii_waterchart_svg:
    agency: "HII (สสน.)"
    url: "https://waterchart.thaiwater.net/assets/svg/chaophraya/chaophraya.svg"
    fetched_utc: "2026-09-28"
    archived: "raw/backtest/lag_2026-09-28/chaophraya.svg (gitignored raw)"
    what: >
      <g id="Days"> holds 11 bare <text> elements (2 วัน, 1 วัน, 3 วัน, 6 ชม., 2 วัน, 2 วัน,
      20 ชม., 2.5 วัน, 1 วัน, 1 วัน, 1 วัน) with a transform position only -- no id, no
      data attribute, no link to any station group. VERIFIED by reading the SVG: the
      structure does NOT prove any pair. Pairing below is by nearest-node geometry against
      the station icons, cross-checked with the PNG layout -> INSTINCT.
    tag: "VERIFIED (text + structure); pairing INSTINCT"
  lag_estimate_2026-09-28:
    agency: "this repo (measured from HII api-v3 waterlevel_graph history)"
    url: "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_graph (station_type=tele_waterlevel, 2025-09-29..2026-09-28, one request per station)"
    archived: "raw/backtest/lag_2026-09-28/*_2025-09-29_2026-09-28.json + lag_results.json (gitignored raw)"
    method: >
      tools/backtest/lag_estimate.py: hourly grid, 25-h centred running mean on both series,
      rising limbs of the upstream series (24-h rise, min_rise per pair), per-event lag =
      argmax Pearson r of first differences over lag 0..max_lag h; r < 0.5, boundary lag, or
      truncated-at-record-start events are UNRESOLVED and not used. Procedures not yet in
      Toledo (marked in the code).
    caveat: >
      Lag varies with flow (wave speed changes with discharge) and, at tidal stations, with
      the tide; C.13 is a gate-controlled barrage, so C.2->C.13 partly reflects RID
      operations, not free travel. Reported as [min, max] over events, never averaged.
    tag: MEASURED

