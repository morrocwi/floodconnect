# Source registry for the Sammakorn live flood-context data system.
#
# This is a REGISTRY, not a claim of quality. `trust_tier` and `method` are this codebase's
# own engineering judgment calls (INSTINCT/Dr-tier classification), not a certification
# from any agency. Thai flood/water agencies run independent, sometimes-disagreeing systems
# (project ruling: "ประเทศไทยมีหลายหน่วยงานที่ทำงานแข่งกันและไม่สอดคล้องกัน") -- this
# registry exists so every reading downstream can be traced back to which agency said it,
# by what method, and how fresh/likely-to-be-current the entry below still is.
#
# trust_tier vocabulary (fixed, do not invent new values without updating this comment):
#   official_telemetry        -- a government agency's own sensor/instrument reading,
#                                 machine-recorded, no human compilation step in between.
#   official_report           -- a government agency's own compiled report/bulletin/table
#                                 (may itself aggregate telemetry from official_telemetry
#                                 sources, plus human-written narrative/forecast).
#   official_shared_inference -- a government office's own inference from a THIRD-PARTY
#                                 signal it does not operate (e.g. reading traffic-map
#                                 colour as a flood proxy) and shares it as guidance.
#   third_party                -- not a government agency at all. (No source below uses
#                                 this tier yet; kept in the vocabulary for future sources.)
#   community_report           -- a private individual's own account (a public social-media
#                                 post, or a message pasted into a community group), not an
#                                 agency, not an instrument, not a compiled report. A row
#                                 FROM this source whose own publisher is a media outlet
#                                 (JS100/อีจัน/Rodee-style page, not a person) is stored at
#                                 the row level as official_shared_inference instead, via
#                                 that row's own `publisher_type` field in provenance_json --
#                                 the registry-level tier below is the DEFAULT for a person's
#                                 own post, not a blanket tier for every row this source ever
#                                 produces. See `social_listening.py`.
#
# host_rule.max_requests_per_run enforces this workspace's BMA host-safety rule: at most ONE
# request per URL per run on weather.bangkok.go.th / dds.bangkok.go.th, no retry loops,
# stop touching a host on 403/reset. api-v3.thaiwater.net (HII/สสน.) is a different agency
# and is not subject to that specific BMA rule, but collect.py still makes only one
# request per source per run everywhere in this repo -- there is no retry path anywhere.

sources:
  - id: thaiwater_canal_waterlevel
    agency:
      th: "สำนักการระบายน้ำ กรุงเทพมหานคร (ผ่าน HII/สสน. thaiwater.net)"
      en: "Department of Drainage and Sewerage, BMA (republished via HII/thaiwater.net)"
    url: "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/canal_waterlevel"
    method: GET
    cadence: near-real-time (station refresh interval not published; observed multiple
      distinct canal_datetime values across one snapshot)
    format: json
    auth: none
    licence_status:
      text: "RELAYED, not independently confirmed against a formal licence text -- no
        terms/licence link was found in thaiwater.net/bma's footer during the 2026-09-26
        check. Re-check thaiwater.net's actual terms before any public/commercial
        redistribution."
      unresolved: true
    trust_tier: official_telemetry
    max_age_hours: 24
    host_rule:
      max_requests_per_run: 1
      notes: "api-v3.thaiwater.net is HII/สสน., not a BMA host -- this workspace's strict
        weather.bangkok.go.th/dds.bangkok.go.th rule doesn't name this host, but this
        repo still makes only one GET per run here, no retries."
    last_status: {date: "2026-09-26", http: 200, note: "282 BMA canal-station records,
      real canal_lat/canal_long, warning/critical/bank thresholds present."}
    variables: [canal_water_level_m, warning_level_m, critical_level_m, bank_level_m,
      canal_out_m (gate stations only)]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: union(local,origin)
    contract_test: tests/contract/test_thaiwater_canal_waterlevel.py
    health_check: "not_applicable -- kb.py has no healthcheck subcommand yet (design M3, open item); the contract_test above replays a captured real response through the production parser, which is a contract-conformance check, not a health check"

  - id: thaiwater_flood_road
    agency:
      th: "สำนักการระบายน้ำ กรุงเทพมหานคร (ผ่าน HII/สสน. thaiwater.net) -- อ้างอิง"
      en: "Department of Drainage and Sewerage, BMA (republished via HII/thaiwater.net) --
        RELAYED"
    url: "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/flood_road"
    method: GET
    cadence: unknown -- not yet observed across two fetches
    format: json
    auth: none
    licence_status: {text: "Same relayed/unconfirmed licence note as
      thaiwater_canal_waterlevel -- not independently re-checked for this endpoint
      specifically.", unresolved: true}
    trust_tier: official_telemetry
    max_age_hours: 24
    # Confirmed 2026-09-26 by one real fetch (262 records): station.floodroad_lat/_long
    # are real coordinates, floodroad_oldcode mirrors canal_oldcode's "FL.<area>.<n>"
    # scheme, and floodroad_value ranges 0-35.6 across the sample (212 at exactly 0) --
    # read as MEASURED (Dr-tier engineering judgment, not confirmed against BMA's own
    # unit label) flood-depth in cm at a fixed road point, same telemetry shape as
    # canal_waterlevel's canal_value, not a human-compiled list.
    host_rule: {max_requests_per_run: 1, notes: "Same host as thaiwater_canal_waterlevel."}
    last_status: {date: "2026-09-26", http: 200, note: "262 records, 0 missing
      coordinates. See parsers.py::parse_thaiwater_flood_road for the exact field
      mapping confirmed against this live response."}
    variables: [floodroad_value_cm]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: union(local,origin)
    contract_test: "tests/contract/test_wp2_additional_sources.py"
    health_check: "not_applicable -- kb.py has no healthcheck subcommand yet (design M3, open item); the contract_test above replays a captured real response through the production parser, which is a contract-conformance check, not a health check"

  - id: thaiwater_rain_24h
    agency:
      th: "กรมชลประทาน/สถาบันสารสนเทศทรัพยากรน้ำ (สสน.) -- ผ่าน thaiwater.net"
      en: "Royal Irrigation Department / Hydro-Informatics Institute (HII/สสน.), via
        thaiwater.net"
    url: "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h"
    method: GET
    cadence: unknown -- not yet observed across two fetches
    format: json
    auth: none
    licence_status: {text: "Same relayed/unconfirmed licence note as
      thaiwater_canal_waterlevel -- not independently re-checked for this endpoint
      specifically.", unresolved: true}
    trust_tier: official_telemetry
    # Documented explicitly (2026-10-03, ): this already fell back to
    # live_water_level.STALE_HOURS (24h) when this field was absent -- stated here
    # instead, same figure, so a reader doesn't have to know that fallback exists.
    # Matches the "rain 24h" variable-class default already used by kb.py's own
    # 24h forecast-staleness rule (_FORECAST_STALE_AFTER_S); not a new cutoff.
    max_age_hours: 24
    # Added 2026-09-26: CI had no rain collector at all, so the
    # rain tile always fell back to raw/gapfill/rain_24h*.json, a one-time manual snapshot
    # that goes stale forever. This collector writes a fresh raw/live/thaiwater_rain_24h/
    # snapshot every run; build_data.py reads that dir first and only falls back to the
    # gapfill snapshot if the live collector hasn't run yet or failed this run.
    host_rule: {max_requests_per_run: 1, notes: "Same host as thaiwater_canal_waterlevel."}
    last_status: {date: "2026-09-26", http: null, note: "not yet run live in this
      environment -- shape confirmed against the existing raw/gapfill/rain_24h_1.json
      manual snapshot (4282 stations, rain_24h/rainfall_datetime/station lat-long
      fields) from the same API family."}
    # TODO #181 (2026-09-28): confirmed against a real raw/live/thaiwater_rain_24h/*.json
    # payload (4439 records, station_type uniformly "rainfall_24h") that the response also
    # carries a `rain_1h` field alongside `rain_24h` -- NO rain_3h/6h/12h field exists
    # anywhere in this API family, MEASURED by inspecting every record's key set. Both
    # windows end at the same `rainfall_datetime` timestamp; the exact window-start/end
    # semantics are not independently verified against a written thaiwater.net API spec
    # (none found), so "rolling window ending at rainfall_datetime" is RELAYED/assumed from
    # the field name, same as the existing rain_24h note above. `rain_1h` is absent on
    # ~12% of records (539/4439 checked) -- stored only when present, never fabricated.
    variables: [rain_24h_mm, rain_1h_mm]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: union(local,origin)
    contract_test: "tests/contract/test_wp2_additional_sources.py"
    health_check: "not_applicable -- kb.py has no healthcheck subcommand yet (design M3, open item); the contract_test above replays a captured real response through the production parser, which is a contract-conformance check, not a health check"

  - id: thaiwater_waterlevel
    agency:
      th: "สถาบันสารสนเทศทรัพยากรน้ำ (สสน.) และหน่วยงานเจ้าของสถานี -- ผ่าน thaiwater.net"
      en: "Hydro-Informatics Institute (HII) and per-station owning agency, via
        thaiwater.net"
    url: "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel"
    method: GET
    cadence: near-real-time (waterlevel_datetime varies per station)
    format: json
    auth: none
    licence_status: {text: "Same relayed/unconfirmed licence note as
      thaiwater_canal_waterlevel -- not independently re-checked for this endpoint
      specifically.", unresolved: true}
    trust_tier: official_telemetry
    # collect.py collector added 2026-09-27 (founder priority A3: "HII/thaiwater
    # waterlevel nationwide is listed as 'no collector implemented' -- implement it")
    # -- see collect.collect_thaiwater_waterlevel + parsers.parse_thaiwater_waterlevel.
    # Added 2026-09-27, founder ask: "เราได้พิกัด แม่น้ำ เขื่อน ที่สูบน้ำ คลอง หรืออื่นๆ
    # ครบหรือยัง" -- this is the nationwide fill for river/canal telemetry gauges
    # (station_type "tele_waterlevel"), sibling to canal_waterlevel/rain_24h on the same
    # host+family. Discovered by probing candidate `public/<id>` service ids on this
    # host (max 6 probes per this check's network rule): `dam_daily`, bare `public`, and
    # `dam_medium`/`dam`/`waterlevel_dam` all returned HTTP 404 "Unknown service id" --
    # only `waterlevel` (this entry) returned data. No dedicated dam-reservoir endpoint
    # was found on this host within budget; see docs/ASSETS.md's probe log. Several
    # station names contain "เขื่อน" (e.g. ท้ายเขื่อนเจ้าพระยา) but these are river gauges
    # sited near a dam, not the dam/reservoir asset itself -- stored as class `gauge`.
    host_rule: {max_requests_per_run: 1, notes: "Same host as thaiwater_canal_waterlevel;
      one GET per run, no retries."}
    last_status: {date: "2026-09-27", http: 200, note: "804 nationwide telemetry
      water-level stations, real tele_station_lat/tele_station_long, spans all RID
      regions/basins (basin field present per row)."}
    variables: [waterlevel_msl, storage_percent, discharge]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: local
    contract_test: "tests/contract/test_wp2_additional_sources.py"
    health_check: "not_applicable -- kb.py has no healthcheck subcommand yet (design M3, open item); the contract_test above replays a captured real response through the production parser, which is a contract-conformance check, not a health check"

  - id: rid_res_table
    agency:
      th: "กรมชลประทาน"
      en: "Royal Irrigation Department"
    url: "http://water.rid.go.th/flood/flood/res_table.htm"
    method: GET
    cadence: static (page last touched ~2008 based on embedded chart-image paths;
      served live, but the dam list itself does not appear to change run over run)
    format: html (windows-874/cp874 encoded)
    auth: none
    licence_status: {text: "RELAYED, not independently confirmed against a formal
      licence text.", unresolved: true}
    trust_tier: official_report
    # Collector added 2026-09-27 (founder ask, priority A5: "rid_res_table --
    # implement the parser if the page is parseable... it was marked no collector") --
    # see collect.collect_rid_res_table + parsers.parse_rid_res_table. The page
    # publishes NO coordinate or numeric reading anywhere, so this collector stores
    # each dam name as a `documents` row (region + name), never a fabricated
    # observation/coordinate.
    # Added 2026-09-27, same founder ask as thaiwater_waterlevel above (dam coverage).
    # Probed 2026-09-27: HTTP 200, decodes as cp874, and names 33 large dams grouped by
    # RID region (ภาคเหนือ/ตะวันออกเฉียงเหนือ/กลาง/ตะวันตก/ตะวันออก/ใต้) with links to
    # historical level-chart JPGs -- but the page publishes NO coordinate anywhere
    # (checked by reading the full decoded HTML, not assumed). Per this check's
    # no-guessing rule, every dam from this source is stored class=dam, tag=OPEN,
    # lat/lon=None -- names only, never geocoded.
    host_rule: {max_requests_per_run: 1, notes: "One GET per run, no retries (this
      workspace's blanket no-retry discipline; water.rid.go.th is not itself covered
      by the BMA-specific host rule, but the same one-shot posture applies)."}
    last_status: {date: "2026-09-27", http: 200, note: "33 dam names across 6 RID
      regions; no lat/lon field anywhere on the page."}
    variables: [dam_name_th]

  # Probed 2026-09-27, same founder ask -- neither of these two candidates yielded
  # ingestable content within this check's probe budget, so neither has real rows in
  # `assets_registry.py`; kept here as a registry-level record of what was tried
  # (see docs/ASSETS.md probe log for the raw HTTP detail):
  #   - hydro-5.rid.go.th (RID central-region hydrology centre): root + navigation.html
  #     + page1.html all returned HTTP 200, but are a 2000s-era frameset menu shell --
  #     no station list or coordinate reachable within the 4-probe RID budget (would
  #     need to follow several more menu links to reach an actual station table, if
  #     one exists at all as structured data rather than a PDF/image).
  #   - dds.bangkok.go.th (BMA tunnels, อุโมงค์ระบายน้ำ): the site root and a guessed
  #     detail-page URL both returned HTTP 302 redirects into a session-cookied dynamic
  #     CMS path (/content/specialnews/detail.php?...); no tunnel page content was
  #     reached within the 3-probe budget. The one BMA tunnel this repo already knows
  #     of (อุโมงค์พระราม 9-รามคำแหง) stays on the OPEN list via `hand_declared_open()`
  #     in assets_registry.py -- not re-derived here, and no new tunnel was added.
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: local
    contract_test: "tests/contract/test_remaining_wired_sources.py"
    health_check: "not yet captured this check -- see tools/capture_source_sample.py"

  - id: bma_pumphistory
    agency:
      th: "สำนักการระบายน้ำ กรุงเทพมหานคร"
      en: "Department of Drainage and Sewerage, Bangkok Metropolitan Administration"
    url: "https://weather.bangkok.go.th/Station/PumpHistory"
    method: GET (server-rendered HTML table + embedded `var datapump` JS metadata array)
    cadence: unknown -- server-rendered "current status" page, refresh interval not
      published
    format: html
    auth: none
    licence_status: {text: "RELAYED -- no licence/terms text found on this page during
      the 2026-09-26 check.", unresolved: true}
    trust_tier: official_telemetry
    max_age_hours: 24
    host_rule:
      max_requests_per_run: 1
      notes: "weather.bangkok.go.th IS a BMA host under this workspace's strict rule. Confirmed
        2026-09-26: /Station/PumpHistory returns 200, but /Home and /Map on the SAME host
        returned 403 the same day -- treated as a per-path difference, never assumed to
        persist. /Klongmap/GetDataForUpdate on this host is also 403 (see bma_klongmap)."
    last_status: {date: "2026-09-26", http: 200, note: "ST.SPS.01-04 Sammakorn pump
      stations parsed with real lat/lon from the page's own datapump metadata array."}
    variables: [level_m, pumps_on, pumps_total, gate_open_m, station_status_th]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: union(local,origin)
    contract_test: MISSING
    health_check: "not yet captured this check -- see tools/capture_source_sample.py"

  - id: dds_daily_pdf
    agency:
      th: "สำนักการระบายน้ำ กรุงเทพมหานคร (ศูนย์ควบคุมระบบป้องกันน้ำท่วม)"
      en: "Department of Drainage and Sewerage, BMA -- daily situation bulletin"
    url: "https://dds.bangkok.go.th/public_content/files/001/0004901_1.pdf"
    method: "ONE GET only (timeout=300s socket-op timeout, not a curl-style total
      deadline), no HEAD first -- an earlier HEAD-then-conditional-GET shape could send
      two requests to this URL in one run (whenever the PDF had changed, or on the very
      first run before any snapshot existed), which is what host_rule below forbids;
      --from-file bypasses the network entirely for an already-downloaded copy"
    cadence: daily (issue number increments daily, e.g. ฉบับที่ 269/69 on 2026-09-26)
    format: pdf
    auth: none
    licence_status: {text: "RELAYED -- no licence/terms text checked for this specific
      file; same public-bulletin posture as the rest of dds.bangkok.go.th.", unresolved: true}
    trust_tier: official_report
    # This bulletin carries several variable classes (rain_24h_mm, qmax_* Chao Phraya,
    # tide_*, canal_level_0700_m) under one source_id -- a single daily bulletin, not one
    # cutoff per variable in this registry yet (OPEN, not invented here). The canal_level
    # rows already used `live_water_level.STALE_HOURS` (24h) before this field existed;
    # this value keeps that same existing cutoff for the whole source rather than widen
    # it, and is also the documented default for rain (no bulletin-specific rain cutoff
    # existed before this fix either -- same 24h figure `kb.py`'s `_FORECAST_STALE_AFTER_S`
    # already uses for hazard).
    max_age_hours: 24
    host_rule:
      max_requests_per_run: 1
      notes: "dds.bangkok.go.th is a BMA host under this workspace's strict rule. Confirmed
        2026-09-26: this PDF path returns 200. See dds_daily_parser_spec (repo history /
        docs/DATA_SYSTEM.md) for the full per-section layout: pages 1,2,3,7 have
        extractable text (pdftotext -layout); pages 4-6 are raster images (weather map,
        satellite photo, rain maps, 7-day forecast chart) with NO extractable text --
        OPEN without OCR, out of scope for this pipeline."
    last_status: {date: "2026-09-26", http: 200, note: "7 pages, ~2.48 MiB. Sections
      parsed to observations: rainfall-by-station (sec.2), canal levels outer/inner
      (sec.3-4), Chao Phraya discharge + partial tide fields for FULLY-formatted daily
      rows only (sec.5), reservoir storage (sec.6), dedicated tide AM/PM (sec.7).
      Everything else (header prose, weather forecast, an incomplete/irregular daily
      row, salinity table, narrative log) is stored verbatim in the documents table,
      not force-parsed into fields."}
    variables: [rain_mm_24h, canal_level_m, canal_critical_m, qmax_cms, reservoir_pct,
      tide_am_level_m, tide_pm_level_m]
    kind: api
    fetch_mode: on_demand
    retry: none
    schema_version: 1
    imported_from: union(local,origin)
    contract_test: "tests/contract/test_remaining_wired_sources.py"
    health_check: "not yet captured this check -- see tools/capture_source_sample.py"

  - id: dds_flood_report
    agency:
      th: "สำนักการระบายน้ำ กรุงเทพมหานคร"
      en: "Department of Drainage and Sewerage, BMA"
    url: "https://dds.bangkok.go.th/flood_report.php"
    method: GET (server-rendered HTML, two tables -- per-district summary counts, then a
      per-road detail table)
    cadence: daily / event-driven
    format: html
    auth: none
    licence_status: {text: "RELAYED, not independently confirmed.", unresolved: true}
