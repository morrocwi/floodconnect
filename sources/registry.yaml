    last_status: {date: "2026-09-26", http: 200, note: "Per-road detail table: 11 columns
      (ลำดับที่, พื้นที่เขต, ถนน, บริเวณ, ความสูง ซม., ความยาว ม., กระทบผิวจราจร,
      เวลาท่วม, เวลาแห้ง, ระยะเวลาท่วม, ปริมาณฝนรวม). A road still flooded at fetch
      time has an empty เวลาแห้ง/ระยะเวลาท่วม cell -- parsed as None, never fabricated."}
    variables: [district, road, area_detail, flood_height_cm, flood_length_m,
      lanes_affected, flood_start, flood_end, flood_duration, rain_total_mm]
    kind: api
    fetch_mode: on_demand
