# coping_thresholds.yaml -- one row per unit x variable: an observed value, its outcome
# (flooded | coped), the event/date it belongs to, and its source file + epistemic tag.
#
# Founder instruction (verbatim, 2026-09-27): "ซึ่งค่ารับมือพวกนี้อ่านจากประวัติได้ เรามีประวัติศาสตร์
# และงานวิจัยเยอะ" -- these coping numbers can be read from history; this repo already has a lot
# of history and research. This file mines every historical/research source already in the repo
# (case_*.md, card_research_*.md, capacity_ledger(+additions).yaml, DATA_SWEEP_2026-09-27.md,
# docs/CAPACITY.md, raw/backtest/events.yaml, community_reports_2026-09-26.md) for stated
# "flooded at X" / "coped up to X" values and derives, per unit x variable:
#   threshold_flooded_min := smallest recorded value with outcome=flooded
#   threshold_coped_max   := largest recorded value with outcome=coped (a day/event that did
#                             NOT flood at that reading) -- NEVER a design figure alone; a
#                             design/rated capacity is filed separately (kind: design) and is
#                             not substituted for a real observed non-flood reading.
#   gap := threshold_flooded_min - threshold_coped_max, when both sides exist -- this is the
#          honestly-unknown band ("ไม่รู้"), not a computed risk score. A unit with only one
#          side of the band is marked one_sided: true and the missing side stays OPEN.
#
# WRITES NEW DATA ONLY. Toledo: no equation here -- every value is copied verbatim from a
# cited repo source, or is a plain min/max over already-tagged rows (arithmetic, not a
# registered formula). This file maps to PROP-FLOOD-06's own capacity/threshold notion
# (see docs/LAYER0_IN_OUT_CAPACITY.md), it does not define a new one.

schema_note: >
  Each row under `rows`: unit, variable, value, unit_of_value, outcome (flooded | coped |
  design_only | official_threshold), cause (rain | river_flow | canal_backflow |
  unspecified), event, date, source, tag. `official_threshold` added 2026-09-27 (TODO
  #54, bma_plan2569 extraction) -- an agency-declared operating/alert threshold (e.g. a
  printed rain-intensity band edge or river-level ladder step), distinct from an
  observed flooded/coped reading and from a design/rated capacity figure (design_only).
  `derived` (below `rows`, one block per unit x variable) holds the min/max/gap computed
  from those rows plus `one_sided` and `notes`.

