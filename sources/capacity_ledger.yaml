# capacity_ledger.yaml — one ledger of DESIGN/NORMAL discharge capacities for the whole
# upstream-dam -> BKK-canal -> tunnel/pump -> river/sea outfall chain.
#
# Written 2026-09-27 per founder request (16:40): "ทำผังให้ครบทั้งเรื่อง ความสามารถของการ
# ระบายน้ำตามปกติ ของลำน้ำ แม่น้ำ และความสามารถของเครื่องมือต่างๆ" + founder correction
# (16:44): "แต่เจ้าพระยาก็เป็นทางออกน้ำไม่ใช่เรอะ" -- the Chao Phraya (and the Gulf via
# คลองพระองค์ฯ/ชายทะเล) is treated explicitly as the OUTLET/boundary of the Bangkok
# drainage system below, not only as an upstream source -- see the `outfall` kind rows
# and each BKK-side pump/tunnel row's `discharges_to` field.
#
# THIS FILE WRITES NEW DATA ONLY -- it does not edit docs/CAPACITY.md, docs/ASSETS.md,
# sources/assets_registry.yaml, or site/build_data.py (out of this check's write scope;
# another worker is the sole committer for this branch). ids reuse DAG `AS_*` node ids
# and asset_ids from data/observations.sqlite's `assets` table where they already exist
# (queried directly this check, not assumed); a new id is minted only where neither
# exists, prefixed `led:`.
#
# Toledo: no equation is used anywhere in this file -- every capacity_value below is a
# number copied verbatim from a cited source, or an arithmetic sum of two ledger
# numbers (unit conversion million-m3/day -> m3/s by /86400, per CHAO_PHRAYA_CAPACITY_
# AND_DISCHARGE.md's own convention -- basic arithmetic, not a registered equation).
#
# Tags follow this repo's epistemic floor (see AGENTS.md/README.md): VERIFIED (read
# from an official document opened by this check or an already-VERIFIED sqlite row) /
# RELAYED (news/media, not independently checked against the primary document) / OPEN
# (no number found).

schema_note: >
  Each row: id, element_th, kind, location {order_index, province, district},
  capacity_value, unit, capacity_basis, year_of_statement, source, tag,
  current_value_this_week, observed_at, notes. Outfall-kind rows add:
  discharges_to, bank, gravity_threshold (river/tide level above which the gate must
  close and pumps take over -- OPEN everywhere in this ledger; no official threshold
  document was found for any structure, see notes on each outfall row and the
  DRAINAGE_CAPACITY_MAP.md "ทางออก" section).

