  - id: day_boundary_mismatch
    description_th: >
      สรุปการชนกันของ "ขอบเขตวัน" (day boundary) ที่พบจริงข้าม 3+ แหล่งในตารางนี้ -- founder's
      brief ตัวอย่างตรงตัว: "Open-Meteo daily mm ↔ TMD 24 h แต่คนละ day boundary (00:00 UTC vs
      07:00 ICT)"
    boundaries_found:
      - {source: "TMD (rain_24h_mm convention, RELAYED per TIER_THRESHOLDS_RATIONALE.md)",
         boundary: "24h window ending 07:00 ICT (local)"}
      - {source: "Open-Meteo daily-aggregated products (forecast16d, ensemble_daily) when a
          timezone= param is passed", boundary: "24h window = local midnight to local
          midnight (Asia/Bangkok, i.e. ICT 00:00-24:00), per Open-Meteo's own documented
          timezone-localisation behaviour -- this repo's own URLs always pass
          timezone=Asia%2FBangkok (sources/registry.yaml)"}
      - {source: "NASA POWER PRECTOTCORR", boundary: "24h window = UTC calendar day (00:00-
          24:00 UTC), per general NASA POWER documentation, RELAYED, not re-verified this
          task"}
      - {source: "BMA daily bulletin (dds_daily_pdf)", boundary: "OPEN -- exact issue clock-
          time not stated in sources/registry.yaml; see time_and_calendar.bma_bulletin_rain_24h
          above"}
    correction_rule: >
      Never compare two 'daily' rain figures from different sources on this list as if the same
      calendar day means the same 24h window. Before comparing, state each source's own
      boundary explicitly (as above) and, where an exact hour-level comparison matters, shift
      one series by the boundary offset (TMD 07:00 ICT = 00:00 UTC; Open-Meteo local-midnight
      ICT = 17:00 UTC the PREVIOUS day; NASA POWER UTC midnight = 07:00 ICT) -- this is plain
      arithmetic on a stated offset, not a new Toledo equation, same discipline as capacity_
      ledger.yaml's own /86400 conversion.
    tag: "VERIFIED for TMD/Open-Meteo/BMA boundary claims already stated elsewhere in this repo
      (time_and_calendar block above); RELAYED for the NASA POWER UTC-day claim (general
      documentation, not re-fetched this check)"

