# =============================================================================================
# (f) known_unit_errors_in_sources
# =============================================================================================
known_unit_errors_in_sources:
  - id: "bma_plan_2569_section5.1_million_per_second"
    location: "BMA flood plan 2569 PDF (dds.bangkok.go.th/public_content/files/001/0011062_1.pdf,
      raw/capacity/plan_2569.pdf), §5.1 (ช่วงปฏิบัติการ table, ช่วงที่ 3), this check's own
      extracted-text line ~540"
    error_text_th: "ระดับวิกฤติไม่เกิน 3,500 ล้านลบ.ม./วินาที"
    diagnosis: >
      "ล้าน ลบ.ม./วินาที" (million cubic-metres PER SECOND) is not a coherent discharge unit at
      Chao Phraya scale -- it would mean 3,500,000,000 m3/s, roughly a thousand times the
      largest discharge figure recorded anywhere else in this entire repo (the 2554 historical
      peak at C.29 was 3,930 m3/s, per coping_thresholds.yaml). The SAME document, in the
      earlier §2.1.3 discussion of the same river reach (this check's own extracted-text line
      ~420-422), correctly states the comparable figure WITHOUT "ล้าน": "ขนาดของแม่น้าเจ้าพระยา
      บริเวณกรุงเทพมหานคร สามารถรองรับปริมาณน้าเหนือได้ประมาณ 2,500 - 3,500 ลบ.ม./วินาที โดยไม่มี
      น้าล้นตลิ่งโดยทั่วไป" -- a near-identical 3,500 ceiling figure, same reach, correct unit.
      Read together, the §5.1 occurrence is almost certainly a copy/typo error inserting
      "ล้าน" (a word that belongs on VOLUME figures elsewhere in the same document, e.g. "ล้าน
      ลบ.ม." storage figures) into a RATE figure that should read plain "ลบ.ม./วินาที", matching
      the §2.1.3 figure.
    correct_reading_per_document_itself: "3,500 ลบ.ม./วินาที (no ล้าน), consistent with §2.1.3's
      2,500-3,500 ลบ.ม./วินาที river-conveyance figure for the same reach"
    tag: "VERIFIED-error-identified (this check's own direct read of both PDF passages);
      RELAYED-interpretation for WHY it happened (copy/typo, not independently confirmed with
      the document's authors)"
    action: "Do not cite '3,500 ล้านลบ.ม./วินาที' as a real discharge figure anywhere downstream.
      If this figure is ever wired into capacity_ledger.yaml or a public-facing page, cite it as
      '3,500 ลบ.ม./วินาที (§5.1 of the source PDF prints \"ล้าน\" ล้านลบ.ม./วินาที, an apparent
      unit error against the document's own §2.1.3)', per this crosswalk row."

  - id: "bma_design_intensity_58.7_vs_jica_76to100_mm_h"
    location: "docs/CAPACITY.md §1 / sources/coping_thresholds.yaml design row"
    description: >
      NOT a unit error (both figures are correctly mm/h) -- a BASIS conflict already flagged by
      this repo's own docs/CAPACITY.md: 58.7mm/h (VERIFIED, สนน. 2569 plan, as-built capacity)
      vs 76mm/h current / 100mm/h future-target (RELAYED, JICA master-plan news relay, a
      different project/scope). Listed here because it is the single most-cited "which design
      number do I use" confusion point in this repo, per docs/CAPACITY.md's own explicit
      flagging.
    tag: "VERIFIED (58.7) vs RELAYED (76/100) -- basis difference, not a unit error"
    action: "Never average or silently pick one -- state which basis (as-built vs JICA-target)
      a given figure uses, per docs/CAPACITY.md's own existing discipline."

  - id: "bkk_total_pumping_three_disagreeing_totals"
    location: "capacity_ledger.yaml (led:bkk_total_pumping_phranakhon=1200,
      led:bkk_total_pumping_citywide_theoretical=2467.69,
      led:pump_bmakstations_summary=718.0) AND docs/CAPACITY.md §3 (1,200 / 1,230.55 / 1,300,
      a THIRD, partially-overlapping set of three numbers) AND the founder-asked figure
      1,272.33 which is NOT FOUND in any source read by either this check or the predecessor
      capacity-note task."
    description: >
      Not a single unit error, but a cluster of same-unit (m3/s), same-nominal-quantity
      ('total BKK pumping capacity') figures from overlapping-but-not-identical scope
      definitions (one-side-only vs citywide-theoretical-design vs a narrower published subset)
      that LOOK directly comparable and are NOT. Already flagged by capacity_ledger.yaml's own
      notes on each row as non-mergeable; repeated here because a reader of THIS unit-crosswalk
      file specifically, encountering "m3/s, กทม. สนน." for the first time, could easily assume
      these numbers all mean the same thing.
    tag: RELAYED
    action: "Always cite which of the (at least 6, across 2 files) disagreeing totals is being
      used, and its scope qualifier (ฝั่งพระนคร only / citywide theoretical / published subset /
      unsourced-1,272.33), never a bare 'BKK total pumping capacity = N m3/s'."

  - id: "pump_station_water_station_1_capacity_discrepancy"
    location: "capacity_ledger.yaml pump_station:water_station:1 (สถานีสูบน้ำพระโขนง)"
    description: "45 m3/s (sqlite-registry figure, MEASURED-from-store) vs 173 m3/s (a 2550/2007
      official document quoted in docs/CAPACITY.md §2, same station name) -- an 18 m3/s-scale
      gap already flagged OPEN by both files, unresolved, cause unknown (different equipment
      generation? different counting convention for '45 เครื่อง'? not established)."
    tag: OPEN
    action: "Do not silently pick either figure; both already correctly tagged OPEN in their
      source files."

  - id: "hii_storage_percent_denominator_unresolved"
    location: "quantities.storage_percent block above"
    description: "A storage_percent sample value of 209.48% observed on a tele_waterlevel-type
      station row (per docs/knowledge/card_api_2026-09-27_hii_waterchart_basin.md §2) is itself
      evidence the field's denominator is NOT simply 'percent of design capacity' for that
      station_type -- likely a different per-station-type convention (e.g. percent of a
      reference/baseline flow, not bankfull capacity), unresolved."
    tag: OPEN
    action: "Do not compare storage_percent values across different station_type rows (dam vs
      tele_waterlevel) without first resolving the HII glossary definition per station_type."
