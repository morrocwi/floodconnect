  - id: openmeteo_soil_moisture
    provider: "Open-Meteo (open ECMWF/GFS land-surface model) -- NOT a Thai government agency"
    api_field: "soil_moisture_0_to_1cm, soil_moisture_1_to_3cm, soil_moisture_3_to_9cm"
