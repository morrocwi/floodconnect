# =============================================================================================
# canonical_units -- FloodConnect's own computation unit for each SI-style quantity.
# Every source row in `quantities` and `international_apis` below maps INTO these.
# =============================================================================================
canonical_units:
  length_level: "m (metres), stated against a named datum (MSL / station-local / grid) --
    never a bare metre without a datum tag, per the datums section above"
  discharge: "m3/s (cubic metres per second)"
  volume: "m3 (cubic metres); this repo's own files often carry million_m3 (MCM) as a
    secondary convenience unit alongside m3 -- both kept, never silently interchanged without
    the x1,000,000 factor stated"
  depth_accumulation: "mm (millimetres), always with an explicit accumulation window (hour /
    24h / event) -- a bare 'mm' with no window is treated as incomplete, per computation_rules"
  intensity: "mm/h (millimetres per hour)"
  percent: "% -- ONLY meaningful alongside its stated denominator/basis; a bare % is never
    assumed comparable across sources, per computation_rules and the storage_percent OPEN item
    above"
  time: "UTC, ISO-8601 (observations.sqlite's own observed_at_utc/fetched_at_utc columns are
    the canonical store-level convention) -- ICT (+07:00) and BE-calendar dates are display/
    source-native conventions, converted to this canonical form on ingest, per
    time_and_calendar above"
  probability: "% (0-100), as published by the model provider -- NOT converted or recalibrated
    by this repo; kept as the provider's own probability estimate"
  soil_moisture: "m3/m3 (volumetric water content) -- ADDED 2026-09-27 per docs/knowledge/
    EASIEST_EXTERNAL_APIS_FOR_MISSING_INPUTS_2026-09-27.md #4 (antecedent-wetness/S_0 proxy).
    This repo had NO canonical unit for this quantity before that task -- it is neither m/mm/
    m3/s (the categories above), a genuinely new SI-style ratio."
  pressure: "hPa (hectopascals), mean sea level -- ADDED 2026-09-27 (founder addition,
    storm-track/pressure context). Data only -- no danger threshold derived from this
    quantity anywhere in this repo (a draft promoter would be a separate Toledo task)."
  sea_surface_temperature: "degC -- ADDED 2026-09-27 (founder addition). Data only, same
    no-threshold posture as pressure above."
  climate_index: "n/a -- dimensionless anomaly/index value (e.g. NOAA ONI's degC-anomaly,
    BoM RMM's unitless amplitude), NOT a convertible physical quantity like the categories
    above -- same non-mapped posture as google_flood_hub's return-period risk category
    below. ADDED 2026-09-27 (founder addition)."

# =============================================================================================
# computation_rules -- hard rules for combining/comparing values across sources.
# None of these are new Toledo equations -- these are REFUSAL/handling rules (same family as
# docs/FLOW_STALL_TYPOLOGY.md's existing "REFUSE เมื่อ datum ไม่ตรงกัน"), not derivations.
# =============================================================================================
computation_rules:
  - rule: "never_add_intensity_to_accumulation"
    statement: "Never add or average a mm/h intensity figure with a mm/24h (or any other
      window) accumulation figure as if they were the same quantity. Convert explicitly first
      (intensity x hours = depth for THAT window only), and state the window used."
    example: "BMA's own 58.7 mm/h design intensity and 80 mm/24h design depth are NOT two
      independent figures to be summed -- they are the SAME design statement expressed two
      ways (58.7 mm/h x ~3h assumed rain duration ≈ 80mm/day, per docs/CAPACITY.md §1's own
      VERIFIED quote)."
  - rule: "grid_cell_vs_gauge_not_equal"
    statement: "A model's grid-cell mean/point estimate (Open-Meteo, GloFAS, MET Norway, NASA
      POWER -- all reanalysis/forecast PRODUCTS, not physical sensors) is NEVER treated as
      equal in kind to a physical gauge reading (RID/HII telemetry, BMA canal sensor, TMD
      station). Tag every grid/model-derived value `forecast-inferred` or `model-estimate`
      alongside its own VERIFIED/RELAYED evidence tag -- the two tags answer different
      questions (source-checked-or-not vs measured-or-modelled)."
  - rule: "never_mix_msl_and_local"
    statement: "Never subtract, average, or otherwise combine an MSL-referenced level with a
      station-local-datum level as if on the same axis. This restates docs/FLOW_STALL_
      TYPOLOGY.md's existing REFUSE rule -- see the datums section above for which of this
      repo's own stations are OPEN (unknown datum) vs VERIFIED-MSL."
  - rule: "never_sum_ensemble_members"
    statement: "An ensemble forecast (Open-Meteo openmeteo_ensemble/openmeteo_ensemble_daily,
      31-39 members; MET Norway is NOT an ensemble, single deterministic run) is summarised by
      median/min/max ACROSS members for the SAME timestep, never by summing member values
      together. This repo's own collect_openmeteo_ensemble* code already reports per-hour
      median/min/max across whichever members are present that hour (sources/registry.yaml id
      openmeteo_ensemble note) -- this rule states that convention explicitly so a future
      collector does not silently sum instead."
  - rule: "always_convert_to_utc_before_windowing"
    statement: "Before computing any accumulation window (e.g. 'last 24h'), convert every
      source timestamp to UTC first, THEN apply the window boundary. Do not window in mixed
      local/UTC time. This matters most for the TMD-07:00-ICT vs Open-Meteo/GloFAS-00:00-UTC
      day-boundary mismatch documented in international_apis.day_boundary_mismatch below --
      naively treating both as 'daily' and comparing them day-for-day silently shifts the
      comparison by 7 hours."
  - rule: "state_conversion_factor_even_when_it_is_1"
    statement: "Every row below states its conversion_factor_to_canonical explicitly, including
      the common case of 1 (already canonical) -- so a reader never has to assume 'no unit
      shown = no conversion needed' silently."

# =============================================================================================
# international_apis -- foreign/global API sources, first-class (not a footnote), per the
# founder's explicit follow-up. One row per feed we actually collect (collect.py/registry.yaml)
# plus Google Flood Hub (not yet collected live -- screenshot-card only, see its own row).
# =============================================================================================
international_apis:

  - id: openmeteo_forecast
    provider: "Open-Meteo (open ECMWF/GFS blend) -- NOT TMD"
    api_field: "precipitation"
    provider_documented_unit: "mm, per hourly timestep (Open-Meteo forecast API convention,
      provider docs: open-meteo.com/en/docs)"
    provider_documented_unit_secondary: "precipitation_probability: % (0-100), per hourly
      timestep -- a forecast-model probability, not a measured frequency"
    grid_resolution: "ECMWF IFS ~9-11 km / GFS ~13 km (blend, per Open-Meteo's own documented
      model list) -- RELAYED from provider docs, not re-verified this check"
    grid_vs_point_caveat: "Value returned is the model's own interpolation to the requested
      lat/lon point (not a station reading) -- tag every value forecast-inferred per
      computation_rules.grid_cell_vs_gauge_not_equal"
    canonical_mapping: "precipitation (mm/hourly step) -> canonical depth_accumulation (mm),
      window = 1 hour per step; sum consecutive steps for a longer window, using the
      timezone=Asia%2FBangkok localisation already passed in this repo's own URL (per
      sources/registry.yaml id openmeteo_forecast)"
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "TMD rain_24h_mm (mm/24h) and BMA rain_mm_24h (dds_daily_pdf) --
      SAME nominal quantity (rainfall depth) but see day_boundary_mismatch below: Open-Meteo's
      own day boundary (when daily-aggregated) follows the timezone param's local midnight,
      NOT TMD's 07:00-ICT observation-day convention -- do not compare day-for-day without the
      correction rule stated there."
    tag: VERIFIED
    note: "VERIFIED against this repo's own collect_openmeteo_forecast/parse_openmeteo_forecast
      code (parsers.py ~line 1079-1095) and the exact URL in sources/registry.yaml -- the field
      names precipitation/precipitation_probability are read directly from this repo's live
      collector, not merely from provider docs."

  - id: openmeteo_forecast16d
    provider: "Open-Meteo, 9 explicit deterministic models (ecmwf_ifs025, gfs_seamless,
      icon_seamless, jma_seamless, gem_seamless, meteofrance_seamless, ukmo_seamless,
      knmi_seamless, cma_grapes_global)"
    api_field: "precipitation_sum"
    provider_documented_unit: "mm, per DAILY step (daily= param, not hourly) -- a true daily
      total per the provider's own daily aggregation, forecast_days=16"
    grid_resolution: "varies per model, roughly 9-28 km class per Open-Meteo's own documented
      model list (RELAYED, not re-verified per-model this check)"
    grid_vs_point_caveat: "Same as openmeteo_forecast above -- 8 fixed points
      (collect.FORECAST7D_POINTS), model-interpolated, not gauges."
    canonical_mapping: "precipitation_sum (mm/day) -> canonical depth_accumulation (mm),
      window = 1 day, day boundary = the timezone=Asia%2FBangkok local-midnight-to-local-
      midnight convention (per the URL's own timezone param, sources/registry.yaml)"
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same as openmeteo_forecast row -- TMD 24h rain, day-boundary
      mismatch caveat applies identically."
    tag: VERIFIED
    note: "VERIFIED live this check's predecessor session at Sammakorn + Nakhon Sawan per
      sources/registry.yaml's own last_status note -- field name and unit read directly from a
      real response, not provider docs alone."

  - id: openmeteo_multimodel
    provider: "Open-Meteo, 6 open models (ECMWF/GFS/ICON/JMA/GEM/Météo-France)"
    api_field: "precipitation"
    provider_documented_unit: "mm, per hourly timestep, one request per model
      (models=<model> param)"
    grid_resolution: "varies per model, same caveat as openmeteo_forecast16d"
    grid_vs_point_caveat: "Same as openmeteo_forecast -- model-interpolated to a fixed
      Sammakorn point."
    canonical_mapping: "precipitation (mm/hourly) -> canonical depth_accumulation (mm),
      per-step; this repo's own build_data.py drain-timeline chart reads these files for a
      6-model median/min/max/JMA band (per sources/registry.yaml note on this id)"
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same TMD/BMA rain-depth equivalence as above."
    tag: VERIFIED
    note: "VERIFIED against parsers.py/collect.py field usage, not yet run live in this
      environment per sources/registry.yaml's own last_status (shape confirmed against an
      existing manual snapshot of the same API family)."

  - id: openmeteo_ensemble
    provider: "Open-Meteo Ensemble API, icon_seamless model, hourly"
    api_field: "precipitation (per member)"
    provider_documented_unit: "mm, per hourly timestep, per ensemble member (39 members +
      control run per sources/registry.yaml's own last_status note)"
    grid_resolution: "ICON ensemble class resolution, RELAYED from provider docs, not
      re-verified per-member this check"
    grid_vs_point_caveat: "Model-interpolated to 2 fixed points (Sammakorn + one upstream
