      WL.BMA.02 exists in this store, no anchor connects them...). Line 197 of the same
      document: "ไม่พบตัวเลขนี้ในคลังนี้เลย -- OPEN (ไม่กล้าอ้างเลข '-1.50 ม.รทก.' ใดๆ เพราะไม่พบ
