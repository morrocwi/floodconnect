        conversion_to_canonical: "1:1 IF the station is confirmed MSL -- OPEN per-station, see
          datums block. Never assume 1:1 without that check."
        accumulation_window: "instantaneous (telemetry reading, canal_datetime timestamp per
          record)"
        tag: OPEN
        note: "sources/registry.yaml itself never states whether canal_water_level_m is MSL or
          a local station-zero reading -- this repo has not resolved this for any BMA canal
          station (see WL.BMA.02 case in docs/SAMMAKORN_STANDING_WATER_2026-09-27.md, quoted
          under datums below)."
