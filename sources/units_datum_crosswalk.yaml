      Sammakorn plus a large surrounding area; treat as a regional-context figure, not a
      neighbourhood-resolution one, per computation_rules.grid_cell_vs_gauge_not_equal (applies
      with extra force at this resolution)."
    canonical_mapping: "PRECTOTCORR (mm/day, UTC calendar day per NASA POWER's own daily
      convention) -> canonical depth_accumulation (mm), window = 1 UTC day -- NOT the same day
      boundary as Open-Meteo's local-midnight daily aggregation or TMD's 07:00 ICT boundary,
      see day_boundary_mismatch below."
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same nominal quantity as TMD rain_24h_mm -- day-boundary mismatch
      applies (UTC day here vs local-midnight for Open-Meteo vs 07:00 ICT for TMD -- THREE
