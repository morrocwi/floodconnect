datums:
  m_rtk_definition:
    thai: "ม.รทก. = เมตร (เทียบ) ระดับทะเลปานกลาง"
    english: "metres above Mean Sea Level (MSL), Thailand's national vertical datum"
    realising_authority: "กรมแผนที่ทหาร (Royal Thai Survey Department, RTSD) -- the benchmark
      network that physically realises this datum traces to the Ko Lak (เกาะหลัก, Prachuap
      Khiri Khan) mean-sea-level gauge, per the standard/widely-cited Thai national datum
      convention"
    tag: RELAYED
    note: >
      This repo holds no primary RTSD datum-definition document of its own -- the Ko Lak/
      กรมแผนที่ทหาร attribution is standard published convention (widely cited in Thai survey/
      GIS literature), not independently re-verified against an RTSD primary document by this
      task. What this repo DOES hold directly: the RTSD 2010 flood-risk raster
      (raw/rtsd_2010/, sources/bkk_district_elevation.yaml's own _meta states "MSL datum"
      explicitly for that map) and the BMA plan PDF's own repeated use of "ม.รทก." for river/
      tide levels (VERIFIED, this check's own grep, see quantities.tide above). Treat the Ko Lak
      attribution as RELAYED background, and the repo's own RTSD-map/plan-PDF usages as the
      VERIFIED anchor for what ม.รทก. means operationally in this repo's own sources.

  bma_canal_gauges_datum_status:
    summary: "OPEN for every single BMA canal-telemetry station in this repo -- no source read
      states whether a given WL.* canal gauge's own zero-point is MSL or a local/arbitrary
      station-zero."
