    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same TMD/BMA rain-depth equivalence; the ensemble SPREAD itself
      (min-to-max range) has no direct single-number Thai-agency equivalent -- it is a
      forecast-uncertainty product, a genuinely different kind of information from any single
      Thai-agency reading."
    tag: VERIFIED

  - id: openmeteo_ensemble_daily
    provider: "Open-Meteo Ensemble API, serves NOAA GEFS, 31 members, daily"
    api_field: "precipitation_sum (per member)"
    provider_documented_unit: "mm, per DAILY step, per member (forecast_days=16)"
    grid_resolution: "GEFS ~25 km class, RELAYED from provider docs"
    grid_vs_point_caveat: "Model-interpolated to 8 fixed points -- forecast-inferred."
    canonical_mapping: "per-member precipitation_sum (mm/day) -> canonical depth_accumulation,
      summarised per-day median/min/max across members, never summed."
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same TMD/BMA rain-depth equivalence, day-boundary caveat applies."
    tag: VERIFIED
    note: "VERIFIED live this check's predecessor session at Sammakorn -- 31 real per-member
      7-day totals (15.4-75.2mm range), per sources/registry.yaml's own last_status note."

  - id: openmeteo_previous_runs
    provider: "Open-Meteo Previous Runs API (GFS, forecast-vs-later-self-estimate skill check)"
    api_field: "precipitation, precipitation_previous_day1, precipitation_previous_day3"
    provider_documented_unit: "mm, per hourly timestep, aggregated by this repo's own
      collect_openmeteo_previous_runs/parse_openmeteo_previous_runs_skillcheck into a daily
      precipitation_skillcheck_daily_mm value (variable name confirmed live in
      data/observations.sqlite's own distinct-variables list, queried this check)"
    grid_resolution: "GFS class, same caveat as above"
    grid_vs_point_caveat: "This is model-vs-ITSELF (GFS's own later best-estimate vs its own
      earlier forecast), NOT model-vs-gauge -- do not read this as a forecast-accuracy figure
      against a real rain gauge; sources/registry.yaml's own last_status note states this
      explicitly (4-10x MEASURED-vs-forecast underforecast, 'model vs. itself, NOT vs. a
      gauge')."
    canonical_mapping: "precipitation* (mm/hourly) -> canonical depth_accumulation (mm/day
      after this repo's own aggregation)"
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "None directly -- this is a model self-diagnostic product, not a
      quantity any Thai agency publishes an equivalent of."
    tag: VERIFIED

  - id: metno_locationforecast
    provider: "MET Norway Locationforecast/2.0 compact -- ECMWF-based, independent pipeline/ToS
      from Open-Meteo"
    api_field: "precipitation_amount"
    provider_documented_unit: "mm, per PERIOD -- MET Norway's own API structures periods as
      next_1_hours / next_6_hours blocks (NOT a uniform hourly grid like Open-Meteo); this
      repo's own docs/knowledge/FORECAST_7DAY_SOURCES.md §3 note (cited in
      collect_metno_locationforecast's own docstring) states: daily aggregation MUST keep only
      non-overlapping next_6_hours blocks (hour%6==0) -- naive summing of overlapping
      next_1_hours and next_6_hours blocks double/triple-counts."
    grid_resolution: "MET Norway's own MEPS/ECMWF-derived grid, ~1-9 km class depending on
      region (RELAYED from provider docs, not re-verified this check)"
    grid_vs_point_caveat: "Model-interpolated to 8 fixed points -- forecast-inferred."
    canonical_mapping: "precipitation_amount (mm per next_6_hours block, non-overlapping only)
      -> canonical depth_accumulation (mm), window = 6h per block, sum 4 blocks for a 24h
      total, per this repo's own already-documented aggregation rule."
    conversion_factor_to_canonical: 1
    thai_agency_equivalent: "Same TMD/BMA rain-depth equivalence -- day-boundary caveat applies,
      PLUS this source's own internal overlapping-block trap (see canonical_mapping) which is a
      SEPARATE hazard from the day-boundary mismatch."
    tag: VERIFIED
    note: "VERIFIED live this check's predecessor session at Sammakorn -- 90 hourly timesteps
      (9.75 days), per sources/registry.yaml's own last_status note, PLUS field names
      confirmed directly in collect.py's own collect_metno_locationforecast function (read this
      task)."

  - id: nasa_power
    provider: "NASA POWER (open reanalysis product)"
    api_field: "PRECTOTCORR"
    provider_documented_unit: "mm/day, bias-corrected precipitation, daily temporal resolution,
      point query (community=AG agroclimatology parameter set) -- per NASA POWER's own
      documented API (power.larc.nasa.gov), RELAYED-provider-doc for the exact grid-cell size:
