        tag: VERIFIED

  hii_waterlevel_msl_vs_waterlevel_bare: >
    HII/thaiwater publishes at least two water-level field families on the SAME host
    (api-v3.thaiwater.net): fields explicitly named *_msl (waterlevel_msl, waterlevel_msl_
    previous, critical_level_msl -- these ARE MSL, VERIFIED by field name per
    docs/knowledge/card_api_2026-09-27_hii_waterchart_basin.md §2) versus canal_water_level_m
    (public/canal_waterlevel, sources/registry.yaml id thaiwater_canal_waterlevel -- this is
    BMA's own canal telemetry republished by HII, OPEN datum status, inherited from the BMA
    canal-gauge OPEN status above, not a separate HII decision).

  rid_bank_levels_in_msl: >
    left_bank / right_bank / min_bank / ground_level / critical_level_msl fields seen in the
    public/waterlevel_load sample row (docs/knowledge/card_api_2026-09-27_hii_waterchart_basin.md
    §2, e.g. "left_bank": 72.14, "right_bank": 60.48, "ground_level": 55.63,
    "critical_level_msl": 62.4) -- these sit alongside a waterlevel_msl field in the SAME row,
    strongly suggesting (INSTINCT, not independently confirmed against an HII glossary) that
    left_bank/right_bank/ground_level in that same endpoint share the MSL basis of their sibling
    field, but this repo has not obtained an explicit HII statement that bank/ground fields are
    themselves MSL rather than a station-local cross-section datum. Tag: OPEN for the bank/
    ground fields specifically, VERIFIED only for the field literally named *_msl.

  ground_level_m_rtk_and_subsidence_caveat: >
    See quantities.ground_elevation above -- RTSD 2010 map is MSL by definition, but every
    district's subsidence_rate_mm_yr is null (no source), so a district's CURRENT ground level
    relative to MSL is systematically uncertain (biased toward "lower than mapped", direction
    known, magnitude OPEN) for the ~15 years since the 2010 survey.

  how_to_compare_two_stations: >
    Per this repo's own existing discipline (PROP-FLOOD-04, canal_graph.py / reconcile.py,
    referenced in docs/FLOW_STALL_TYPOLOGY.md §2-4): two stations' water levels may only be
    subtracted/compared directly (ΔH) when BOTH are confirmed on the SAME datum realisation.
    docs/FLOW_STALL_TYPOLOGY.md's own stated rule: "REFUSE เมื่อ datum ไม่ตรงกัน" (refuse when
    datums don't match) -- this is an existing refusal rule, not a new one introduced by this
    file. This crosswalk's job is to make it possible to CHECK that precondition per pair of
    stations (see per_station block above) rather than silently assuming a shared datum because
    two fields happen to look similar (e.g. two different water_level_m-named fields from two
    different agencies are NOT thereby proven comparable).

# =============================================================================================
# (c) time_and_calendar
# =============================================================================================
time_and_calendar:
  utc_vs_ict:
    ict_offset: "+07:00 (Indochina Time, no daylight saving)"
    note: "Open-Meteo/HII/BMA sources mostly report already-localised ICT timestamps when a
      timezone param is passed (Open-Meteo: timezone=Asia%2FBangkok explicit in every URL per
      sources/registry.yaml); observations.sqlite's own schema stores observed_at_utc as the
      column name (UTC), so a collector must convert on ingest -- not independently re-verified
      per-collector this check, flagged as a thing to check per source, not assumed uniform."
    tag: VERIFIED-for-schema-column-name / OPEN-for-per-collector-conversion-correctness
  buddhist_calendar:
    formula: "พ.ศ. (BE) = ค.ศ. (CE) + 543"
    example: "2569 BE = 2026 CE (this repo's own dates, e.g. plan PDF title '2569', are BE;
      this crosswalk and this repo's other files consistently render both, e.g. '2026-09-27'
      alongside '26 ก.ย. 2569')"
    tag: VERIFIED
    note: "This is a fixed, universally known conversion (not agency-specific), included here
      because the BMA plan PDF and most Thai-agency documents in this repo are BE-dated while
      this repo's own internal timestamps are CE."
  tmd_daily_boundary:
    convention: "24h ending 07:00 local (ICT) -- standard TMD observation-day convention"
    tag: RELAYED
    note: "Per docs/LAYER0_IN_OUT_CAPACITY.md §6 and coping_thresholds.yaml's own
      tmd_intensity_classes_reference note: a direct WebFetch to tmd.go.th failed with a TLS
      certificate error this repo's own prior session -- this 07:00 boundary convention is
      carried as RELAYED/not-primary-verified, same as TMD's intensity-class boundaries."
  hii_timestamps:
    convention: "Per-record timestamp fields (waterlevel_datetime, canal_datetime, dam_date/
      dam_hourly timestamps, etc.), station-local refresh, NOT a fixed daily boundary -- near-
      real-time telemetry, varies per station per sources/registry.yaml's own repeated
      \"cadence: near-real-time\" notes."
    tag: VERIFIED
    note: "VERIFIED as 'varies per record', not as any specific fixed clock convention -- HII
      does not publish on a single daily-boundary cadence the way TMD/BMA-bulletin do."
  bma_bulletin_rain_24h:
    convention: "24h window ending at the daily bulletin's own issue time (dds_daily_pdf,
      issue number increments daily e.g. ฉบับที่ 269/69 on 2026-09-26) -- NOT independently
      confirmed to be the same 07:00 boundary as TMD's convention above; sources/registry.yaml
      does not state the bulletin's exact issue clock-time."
    tag: OPEN
  openmeteo_timezone_param:
    convention: "Every Open-Meteo URL in sources/registry.yaml explicitly passes
      timezone=Asia%2FBangkok -- hourly/daily arrays are LOCALISED to ICT when this param is
      set, per Open-Meteo's own documented behaviour (this repo's own collector code relies on
      this, per sources/registry.yaml notes on multiple openmeteo_* entries)."
    tag: VERIFIED
    note: "VERIFIED as 'this repo's registry states the param is always passed', not as an
      independent re-check of Open-Meteo's own server-side localisation behaviour this check."

