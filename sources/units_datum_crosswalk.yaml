      (RELAYED from general GloFAS/Copernicus documentation, not re-fetched this check)"
    grid_resolution: "~5 km (GloFAS native grid, RELAYED)"
    grid_vs_point_caveat: "3 fixed points (C.2 นครสวรรค์, เขื่อนเจ้าพระยา, สัมมากร per
