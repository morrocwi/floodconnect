notes_dwr_sub_basin_gap:
  - "DWR WebGIS (webgis.dwr.go.th) ArcGIS Server root (gis.dwr.go.th/arcgis/rest/services,
     f=json, unauthenticated) exposes a nationwide Sub_Basin MapServer layer with fields
     SB_CODE/SB_NAME_T/MB_CODE/MBASIN_T/MBASIN_E/AREA_SQKM + polygon geometry, queryable
     with standard ArcGIS REST (where=1=1&outFields=*&f=json), confirmed reachable and
     paginated (exceededTransferLimit:true on an unfiltered query, i.e. full national
     coverage, not a single sample). This is a DIRECT, downloadable replacement for the
     units.yaml A_U 'radius fallback r=3km (INSTINCT)' area figure used for HATYAI in the
     current backtest -- once a future run pages through by OBJECTID/bbox to find the
     Hat Yai / Nan / Chiang Mai sub-basin polygons specifically (this check's DWR budget
     spent finding+confirming the service, not yet extracting those 3 specific polygons).
     A name-substring query for 'อู่ตะเภา' matched zero features (sub-basin names use
     upstream-river naming, not the town/canal name) -- the correct SB_CODE/SB_NAME_T for
     Hat Yai's sub-basin needs either a spatial (bbox) query or manual lookup by basin
     code, not a name guess. See docs/knowledge/DATA_SWEEP_2026-09-27.md for the full
     endpoint list and licence status. Tag: RELAYED (service discovered + schema
     confirmed; specific polygons for our 3 units not yet extracted)."
  - "Same ArcGIS root also exposes a MapServer named
     'สถานีวัดระดับน้ำ_กรมชลประทาน' (RID water-level stations) with fields
     Region/Code/River/Detail/Amphoe/Province/Region_1/Time/Lat/Long/Basin_Code/Basin/
     Remark -- Code values look like RID's own station codes (sample row: Code='Sw.5A').
     This is a STATIC station directory (coordinates/metadata), not a live-value or
     history feed -- worth a future targeted query for X.94 / N.1 / N.64 / P.1 by Code to
     cross-check RID's own station naming against HII's numeric ids used above (not done
     this check -- budget spent confirming the layer exists and its field list). Tag: OPEN."
