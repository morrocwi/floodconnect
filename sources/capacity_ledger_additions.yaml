# capacity_ledger_additions.yaml -- Scope: new data only, from a data-sweep pass
# (2026-09-27). Does not edit sources/capacity_ledger.yaml itself. Schema
# mirrors that file's own row shape (element_th/en, capacity figure, tag, source, note).
# Not committed as part of this change -- a later pass decides whether/how to fold
# these rows into capacity_ledger.yaml proper.
#
# Founder task: fill outlet-capacity gaps that made PROP-FLOOD-06 backtest REFUSE
# NAN/CHIANGMAI 100% with OUTLET_CAPACITY_UNKNOWN (docs/BACKTEST_PROP_FLOOD_06_v0.md sec.2).
#
# Provenance for every qmax figure below: HII/thaiwater telemetry station metadata field
# "qmax" (found in the SAME cached public/waterlevel snapshot this repo's collect.py
# already pulls -- raw/live/thaiwater_waterlevel/2026-09-27T094357Z.json -- read locally,
# NO NEW HTTP REQUEST spent to obtain the qmax numbers themselves). This is HII's own
# station-level design/rated-capacity field, populated for their critical-level warning
# logic -- RELAYED tier (an agency-populated station attribute, not an independently
# re-derived RID/สทนช. hydraulic-capacity report read start-to-finish by this check).
# Treat as the best available proxy, not as VERIFIED bankfull capacity.

