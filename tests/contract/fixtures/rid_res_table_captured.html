				<form style="display:inline;">
					<div id="calendar-container" style="text-align:center;margin-top:10px"></div>
					<script language="JavaScript" type="text/javascript">
						window.onerror = null;
						var SPECIAL_DAYS = {
							0: [13, 24], // special days in January
							2: [1, 6, 8, 12, 18], // special days in March
							8: [21, 11] // special days in September
						};

						function dateIsSpecial(year, month, day) {
							var m = SPECIAL_DAYS[month];
							if (!m) return false;
							for (var i in m)
								if (m[i] == day) return true;
							return false;
						};

						Calendar.setup({
							inputField: 'cal',
							flat: "calendar-container", // ID of the parent element
							flatCallback: dateChanged, // our callback function
							dateStatusFunc: function (date, y, m, d) {
								if (dateIsSpecial(y, m, d)) return "special";
								else return false; // other dates are enabled
								// return true if you want to disable other dates
							}
						});

						function dateChanged(calendar) {
							var currentDate  = new Date();
							var image = document.getElementById("img_report");

							if (calendar.dateClicked && calendar.date <= currentDate) {
								// OK, a date was clicked, redirect to /yyyy/mm/dd/index.php
								var y = calendar.date.getFullYear();
								var m = calendar.date.getMonth(); // integer, 0..11
								var d = calendar.date.getDate(); // integer, 1..31
								m = m + 1
								window.onerror = null;
								if (m <= 9) m = "" + "0" + "" + m + "";
								if (d <= 9) d = "" + "0" + "" + d + "";
								var cal = "res_table/res" + d + m + y + ".gif";
								//window.parent.frames["right"].document.location.href=cal;
								image.src = cal;
							}
						};
					</script>
