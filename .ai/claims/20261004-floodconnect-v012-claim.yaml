intent: >
  v0.1.2, scoped per founder ruling 2026-10-04 ("ที่สำคัญคือให้ ตัวชี้วัดนี้น้ำน้ำท่วมต้องชัด"
  -- the flood indicators must be clear): a single closed indicators dictionary
  (docs/INDICATORS.md, English + plain Thai) naming, for each indicator already computed
  by this repository's v0.1.1 compute path, its one-line meaning, exact definition,
  unit, input source, agency-published thresholds (never invented), colour/level
  mapping, freshness rule, confidence rule, resolution label, a worked example, and
  what it does NOT mean -- plus a machine-readable "indicators" array added to
  model_spec.json (single source) and mirrored into system_capabilities.json, with a
  test asserting the two match and that README/llms.txt/AI_TIERS/EQUATIONS_FOR_AI link
  docs/INDICATORS.md. No new equation, no new agency threshold, no invented number --
  every indicator cites its existing v0.1.1 source (floodconnect_model.py,
  model_spec.json, kb.py). water_debt is listed with status "planned (v0.2+)" only, no
  value.

  Second pass on this same branch, after an independent review: the colour contract
  is now scoped to current_local_state and one_decision.level only -- every other
  indicator carries its own closed "levels" list and real "json_path" in both
  model_spec.json/system_capabilities.json and docs/INDICATORS.md, and the unverified
  "0 mismatches ... design review" sentence under bank_fill_percent is removed (the
  agency's own storage_percent formula is now marked relayed, not a Toledo theorem).
  A new offline output test (tests/test_floodconnect_model.py) runs kb.build_answer
  and floodconnect_model.one_decision against real fixture/offline data and asserts
  every emitted value is one of that indicator's own declared levels. Every answer
  now carries "indicators_doc": "docs/INDICATORS.md" at its top level. The
  Bangkok-only hotlines (1555, 1130) are now included only for a point actually
  inside the existing BANGKOK_METRO_BBOX, never nationwide. A new
  docs/NEAREST_STATION_RECIPE.md gives the step-by-step "find the nearest station
  yourself" recipe (which official sources, how to pick within radius on the same
  water body, how to read agency status) for an AI with no FloodConnect tool access,
  per the founder's "ให้การหาพิกัด ... เป็นหน้าที่ของเอไอของใครของมันแทน" ruling; README,
  llms.txt, docs/AI_TIERS.md, docs/EQUATIONS_FOR_AI.md and system_capabilities.json
  all now frame FloodConnect as the method (never a hosted geocoding/POI service) and
  link that recipe.

  Third pass on this same branch (founder ruling 2026-10-04, "ทำเลย v0.1.2
  ทั้งประเทศ"): the nationwide coarse-zoom generic read path IS now built, closing the
  gap the second pass above declared out of scope. `parsers.parse_thaiwater_waterlevel`
  now keeps `min_bank`/`ground_level`/`critical_level_msl`/`situation_level`/
  `diff_wl_bank`/`diff_wl_bank_text`/`river_name`/`sub_basin_id`/`basin_id`/agency/
  geocode/previous-value (exact paths MEASURED against one live GET, 2026-10-04 --
  `diff_wl_bank`/`diff_wl_bank_text`/`situation_level`/`storage_percent` are TOP-LEVEL,
  not under `station`). `collect.collect_thaiwater_waterlevel` fills
  `observations.bank`/`critical`/`status` (status = the agency's own verbatim code,
  `thaiwater_situation_<n>`, or `OVERBANK` when `diff_wl_bank_text` itself says
  "ล้นตลิ่ง") and the source is in `collect.ANSWER_SOURCES` with an explicit
  `max_age_hours: 24` in `sources/registry.yaml`. `floodconnect_model.STATUS_TO_LEVEL`
  is now the ONE closed status-word map (readout.py/kb.py read their sets off it,
  removing the previous duplicate copies) -- `NO_THRESHOLD` moved OUT of the
  normal-like/GREEN set into UNKNOWN (a real pre-existing bug this pass also fixed,
  the station carried no agency basis for GREEN at all). `readout.build_readout`
  gained one nationwide factor-4 block: nearest fresh station within 10 km decides at
