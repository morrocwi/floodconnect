intent: >
  Close 4 KG gaps found testing Pathum Thani against the shipped
  thailand_water_kg (25,883 nodes / 56,603 edges): (1) river reaches have
  no edges to gauges/gates/dams so upstream/downstream walks from a
  station are impossible; (2) admin-area nodes exist only for the 50
  Bangkok districts, no province/amphoe nodes elsewhere; (3) the
  governance DAG (provincial governor/RID/PAO, basin committees) is
  disconnected from assets/areas so accountability for a non-Bangkok
  point returns only AG_HII; (4) reaches carry no explicit main-stem tag.
  Fix: raise the river layer to Strahler>=4 in a new
  output/thailand_river_network.graphml (build_river_kg.py, existing
  thailand_river_flow.graphml untouched since build_bangkok_canals.py and
  klongmap_local_prior_experiment.py read it); add ON_REACH edges
  (asset->reach, nearest-line within 1km, RELAYED) and IN_SUBBASIN/
  IN_BASIN edges; add province/amphoe nodes nationwide from HII geocode
  fields (VERIFIED) and DWR Province_2556/Amphoe_2556 boundaries
  (VERIFIED-from-DWR-service) or OSM admin_level RELAYED fallback per
  founder gate; add province_agency_crosswalk.yaml linking the 9
  provincial governance triples + basin committees to province/basin
  nodes via RESPONSIBLE_FOR (role_template flag for the generic-template
  edges that cover the other provinces); tag main_stem from HydroRIVERS
  ORD_CLAS==1 and a documented basin_main_stem walk. No invented
  equations, no new DAG office nodes, no change to DSVA/Toledo objects.
  Sammakorn MVP path (Q0/Q1, kb.py answer) stays byte-identical.
