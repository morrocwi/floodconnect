intent: >
  Close 4 KG gaps found testing Pathum Thani against the shipped
  thailand_water_kg: (1) river reaches have no edges to gauges/gates/dams
  so upstream/downstream walks from a station are impossible; (2)
  admin-area nodes exist only for the 50 Bangkok districts, no
  province/amphoe nodes elsewhere; (3) the governance DAG (provincial
  governor/RID/PAO, basin committees) is disconnected from assets/areas
  so accountability for a non-Bangkok point returns only AG_HII; (4)
  reaches carry no explicit main-stem tag.

  ACTUAL build (build 7, post-review revision -- differs from this
  claim's original plan, corrected here rather than left to mislead a
  reader): existing output/thailand_river_flow.graphml is used AS-IS, no
  Strahler-order reclassification and no new
  output/thailand_river_network.graphml -- that file is never created.
  ON_REACH edges (asset->nearest river_reach) use a snap tolerance equal
  to THAT REACH'S OWN length_km (already in the HydroRIVERS data), never
  a fixed/invented distance like "1km". Province/amphoe nodes come
  ONLY from sources/hii_station_geocode.yaml's own already-harvested
  province_code/amphoe_code fields (VERIFIED, HII thaiwater geocode) --
  no DWR Province_2556/Amphoe_2556 polygons, no OSM admin_level fallback,
  and no new sources/admin_units.yaml or tools/harvest/dwr_admin.py (not
  built; a real polygon-boundary admin layer is a separate, larger task
  this build does not attempt). province_agency_crosswalk.yaml's 9
  provincial governance triples + 2 basin committees get RESPONSIBLE_FOR
  edges to their named province:*/basin:onwr:* node (tag VERIFIED); every
  other province/basin gets the generic AG_PROV_GOV/RID/PAO/AG_BASIN_CMT
  role node instead (tag RELAYED-GENERAL, role_template) --
  basin:onwr:88 ("นอกประเทศไทย", a sentinel, not a real ONWR basin) is
  excluded from the generic basin-committee edge. main_stem is tagged by
  a deterministic upstream walk from each HydroRIVERS main_river_id
  group's own outlet reach, branching at a confluence onto the inflow
  with the greatest discharge_avg_cms (both fields already in
  thailand_river_flow.graphml) -- not HydroRIVERS ORD_CLAS (not present
  in this repo's extract) and not a fixed Strahler cutoff. No new
  equation, no new DAG office node, no change to DSVA/Toledo objects.
  kb.py's `_answer_accountability` was changed (added a
  `FLOODCONNECT_USE_SHIPPED_KG` guard, see the second revision note
  below) but the Sammakorn MVP path's own ANSWER (Q0/Q1, `kb.py answer
  --at sammakorn/ram53`) is unchanged by this build -- the guard is
  what keeps it unchanged despite shipping the nationwide graph.
