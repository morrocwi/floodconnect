# advice/official_guidance_inventory.yaml -- S5/S6 (founder subtractive-fix
# ruling 2026-10-06, HIGH item 6): a per-page list of EVERY actionable item
# this repo has found on each cited guidance page, each pointing at the
# `advice/official_guidance.yaml` row id that carries it. `tests/
# test_official_parity.py`'s inventory-coverage test checks every one of
# those resolves to a REAL `tag: OFFICIAL` row with a non-empty `verbatim_th`
# and at least one `action_keys` entry that in turn has a matching ladder
# step -- never only "a row with some id exists". A page later found to
# carry an item not listed here is a gap in THIS file, not a passing parity
# count; add the row, then add it here too.
#
# This is a coverage checklist, not a second copy of the guidance text --
# `item` is a short label, not the quote (the quote lives in `verbatim_th` in
# `official_guidance.yaml`).
#
# S6 (2026-10-06): every page below was re-fetched live with a
# keyless `curl` GET (raw HTML saved under this worktree's own scratch
# directory, listed per page as `evidence_file`), and its article body was
# parsed into its own <li>/<p> blocks to build this list from scratch --
# never only re-used from an earlier pass's own notes. An item the source
# text carries but that is NOT a transferable action for this repo's
# Thailand-household scope is listed with `excluded: true` and a `reason`
# instead of an `og_id` -- it is still accounted for on this page (never
# silently dropped), it simply does not get a row in `official_guidance.yaml`
# or a parity verdict. A US/UK-named institution, program, phone number,
# scheme or brand is the main reason class; a sentence that is purely
# informational (no instruction to do anything) is the other.

