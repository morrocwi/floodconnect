# advice/official_guidance.yaml -- P-D, one row per official item
# (schemas/official_guidance.schema.json). Cited-data-file backing for the
# official-parity hard rule (design section G): every FloodConnect
# preparedness step must be equal to or stricter than the item here it claims
# to implement (advice/parity.py, tests/test_official_parity.py).
#
# Retrieval date for every `tag: OFFICIAL` row below: 2026-10-05.
# `tag` says whether an item was fetched/verbatim-confirmed at all (OFFICIAL) or
# not (OPEN, never invented). `source_class` (added 2026-10-05) says WHICH
# kind of fetched source it is, now that both OFFICIAL_TH and GENERAL rows exist --
# `OFFICIAL_TH` = independently fetched and verbatim-confirmed directly from a
# Thai agency's own domain (a .go.th government public-relations relay of
# another Thai agency's own words, e.g. PRD/prd.go.th, counts as that agency's
# own domain; a private news outlet never does); `GENERAL` = independently
# fetched and verbatim-confirmed from a named general-practice source (Ready.gov,
# gov.uk, American/IFRC Red Cross) -- never presented as, or substituted for, a
# Thai agency's own position. A news-site relay/paraphrase of EITHER kind of
# source is RELAYED, never entered here at all. `source_class` is always null
# on an OPEN row (nothing was fetched).
#
# `trigger_colour` is this repo's own FLOODCONNECT judgement of the latest
# colour by which the item should already be acted on (the agency text
# itself does not state a Jev Sandwich colour) -- set conservatively (as
# early as the item's own phase plausibly allows) so a parity check against
# it is a real test, not a rubber stamp.

