# advice/preparedness_ladder.yaml -- P-D, the ordered preparedness steps
# (schemas/advice.schema.json's `prepare_steps`; design section D).
#
# Cumulative order: GREEN < YELLOW < ORANGE < RED (each step's `colour` is the
# EARLIEST colour at which this repo asks a household to start it -- a step
# introduced at YELLOW is still relevant, and still shown, at ORANGE/RED/UNKNOWN).
# UNKNOWN includes every YELLOW step (advice/ladder.py:steps_for_colour), plus its
# own UNKNOWN-only row, per the design table.
#
# `source_tag: OFFICIAL` rows are backed by a row in advice/official_guidance.yaml
# with the SAME action_key, at a colour rank <= that official row's trigger_colour
# (advice/parity.py enforces this -- MISSING/WEAKER fails tests/test_official_parity.py).
# `source_tag: GENERAL` is the same backing relationship, but to a
# `source_class: GENERAL` row (a non-Thai-official general-practice source --
# Ready.gov, gov.uk, American/IFRC Red Cross) rather than a Thai agency's own
# domain. `source_tag: FLOODCONNECT` rows are this repo's own wording and carry no
# `official_ref` (schema rule: a step without official_ref must be FLOODCONNECT) --
# they are OPEN, not yet backed by a sourced official OR general-practice item,
# pending the founder.
#
# Every row has a `trigger_next` -- what advances past this step (never a bare "-"
# except the terminal UNKNOWN row, which has none to advance to on its own).

