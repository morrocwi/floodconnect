name: FloodConnect

# Multi-agent safety:
# - pull_request: validate architecture/claims + full regression before merge.
# - push/schedule/manual: validate first, then collect/build/deploy.
# - PR jobs never collect live data or deploy Pages.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: floodconnect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Architecture + full regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate repo knowledge graph
        run: python3 repo_knowledge_graph.py --validate

      - name: Validate active semantic claims
        run: python3 agent_claims.py --validate

      - name: Run full regression suite
        run: python3 -m pytest -q

  build:
    name: Build live public site
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt

      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Collect live snapshots (tolerant of per-source failures)
        # collect.py isolates one source's failure from the rest.
        # Some BMA hosts may reject GitHub shared IPs; site generation remains fail-soft
        # against partial snapshots.
        run: python3 collect.py --all || echo "collect had failures, continuing"

      - name: Build data.json
        run: python3 site/build_data.py

      - name: Build page (floodconnect.html + index.html)
        run: python3 site/build_page.py

      - name: Add .nojekyll
        run: touch site/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
